<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHITAL TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root { --gold:#D4A843; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#000; color:#fff; font-family:-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; background:#000; }
  iframe, video { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; background:#000; }
  .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(1000px 600px at 50% 30%, #241d10, #000); z-index:2; }
  .placeholder .om { font-size:90px; color:var(--gold); }
  .placeholder h1 { font-size:42px; letter-spacing:4px; color:var(--gold); margin-top:10px; }
  .placeholder p { color:#bbb; margin-top:10px; font-size:22px; }
  .brand { position:fixed; top:18px; left:24px; display:flex; align-items:center; gap:12px; z-index:5; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .brand img { height:46px; } .brand .t { font-size:22px; font-weight:700; letter-spacing:1px; color:var(--gold); }
  .clock { position:fixed; top:18px; right:24px; z-index:5; text-align:right; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .clock .time { font-size:30px; font-weight:700; } .clock .date { font-size:15px; color:#cfc8b8; }
  .ticker { position:fixed; left:0; right:0; bottom:0; z-index:5; background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); padding:18px 0 12px; overflow:hidden; white-space:nowrap; }
  .ticker .run { display:inline-block; padding-left:100%; animation:scroll 30s linear infinite; font-size:22px; }
  .ticker .run b { color:var(--gold); margin:0 28px; }
  @keyframes scroll { to { transform:translateX(-100%); } }
  .tap { position:fixed; inset:0; z-index:6; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.4); cursor:pointer; }
  .tap span { background:var(--gold); color:#1a1207; padding:14px 26px; border-radius:30px; font-weight:700; font-size:20px; }
</style>
</head>
<body>
  <div id="stage">
    <div class="placeholder" id="ph"><div class="om">🕉</div><h1 id="phTitle">SHITAL TV</h1><p id="phMsg">Channel starting soon…</p></div>
  </div>
  <div class="brand"><img id="logo" style="display:none"><span class="t" id="title"></span></div>
  <div class="clock" id="clockBox"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div class="ticker" id="tickerBox" style="display:none"><div class="run" id="ticker"></div></div>
  <div class="tap" id="tap" onclick="unmute()"><span>▶ Tap for sound</span></div>

<script>
const API = "/tv-api/api/v1/tv/shital";
let curKey = "", hls = null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
function inRange(now,a,b){ return a&&b&&(a<=b?(now>=a&&now<b):(now>=a||now<b)); }
function inWindow(c){ if(!c.daily_start||!c.daily_end) return true; return inRange(hhmm(new Date()),c.daily_start,c.daily_end); }
function ytId(s){ s=(s||'').trim(); if(!s) return ''; if(/^[\w-]{11}$/.test(s)) return s;
  try{ const u=new URL(s); if(u.searchParams.get('v')) return u.searchParams.get('v');
    const p=u.pathname.split('/').filter(Boolean); const i=p.findIndex(x=>['live','embed','shorts','v'].includes(x));
    if(i>=0&&p[i+1]) return p[i+1]; if(u.hostname.includes('youtu.be')) return p[0]||''; }catch(e){} return s; }
function ytSrc(c){
  const base="https://www.youtube.com/embed/", com="autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3";
  if(c.mode==="scheduled"&&(c.schedule||[]).length){ const now=hhmm(new Date()); const s=c.schedule.find(x=>inRange(now,x.start,x.end)); if(s&&s.id) return base+ytId(s.id)+"?"+com; }
  if(c.mode==="playlist"&&(c.playlist||[]).length){ const ids=c.playlist.map(p=>ytId(p.id||p)).filter(Boolean); if(ids.length) return base+ids[0]+"?"+com+"&loop=1&playlist="+ids.join(","); }
  if(c.live_is_channel&&c.live_youtube_id) return base+"live_stream?channel="+c.live_youtube_id+"&"+com;
  if(c.live_youtube_id) return base+ytId(c.live_youtube_id)+"?"+com;
  return "";
}
function target(c){
  if(c.mode==="live"){
    if(!inWindow(c)) return {type:"idle", msg:"Live darshan resumes at "+(c.daily_start||"08:00")};
    if(c.live_kind==="hls") return c.hls_url ? {type:"hls", url:c.hls_url} : {type:"idle", msg:"Live darshan not configured yet"};
    const s=ytSrc(c); return s ? {type:"yt", src:s} : {type:"idle", msg:"Live darshan starting soon…"};
  }
  const s=ytSrc(c); return s ? {type:"yt", src:s} : {type:"idle", msg:"Channel starting soon…"};
}
function clearStage(){ const st=$("stage"); st.querySelectorAll("iframe,video").forEach(e=>e.remove()); if(hls){ try{hls.destroy();}catch(e){} hls=null; } }
function showIdle(msg){ $("ph").style.display="flex"; $("phMsg").textContent=msg||""; $("tap").style.display="none"; }
function playHls(url){
  $("ph").style.display="flex"; $("phMsg").textContent="Connecting to live darshan…";
  const v=document.createElement("video"); v.autoplay=true; v.muted=true; v.playsInline=true; v.controls=false;
  $("stage").appendChild(v);
  const onReady=()=>{ $("ph").style.display="none"; $("tap").style.display="flex"; v.play().catch(()=>{}); };
  if(window.Hls && Hls.isSupported()){
    hls=new Hls({lowLatencyMode:false, liveSyncDurationCount:4});
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, onReady);
    hls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal){ curKey=""; /* force retry on next poll */ } });
  } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src=url; v.addEventListener("loadedmetadata", onReady); v.addEventListener("error", ()=>{ curKey=""; });
  } else { showIdle("This screen can't play the live stream"); }
}
function playYt(src){
  $("ph").style.display="none";
  const f=document.createElement("iframe"); f.allow="autoplay; encrypted-media; fullscreen"; f.allowFullscreen=true; f.src=src;
  $("stage").appendChild(f); $("tap").style.display="flex";
}
function apply(c){
  const t=target(c); const key=JSON.stringify(t);
  if(key===curKey) return; curKey=key; clearStage();
  if(t.type==="hls") playHls(t.url);
  else if(t.type==="yt") playYt(t.src);
  else showIdle(t.msg);
}
function render(c){
  $("title").textContent=c.title||""; $("phTitle").textContent=c.title||"SHITAL TV";
  const lg=$("logo"); if(c.logo_url){ lg.src=c.logo_url; lg.style.display="block"; } else lg.style.display="none";
  $("clockBox").style.display = c.show_clock===false ? "none":"block";
  const tk=(c.ticker||[]).filter(Boolean), tb=$("tickerBox");
  if(tk.length){ $("ticker").innerHTML=tk.map(t=>"<b>•</b>"+esc(t)).join(""); tb.style.display="block"; } else tb.style.display="none";
  apply(c);
}
function esc(s){ return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function tick(){ const d=new Date(); $("time").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); $("date").textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}); }
function unmute(){ const v=document.querySelector("#stage video"); if(v){ v.muted=false; v.play().catch(()=>{}); }
  const f=document.querySelector("#stage iframe"); if(f){ f.src=f.src.replace("mute=1","mute=0"); } $("tap").style.display="none"; }
async function load(){ try{ const r=await fetch(API,{cache:"no-store"}); if(r.ok) render(await r.json()); }catch(e){} }
tick(); setInterval(tick,1000); load(); setInterval(load,15000);
</script>
</body>
</html>
