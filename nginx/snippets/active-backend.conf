# Active backend upstream for nginx — included from every location that
# proxies to the backend (see nginx/conf.d/shital.conf).
#
# Today this points at the docker compose service name `backend`, which docker's
# internal DNS (127.0.0.11) resolves per-request thanks to the `resolver`
# directive in the surrounding server block. Behavior is identical to the old
# inline `set $be http://backend:8000;` lines.
#
# When blue/green is enabled (see deployer/promote_bluegreen.sh, future work),
# the deployer will rewrite this single file to point at a specific colored
# container, e.g.
#   set $be http://shitaleco-backend-green-1:8000;
# and reload nginx (`nginx -s reload`) to atomically switch traffic. The
# include-once-per-location pattern means there is exactly one place to
# rewrite, not three.
set $be http://backend:8000;
