# ─── Neuron Master Platform ───────────────────────────────────────────────────
# Vhost for neuron.shital.org.uk → neuron-master:8088 (smart factory platform).
# Storage is fully isolated from ShitalEco; the upstream is on the same Docker
# 'internal' network purely so nginx can reach it.
#
# Before this vhost can serve HTTPS, the Let's Encrypt cert at
#   /etc/letsencrypt/live/shital.org.uk/
# needs neuron.shital.org.uk added as a SAN. On the production VPS:
#
#   docker compose -f /opt/shitaleco/docker-compose.prod.yml run --rm certbot \
#     certonly --webroot -w /var/www/certbot \
#     --expand --cert-name shital.org.uk \
#     -d shital.org.uk -d www.shital.org.uk \
#     -d admin.shital.org.uk -d kiosk.shital.org.uk \
#     -d donate.shital.org.uk -d screen.shital.org.uk \
#     -d service.shital.org.uk -d neuron.shital.org.uk
#   docker compose -f /opt/shitaleco/docker-compose.prod.yml exec nginx nginx -s reload
#
# Until that runs, only the HTTP redirect block below is active; the HTTPS
# block is gated by `if ($ssl_server_name)` — nginx will simply fall through.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name neuron.shital.org.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://neuron.shital.org.uk$request_uri;
    }
}

# ── HTTPS proxy ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name neuron.shital.org.uk;

    ssl_certificate     /etc/letsencrypt/live/shital.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shital.org.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Generous body size for firmware bundle uploads + manifest editing.
    client_max_body_size 32M;

    # Proxy everything (UI, /api/*, /docs, /static, /healthz, /login, /logout)
    # to the Neuron Master container. The Master enforces its own auth model:
    # session cookies for the browser UI, X-API-Key header for machines.
    location / {
        set $neu http://neuron-master:8088;
        proxy_pass         $neu;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}
