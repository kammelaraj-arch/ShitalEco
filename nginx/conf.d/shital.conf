# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name shital.org.uk www.shital.org.uk
                admin.shital.org.uk kiosk.shital.org.uk
                donate.shital.org.uk screen.shital.org.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── service.shital.org.uk — HTTP → HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name service.shital.org.uk;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://service.shital.org.uk$request_uri; }
}

# ─── HTTPS — single server block for all traffic ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name shital.org.uk www.shital.org.uk
                admin.shital.org.uk kiosk.shital.org.uk
                donate.shital.org.uk screen.shital.org.uk;

    ssl_certificate     /etc/letsencrypt/live/shital.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shital.org.uk/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — once a browser sees this header, it remembers "ALWAYS HTTPS"
    # for shital.org.uk + every subdomain for 6 months. Stops kiosk
    # devices that bookmarked http://… from ever loading insecurely
    # again. Also satisfies the "secure connection" requirement that
    # PayPal hosted card fields enforce. max-age=15768000 = 6 months;
    # short enough that a future emergency rollback to HTTP is still
    # possible without browsers locking users out.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/active-backend.conf;
        proxy_pass         $be;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
    }

    location /health {
        include /etc/nginx/snippets/active-backend.conf;
        proxy_pass        $be;
        proxy_set_header  Host $host;
        proxy_connect_timeout 5s;
    }

    # ── Azure AD callback compat: rewrite /auth-callback → /admin/auth-callback/
    # Belt-and-braces for an old MS_REDIRECT_URI value (or Azure registration)
    # that omits the /admin basePath. The id_token is in the URL hash and is
    # preserved by the browser across 301 redirects, so the popup still lands
    # on the real callback page with the token intact.
    location = /auth-callback        { return 301 /admin/auth-callback/$is_args$args; }
    location = /auth-callback/       { return 301 /admin/auth-callback/$is_args$args; }

    # ── Admin portal ──────────────────────────────────────────────────────────
    location /admin {
        set $adm http://admin:80;
        proxy_pass         $adm;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        error_page 502 503 504 /502-admin.html;
    }

    # ── Admin basePath safety-net: 301 any known admin route hit without
    # the /admin/ prefix to the correct /admin/* URL. This catches:
    #   • Stale browser caches serving old Link bundles that lacked basePath
    #   • User-typed bookmarks like admin.shital.org.uk/dashboard
    #   • Legacy app-generated URLs that forgot the prefix
    # Without this, those URLs fall through to `location /` below and serve
    # the Shital Platform launcher instead of the admin page the user asked
    # for — exactly the UX bug reported on 23 Oct. The 301 is cacheable so
    # browsers remember the correct URL for next time.
    # Enumerated — one line per top-level admin section so a user typing
    # /anything-else still lands on the launcher.
    location = /dashboard                 { return 301 /admin/dashboard/$is_args$args; }
    location = /dashboard/                { return 301 /admin/dashboard/$is_args$args; }
    location ~ ^/finance(/.*)?$           { return 301 /admin/finance$1$is_args$args; }
    location ~ ^/hr(/.*)?$                { return 301 /admin/hr$1$is_args$args; }
    location ~ ^/payroll(/.*)?$           { return 301 /admin/payroll$1$is_args$args; }
    location ~ ^/donations(/.*)?$         { return 301 /admin/donations$1$is_args$args; }
    location ~ ^/recurring-giving(/.*)?$  { return 301 /admin/recurring-giving$1$is_args$args; }
    location ~ ^/gift-aid(/.*)?$          { return 301 /admin/gift-aid$1$is_args$args; }
    location ~ ^/budgets(/.*)?$           { return 301 /admin/budgets$1$is_args$args; }
    location ~ ^/bank-accounts(/.*)?$     { return 301 /admin/bank-accounts$1$is_args$args; }
    location ~ ^/accounts(/.*)?$          { return 301 /admin/accounts$1$is_args$args; }
    location ~ ^/addresses(/.*)?$         { return 301 /admin/addresses$1$is_args$args; }
    location ~ ^/ai(/.*)?$                { return 301 /admin/ai$1$is_args$args; }
    location ~ ^/assets(/.*)?$            { return 301 /admin/assets$1$is_args$args; }
    location ~ ^/attendance(/.*)?$        { return 301 /admin/attendance$1$is_args$args; }
    location ~ ^/activities(/.*)?$        { return 301 /admin/activities$1$is_args$args; }
    location ~ ^/audit(/.*)?$             { return 301 /admin/audit$1$is_args$args; }
    location ~ ^/board(/.*)?$             { return 301 /admin/board$1$is_args$args; }
    location ~ ^/bookings(/.*)?$          { return 301 /admin/bookings$1$is_args$args; }
    location ~ ^/broadcast(/.*)?$         { return 301 /admin/broadcast$1$is_args$args; }
    location ~ ^/compliance(/.*)?$        { return 301 /admin/compliance$1$is_args$args; }
    location ~ ^/contacts(/.*)?$          { return 301 /admin/contacts$1$is_args$args; }
    location ~ ^/devices(/.*)?$           { return 301 /admin/devices$1$is_args$args; }
    location ~ ^/documents(/.*)?$         { return 301 /admin/documents$1$is_args$args; }
    location ~ ^/key-register(/.*)?$      { return 301 /admin/key-register$1$is_args$args; }
    location ~ ^/media(/.*)?$             { return 301 /admin/media$1$is_args$args; }
    location ~ ^/menu-profiles(/.*)?$     { return 301 /admin/menu-profiles$1$is_args$args; }
    location ~ ^/screen(/.*)?$            { return 301 /admin/screen$1$is_args$args; }
    location ~ ^/settings(/.*)?$          { return 301 /admin/settings$1$is_args$args; }
    location ~ ^/seva(/.*)?$              { return 301 /admin/seva$1$is_args$args; }
    location ~ ^/terminal-devices(/.*)?$  { return 301 /admin/terminal-devices$1$is_args$args; }
    location ~ ^/volunteers(/.*)?$        { return 301 /admin/volunteers$1$is_args$args; }
    location ~ ^/downloads(/.*)?$         { return 301 /admin/downloads$1$is_args$args; }
    location ~ ^/login(/.*)?$             { return 301 /admin/login$1$is_args$args; }
    location ~ ^/logout(/.*)?$            { return 301 /admin/login$1$is_args$args; }
    location = /502-admin.html {
        root /usr/share/nginx/errors;
        internal;
    }

    # ── Kiosk ─────────────────────────────────────────────────────────────────
    location = /kiosk { return 301 /kiosk/; }
    location /kiosk/ {
        set $ksk http://kiosk:80;
        rewrite ^/kiosk/(.*)$ /$1 break;
        proxy_pass         $ksk;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # ── Screen ────────────────────────────────────────────────────────────────
    location = /screen { return 301 /screen/; }
    location /screen/ {
        set $sc http://screen:80;
        rewrite ^/screen/(.*)$ /$1 break;
        proxy_pass         $sc;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # ── Donations ─────────────────────────────────────────────────────────────
    location = /donate { return 301 /donate/; }
    location /donate/ {
        set $qd http://quick-donation:80;
        rewrite ^/donate/(.*)$ /$1 break;
        proxy_pass         $qd;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # ── Webhook deployer ──────────────────────────────────────────────────────
    location = /deploy {
        set $dep http://deployer:9000;
        proxy_pass         $dep;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ── Hub (root) ────────────────────────────────────────────────────────────
    location = / {
        root  /usr/share/nginx/hub;
        index index.html;
        try_files /index.html =404;
    }
    # Sub-pages under the hub (currently /tv/). Tries the literal path first,
    # then the directory's index.html, then falls back to the hub launcher.
    # The $uri/ branch is what makes /tv → /tv/index.html resolve.
    location / {
        root  /usr/share/nginx/hub;
        try_files $uri $uri/ /index.html;
    }
}

# ─── service.shital.org.uk — dedicated HTTPS server ──────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name service.shital.org.uk;

    ssl_certificate     /etc/letsencrypt/live/shital.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shital.org.uk/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — see comment in main shital.org.uk server block.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Backend API pass-through ──────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/active-backend.conf;
        proxy_pass         $be;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
    }

    # ── Service portal app ────────────────────────────────────────────────────
    location / {
        set $svc http://service:80;
        proxy_pass         $svc;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ─── dev.shital.org.uk — HTTP → HTTPS redirect ───────────────────────────────
server {
    listen 80;
    server_name dev.shital.org.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://dev.shital.org.uk$request_uri;
    }
}

# ─── dev.shital.org.uk — HTTPS (proxies to dev stack via host port 8080) ─────
server {
    listen 443 ssl;
    http2 on;
    server_name dev.shital.org.uk;

    ssl_certificate     /etc/letsencrypt/live/shital.org.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shital.org.uk/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header X-Environment "dev" always;

    # Forward all traffic to the dev nginx running on port 8080 on the host.
    # host.docker.internal resolves via extra_hosts in docker-compose.yml.
    location / {
        proxy_pass         http://172.17.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
    }
}
