name: Catch the 2nd recreator + stop host timer

# Backend still recreated every ~6 min even with deployer watchdog OFF.
# Capture the kill/create events with FULL labels (compose version pinpoints
# the source: 5.1.3=deployer, 2.40.3=host CLI). Then stop the host systemd
# shital-assert-state.timer (the other thing that runs `compose up backend`
# on an interval), restart backend, and watch 8 min with BOTH the deployer
# watchdog and the host timer disabled. If it stays up, we've found it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catch-and-kill-recreator.yml'

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 12m
          script: |
            set +e

            echo "=== FULL kill/create events for backend, last 8 min (labels = source) ==="
            docker events --since 8m --until 0s --filter container=shitaleco-backend-1 2>&1 \
              | grep -vE 'exec_|health_status' \
              | grep -oE '(kill|die|create|start|destroy).*com.docker.compose.(version|project.working_dir)=[^,]*' \
              | tail -30
            echo "  --- raw (in case grep above is empty) ---"
            docker events --since 8m --until 0s --filter container=shitaleco-backend-1 2>&1 \
              | grep -E 'container (kill|die|create|destroy)' | tail -10 \
              | sed -E 's/.*(container (kill|die|create|destroy)).*compose.version=([^,]*).*working_dir=([^,) ]*).*/\1 compose=\3 wd=\4/'

            echo ""
            echo "=== host crontab + systemd timers that touch docker ==="
            crontab -l 2>/dev/null | grep -vE '^#|^$'
            systemctl list-timers --all --no-pager 2>&1 | grep -iE 'shital|assert|deploy' || echo "  no shital timers"

            echo ""
            echo "=== assert-state.log last 12 lines (is IT recreating?) ==="
            tail -12 /var/log/shital-assert-state.log 2>/dev/null || echo "  none"

            echo ""
            echo "=== STOP + DISABLE the host assert-state timer (eliminate it) ==="
            systemctl stop shital-assert-state.timer 2>&1
            systemctl disable shital-assert-state.timer 2>&1
            systemctl is-active shital-assert-state.timer 2>&1

            echo ""
            echo "=== confirm deployer watchdog still OFF ==="
            docker exec shitaleco-deployer-1 sh -c 'echo DEPLOY_WATCHDOG=$DEPLOY_WATCHDOG' 2>&1 | head -1

            echo ""
            echo "=== restart backend, then watch 8 min with BOTH recreators disabled ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            state=$(docker inspect shitaleco-backend-1 --format '{{.State.Status}}' 2>/dev/null || echo absent)
            if [ "$state" != "running" ]; then
              docker rm -f shitaleco-backend-1 2>/dev/null; sleep 2
              docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -5
            fi

            echo "  waiting for healthy..."
            for i in $(seq 1 48); do
              sleep 5
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "  healthy after $((i*5))s"; break; }
            done

            echo "  watching 8 min (StartedAt constant = no recreate):"
            BASE=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
            for i in $(seq 1 16); do
              sleep 30
              now=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$now" != "$BASE" ]; then
                echo "  [$((i*30))s] ⚠️ RECREATED (StartedAt $BASE → $now) :8000=$c"
                echo "    events in last 60s:"
                docker events --since 60s --until 0s --filter container=shitaleco-backend-1 2>&1 | grep -E 'kill|die|create' | tail -5
                BASE="$now"
              else
                echo "  [$((i*30))s] stable :8000=$c"
              fi
            done

            echo ""
            echo "=== final ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
