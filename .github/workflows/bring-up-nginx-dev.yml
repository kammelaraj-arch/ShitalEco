# bring nginx-dev back 2026-06-23T21:17

# nginx-dev container doesn't exist on the host — diag confirmed:
# "Error: No such container: shitaleco-dev-nginx-dev-1"
# Backend-dev is healthy inside, but with no nginx in front the external
# dev.shital.org.uk returns 502. compose up -d nginx-dev creates it.
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/bring-up-nginx-dev.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set +e
            cd /opt/shitaleco-dev
            if [ -f .env.dev ]; then set -a; . .env.dev; set +a; fi
            echo "=== current nginx-dev container state ==="
            docker ps -a --filter 'name=shitaleco-dev-nginx-dev' --format 'table {{.Names}}\t{{.Status}}' | head -5

            echo ""
            echo "=== Create nginx-dev via compose up -d (no force-recreate, no pull) ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d nginx-dev 2>&1 | tail -10

            sleep 6
            echo ""
            echo "=== after ==="
            docker ps --filter 'name=shitaleco-dev-' --format 'table {{.Names}}\t{{.Status}}'
            echo ""
            curl -sk -o /dev/null -w "/health → %{http_code}\n" -m 8 https://dev.shital.org.uk/health
            curl -sk -o /dev/null -w "/        → %{http_code}\n" -m 8 https://dev.shital.org.uk/
            n=$(curl -sk -m 12 https://dev.shital.org.uk/openapi.json 2>/dev/null | grep -c 'refresh-from-paypal' 2>/dev/null | head -1 || echo 0)
            echo "openapi refresh-from-paypal: $n"
            [ "${n:-0}" -gt 0 ] 2>/dev/null && echo "✅ Dev READY on new code" || echo "!!! check above"
