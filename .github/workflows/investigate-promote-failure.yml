name: Investigate why promote-to-prod broke prod (READ-ONLY)

# The user clicked Promote-to-Prod at ~14:18; prod went 503 across all
# services (not just backend → so multiple containers stopped). The
# patched deploy.sh + pinned compose project name should have prevented
# the workspace-* race. So something else failed.
#
# This workflow only READS state — no container touches, no compose
# commands. Pulls the last deploy from deploy-history.jsonl, deployer
# container logs, docker events for the relevant window, and assert-
# state log entries.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/investigate-promote-failure.yml'
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set +e

            echo "============================================================"
            echo "==  1) Last 8 entries from deploy-history.jsonl            =="
            echo "============================================================"
            tail -8 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null \
              | jq -c '{at, env, sha: .short, status, message: .message[:120]}' 2>/dev/null \
              || tail -8 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null \
              || echo "  no deploy-history.jsonl"

            echo ""
            echo "============================================================"
            echo "==  2) Deployer container — last 200 log lines              =="
            echo "============================================================"
            docker logs --tail 200 shitaleco-deployer-1 2>&1 | tail -200

            echo ""
            echo "============================================================"
            echo "==  3) Docker events for backend/admin/nginx — last 30 min  =="
            echo "============================================================"
            docker events --since 30m --until 0s \
              --filter container=shitaleco-backend-1 \
              --filter container=shitaleco-admin-1 \
              --filter container=shitaleco-quick-donation-1 \
              --filter container=shitaleco-kiosk-1 \
              --filter container=shitaleco-screen-1 \
              --filter container=shitaleco-service-1 \
              --filter container=shitaleco-nginx-1 \
              2>&1 | tail -60

            echo ""
            echo "============================================================"
            echo "==  4) Current container roster                            =="
            echo "============================================================"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | head -30

            echo ""
            echo "============================================================"
            echo "==  5) assert-state.log — last 60 lines                    =="
            echo "============================================================"
            tail -60 /var/log/shital-assert-state.log 2>/dev/null || echo "  no assert-state.log"

            echo ""
            echo "============================================================"
            echo "==  6) Promote backend log dump from /opt/shitaleco/backups =="
            echo "============================================================"
            ls -lt /opt/shitaleco/backups/promote-backend-*.log 2>/dev/null | head -3
            recent=$(ls -t /opt/shitaleco/backups/promote-backend-*.log 2>/dev/null | head -1)
            if [ -n "$recent" ]; then
              echo "--- $recent ---"
              tail -60 "$recent"
            else
              echo "  no promote log files"
            fi

            echo ""
            echo "============================================================"
            echo "==  7) Verify deploy.sh has the patches                    =="
            echo "============================================================"
            echo "Has '-p shitaleco' COMPOSE_CMD?:"
            grep -nE 'PROJECT_FLAG=|docker compose \$PROJECT_FLAG' /opt/shitaleco/deployer/deploy.sh | head -5
            echo ""
            echo "Has Step 0 workspace purge?:"
            grep -nE 'workspace-\* zombie|Step 0: purge' /opt/shitaleco/deployer/deploy.sh | head -3

            echo ""
            echo "============================================================"
            echo "==  8) docker-compose.prod.yml top — verify 'name:' pinned =="
            echo "============================================================"
            head -15 /opt/shitaleco/docker-compose.prod.yml
