name: Deploy to Vultr

on:
  # ONLY manual trigger — prod must never restart on a code push.
  #
  # Previously this listened for `push: branches: [main]` and `workflow_run`
  # from CI, which meant every merge into main auto-restarted prod.
  # That violated the proper deploy flow (dev → verify → manual promote)
  # and was the root cause of the 11-Jun "five deploys in a row each with
  # 5-10 min downtime" incident. Operators were merging code intending to
  # only hit dev — but prod kept getting kicked.
  #
  # Now: only fires when an operator explicitly clicks
  #   - "Promote to Prod" in System Ops UI (which calls the deployer's
  #     /promote-prod endpoint directly — doesn't use this workflow)
  #   - workflow_dispatch from the GitHub Actions UI (emergency path)
  #
  # Main pushes still trigger `Deploy to Dev` automatically (see
  # deploy-dev.yml) — that flow is unchanged and is the right place for
  # auto-deploy.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook deployer (preferred — bypasses fail2ban)
        run: |
          SECRET="${{ secrets.DEPLOY_SECRET }}"
          SECRET="${SECRET:-ShitalDeploy2026!}"
          curl -X POST https://shital.org.uk/deploy \
            -H "X-Deploy-Secret: ${SECRET}" \
            --max-time 15 --retry 3 --retry-delay 5 || true

      # SSH fallback: used if webhook deployer is not responding.
      # IMPORTANT: This script does NOT build images — builds happen in CI.
      #            It only pulls pre-built images from GHCR and restarts.
      - name: SSH fallback
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 600s
          # 10m was killing the SSH session mid-deploy: backend cold start
          # (alembic + patch_schema + sync_from_digital_dna + 4 seed funcs)
          # + image pulls + frontend restarts + nginx reload + watchdog cron
          # install genuinely takes 8-15 min on this 2GB VPS. The deploy was
          # SUCCEEDING (router_mounted lines were streaming) and SSH gave up
          # mid-flight → job marked failed, but deploy.sh on the VPS was
          # killed before doing frontends/nginx, leaving the stack
          # inconsistent. 25m gives full headroom.
          command_timeout: 25m
          envs: GH_PAT,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,ANTHROPIC_API_KEY,SENDGRID_API_KEY,MS_CLIENT_ID,MS_TENANT_ID,MS_CLIENT_SECRET,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,GITHUB_SHA
          script: |
            set -e

            # ── Docker ────────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi
            systemctl enable docker && systemctl start docker || true

            # ── Clone / update repo ───────────────────────────────────────────
            if [ -d /opt/shitaleco/.git ]; then
              cd /opt/shitaleco
              git fetch origin
              git reset --hard origin/main
            else
              apt-get install -y git -q
              git clone --branch main \
                https://${GH_PAT}@github.com/kammelaraj-arch/ShitalEco.git /opt/shitaleco
            fi
            cd /opt/shitaleco

            # ── .env ─────────────────────────────────────────────────────────
            if [ ! -f .env ]; then
              cat > .env << 'ENVEOF'
            POSTGRES_DB=shitaleco_db
            POSTGRES_USER=shitaleco_db_user
            POSTGRES_PASSWORD=ShitalEco2024Prod!
            JWT_SECRET=shital-temple-erp-jwt-secret-2024-london-prod
            APP_ENV=production
            ENVEOF
            fi

            inject() {
              local key=$1 val=$2
              [ -z "$val" ] && return
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            inject STRIPE_SECRET_KEY      "$STRIPE_SECRET_KEY"
            inject STRIPE_PUBLISHABLE_KEY "$STRIPE_PUBLISHABLE_KEY"
            inject ANTHROPIC_API_KEY      "$ANTHROPIC_API_KEY"
            inject SENDGRID_API_KEY       "$SENDGRID_API_KEY"
            inject MS_CLIENT_ID           "$MS_CLIENT_ID"
            inject MS_TENANT_ID           "$MS_TENANT_ID"
            inject MS_CLIENT_SECRET       "$MS_CLIENT_SECRET"
            inject PAYPAL_CLIENT_ID       "$PAYPAL_CLIENT_ID"
            inject PAYPAL_CLIENT_SECRET   "$PAYPAL_CLIENT_SECRET"
            inject GITHUB_TOKEN           "$GH_PAT"
            inject CORS_ORIGINS           "https://shital.org.uk,https://admin.shital.org.uk,https://kiosk.shital.org.uk,https://donate.shital.org.uk,https://screen.shital.org.uk,https://dev.shital.org.uk,https://localhost,capacitor://localhost,http://localhost"
            inject MS_REDIRECT_URI        "https://admin.shital.org.uk/auth-callback"
            inject MAIL_AGENT_MAILBOXES   "accounts@shirdisai.org.uk,gtrustees@shirdisai.org.uk"
            inject MAIL_AGENT_MODE        "auto"

            # ── Weekly cron to prune dangling images (idempotent) ────────────
            cat > /etc/cron.d/docker-prune << 'CRONEOF'
            0 3 * * 0 root docker image prune -f && docker container prune -f >> /var/log/docker-prune.log 2>&1
            CRONEOF
            chmod 644 /etc/cron.d/docker-prune

            # ── Firewall ──────────────────────────────────────────────────────
            ufw allow 22/tcp  2>/dev/null || true
            ufw allow 80/tcp  2>/dev/null || true
            ufw allow 443/tcp 2>/dev/null || true
            ufw --force enable 2>/dev/null || true

            # ── fail2ban: stop banning GitHub Actions IPs ────────────────────
            if command -v fail2ban-client &>/dev/null; then
              fail2ban-client unban --all           2>/dev/null || true
              fail2ban-client set sshd maxretry 100 2>/dev/null || true
              fail2ban-client set sshd bantime  60  2>/dev/null || true
            fi

            # ── Ensure DB and nginx are up ────────────────────────────────────
            docker compose -f docker-compose.prod.yml up -d db nginx 2>/dev/null || true
            echo "Waiting for DB..."
            for i in $(seq 1 30); do
              sleep 2
              docker compose -f docker-compose.prod.yml exec -T db \
                pg_isready -U shitaleco_db_user -d shitaleco_db &>/dev/null && break
              echo "  db attempt $i/30..."
            done

            # ── Login to GHCR ─────────────────────────────────────────────────
            echo "$GH_PAT" | docker login ghcr.io -u kammelaraj-arch --password-stdin
            echo "Logged in to GHCR"

            # ── Pre-promote snapshot ─────────────────────────────────────────
            # Capture the about-to-be-replaced state so the System Ops →
            # Promote Snapshots panel can list it (and Restore can roll back).
            # Two parts: a pg_dump of the live DB + a :promote-<ts> tag on the
            # current :latest of every service image. The deployer's
            # /snapshots endpoint lists BOTH sources, so an image-only entry
            # (pg_dump failure) is still surfaced for image-rollback.
            #
            # Until now snapshots were ONLY taken by deploy.sh --promote-prod
            # (the panel button → deployer container path). Every successful
            # merge-driven deploy bypassed snapshotting entirely, which is
            # why the panel showed "No snapshots yet" despite months of
            # successful deploys.
            SNAP_TS=$(date -u +'%Y%m%dT%H%M%SZ')
            SNAP_SHA="${GITHUB_SHA:0:7}"
            SNAP_DIR=/opt/shitaleco/backups
            mkdir -p "$SNAP_DIR"
            echo "=== Pre-promote snapshot ${SNAP_TS} (${SNAP_SHA}) ==="
            SNAP_DB="${SNAP_DIR}/promote-${SNAP_TS}-${SNAP_SHA}.sql.gz"
            SNAP_ERR="${SNAP_DIR}/promote-${SNAP_TS}-pg_dump.log"
            if docker compose -f docker-compose.prod.yml exec -T db \
                 pg_dump -U shitaleco_db_user -d shitaleco_db 2>"$SNAP_ERR" \
               | gzip > "$SNAP_DB" && [ -s "$SNAP_DB" ]; then
              rm -f "$SNAP_ERR"
              echo "  ✓ DB dump → ${SNAP_DB} ($(du -h "$SNAP_DB" | cut -f1))"
            else
              rm -f "$SNAP_DB"
              echo "  ✗ DB dump failed — see ${SNAP_ERR}; continuing with image-only snapshot"
            fi
            # Image tag snapshot — runs even if pg_dump failed, so an image-
            # only rollback is still possible.
            for svc in backend admin quick-donation kiosk screen service deployer; do
              img="ghcr.io/kammelaraj-arch/shitaleco-${svc}"
              if docker tag "${img}:latest" "${img}:promote-${SNAP_TS}" 2>/dev/null; then
                echo "  ✓ tagged ${svc}:promote-${SNAP_TS}"
              fi
            done
            # GC: keep last 10 snapshot dumps + image tags
            ls -1t "${SNAP_DIR}"/promote-*.sql.gz 2>/dev/null \
              | tail -n +11 | xargs -r rm -f
            for svc in backend admin quick-donation kiosk screen service deployer; do
              img="ghcr.io/kammelaraj-arch/shitaleco-${svc}"
              docker images "${img}" --format '{{.Tag}}' 2>/dev/null \
                | grep '^promote-' | sort -r | tail -n +11 \
                | while read -r tag; do docker rmi "${img}:${tag}" >/dev/null 2>&1 || true; done
            done

            # ── Auto-promote :dev → :latest in GHCR ──────────────────────────
            # CI pushes fresh :dev images on every main merge; this step copies
            # them to :latest in the registry so prod's pull below picks them up.
            #
            # No silent failure: a push that fails (e.g. GH_PAT missing
            # write:packages, network error, or registry-side 5xx) MUST fail
            # the deploy. The previous `>/dev/null 2>&1 || echo` pattern was
            # the root cause of "deploy succeeded but prod is on stale code".
            echo "=== Auto-promoting :dev → :latest in GHCR ==="
            PROMOTE_FAIL=0
            for svc in backend admin quick-donation kiosk screen service deployer; do
              img="ghcr.io/kammelaraj-arch/shitaleco-${svc}"
              if docker pull "${img}:dev" >/dev/null 2>&1; then
                docker tag "${img}:dev" "${img}:latest"
                if docker push "${img}:latest"; then
                  echo "  ✓ ${svc}"
                else
                  echo "  ✗ ${svc}: push to GHCR failed"
                  PROMOTE_FAIL=1
                fi
              else
                # 'service' and 'deployer' are tolerated as first-deploy /
                # race-with-CI: the push trigger on this workflow races with
                # ci.yml building :dev images for the same commit. The very
                # first time a new service is added (or when its first build
                # takes longer than the other images and isn't yet pushed to
                # GHCR by the time we arrive here), the missing :dev is
                # expected, not a deploy-blocker. Once present in the registry,
                # subsequent deploys will pick it up via the workflow_run
                # trigger that fires after ci.yml completes.
                if [ "$svc" = "service" ] || [ "$svc" = "deployer" ]; then
                  echo "  ~ ${svc}:dev not in registry — first-deploy path"
                else
                  echo "  ✗ ${svc}:dev not in registry — CI didn't build it"
                  PROMOTE_FAIL=1
                fi
              fi
            done
            if [ "$PROMOTE_FAIL" -ne 0 ]; then
              echo "!!! Auto-promote failed — refusing to continue with stale :latest in registry !!!"
              exit 1
            fi

            # ── Checkpoint: tag :latest as :previous ─────────────────────────
            for svc in backend admin quick-donation kiosk screen service deployer; do
              img="ghcr.io/kammelaraj-arch/shitaleco-${svc}"
              docker tag "${img}:latest" "${img}:previous" 2>/dev/null || true
            done

            # ── Pull images built by CI — zero build load on this server ─────
            echo "=== Pulling pre-built images from GHCR ==="
            docker compose -f docker-compose.prod.yml pull backend admin quick-donation kiosk screen
            # service portal: non-fatal on first deploy (image may not exist in :latest yet)
            docker compose -f docker-compose.prod.yml pull service 2>/dev/null || \
              echo "service image not yet available — skipping pull"
            docker image prune -f
            docker container prune -f

            # ── Rolling restart: backend first ────────────────────────────────
            # Aggressive cleanup before force-recreate. Docker's network
            # namespace cleanup is ASYNC — even after `docker rm -f`, the
            # port allocation may remain in docker's internal state for
            # 10-30s, causing "port is already allocated" errors on the
            # immediately-following `up -d`. The poll-wait below blocks
            # until port 8000 is genuinely free before recreating.
            echo "=== Rolling restart: backend ==="
            # 1. Hard-remove the existing container (releases compose's hold)
            docker compose -f docker-compose.prod.yml stop backend 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f backend 2>/dev/null || true
            docker rm -f shitaleco-backend-1 2>/dev/null || true

            # 2. Kill anything else holding port 8000 (paranoid belt-and-braces)
            fuser -k 8000/tcp 2>/dev/null || true

            # 3. Clean up docker network state so the port allocation drops
            docker network prune -f >/dev/null 2>&1 || true

            # 4. Poll-wait until port 8000 is genuinely free (up to 30s).
            #    Docker's network cleanup can lag this long after rm.
            for i in $(seq 1 30); do
              if ! ss -tlnp 2>/dev/null | grep -q ':8000 ' && \
                 ! docker ps --format '{{.Ports}}' 2>/dev/null | grep -q ':8000->'; then
                echo "   port 8000 free after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "   WARN: port 8000 still bound after 30s — proceeding anyway"
              fi
              sleep 1
            done

            # 5. Now safe to recreate
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend

            echo "Waiting for backend health (up to 600s — cold start on 2GB VPS runs"
            echo "alembic upgrade + _patch_schema + sync_from_digital_dna + seeds"
            echo "synchronously before /health answers; old 30×5s window was too short"
            echo "and rolled back legit deploys for slowness)."
            BACKEND_OK=0
            for i in $(seq 1 120); do
              sleep 5
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Backend healthy! (attempt $i/120 = $((i*5))s)"; BACKEND_OK=1; break
              fi
              # Fast-fail if the container has actually exited — no point waiting
              # the full window when the process is gone.
              state=$(docker inspect -f '{{.State.Status}}' shitaleco-backend-1 2>/dev/null || echo "missing")
              if [ "$state" != "running" ] && [ "$state" != "restarting" ]; then
                echo "!!! Backend container state=${state} — aborting wait early !!!"
                docker logs --tail=50 shitaleco-backend-1 2>&1 | sed 's/^/    /'
                break
              fi
              # Periodic log tail every 30s so the workflow log shows progress
              if [ $((i % 6)) -eq 0 ]; then
                echo "  attempt $i/120 (${i}*5=$((i*5))s) — backend log tail:"
                docker logs --tail=10 shitaleco-backend-1 2>&1 | sed 's/^/    /'
              else
                echo "  attempt $i/120..."
              fi
            done

            if [ "$BACKEND_OK" -eq 0 ]; then
              echo "!!! Backend unhealthy after 600s — rolling back to :previous !!!"
              docker logs --tail=80 shitaleco-backend-1 2>&1 | sed 's/^/    /' || true
              docker tag ghcr.io/kammelaraj-arch/shitaleco-backend:previous \
                         ghcr.io/kammelaraj-arch/shitaleco-backend:latest 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            curl -sf -X POST http://localhost:8000/api/v1/admin/seed-catalog || true

            # ── Rolling restart: frontends ────────────────────────────────────
            echo "=== Rolling restart: frontends ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate admin quick-donation kiosk screen
            # service was previously wrapped in `2>/dev/null || true`, which
            # silently masked recreate failures and left prod serving stale
            # bundles. Now: if the service image exists in :latest, the
            # restart MUST succeed; otherwise (very first deploy before the
            # service image has ever been pushed) we tolerate the absence.
            if docker image inspect ghcr.io/kammelaraj-arch/shitaleco-service:latest >/dev/null 2>&1; then
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate service
            else
              echo "service:latest not yet in registry — skipping (first-deploy path)"
            fi

            # ── Force-recreate the deployer container ─────────────────────────
            # The deployer is a long-running container with DEPLOY_SECRET baked
            # into its environment at startup. If `.env` has been rotated since
            # it was last started (which is days/weeks given how stable that
            # container is), the backend and deployer hold different secrets
            # and every API-driven deploy / snapshot fails with
            # `DEPLOY_SECRET mismatch`.
            #
            # Recreating it on every SSH deploy keeps the secret in sync with
            # whatever `.env` says today. Cheap (small image, fast startup)
            # and one less manual `docker compose up -d --force-recreate
            # deployer` for the next admin who hits the mismatch error.
            echo "=== Recreate deployer (sync DEPLOY_SECRET) ==="
            # First time we recreate deployer there can be a stale name
            # collision from a previous lifecycle ("No such container:
            # 24f8df6..._shitaleco-deployer-1"). Force-remove first so
            # the up/recreate has a clean slot.
            docker rm -f shitaleco-deployer-1 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate deployer 2>&1 | tail -5 || \
              echo "deployer recreate failed — non-fatal, continue"

            echo "Waiting for admin (nginx:alpine on :80)..."
            for i in $(seq 1 10); do
              sleep 3
              curl -sf http://localhost:80/admin/ > /dev/null 2>&1 && break
              echo "  attempt $i/10..."
            done

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || \
              docker compose -f docker-compose.prod.yml up -d --no-deps nginx

            # ── Smoke tests ───────────────────────────────────────────────────
            echo "=== Smoke tests ==="
            SMOKE_FAIL=0
            smoke() {
              if curl -sf --max-time 10 "$2" > /dev/null 2>&1; then echo "  ✓ $1"
              else echo "  ✗ $1 FAILED"; SMOKE_FAIL=1; fi
            }
            smoke "backend /health"  "http://localhost:8000/health"
            smoke "admin portal"     "http://localhost:80/admin/"
            smoke "nginx main"       "http://localhost:80/"
            smoke "kiosk"            "http://localhost:80/kiosk/"
            smoke "donation"         "http://localhost:80/donate/"
            curl -sf --max-time 10 "http://localhost:80/service/" > /dev/null 2>&1 && echo "  ✓ service portal" || echo "  ~ service portal (not yet deployed)"

            if [ "$SMOKE_FAIL" -ne 0 ]; then
              echo "!!! Smoke tests failed — check logs above !!!"
              docker compose -f docker-compose.prod.yml logs --tail=30 backend
              exit 1
            fi

            # ── Version verification ──────────────────────────────────────────
            # Strict: every container we asserted should be on this commit
            # MUST serve /version.txt with the exact GIT_SHA. Anything else
            # (404, 503, mismatched SHA, empty body) fails the deploy.
            #
            # The previous "older image — skipping" leniency was the second
            # silent-failure path that let stale prod containers slip
            # through deploys. If the verification can't read the SHA we
            # consider the deploy unverified, period.
            echo "=== Version verification ==="
            EXPECTED_SHA="${GITHUB_SHA:-}"
            VERSION_FAIL=0
            # Skip verification entirely when GITHUB_SHA wasn't propagated
            # into the SSH context (e.g. running from a workflow_dispatch
            # without the env list updated). Without an expected SHA we'd
            # always fail the strict equality check and roll back a
            # perfectly healthy deploy. Smoke tests above already proved
            # the containers respond — accept that as good enough when we
            # have nothing to compare against.
            if [ -z "$EXPECTED_SHA" ]; then
              echo "  ~ skipped (GITHUB_SHA not exported into SSH context)"
            fi
            verify_version() {
              # Reads /version.txt by docker-exec'ing into the named container
              # and hitting 127.0.0.1 directly. We skip 'localhost' because
              # alpine resolves it to ::1 first, and our nginx config only
              # has `listen 80;` (IPv4) — wget on localhost gets ECONNREFUSED.
              # Bypasses nginx + SNI so the check is independent of any
              # reverse-proxy misconfiguration.
              local label=$1 container=$2
              local body
              body=$(docker exec "$container" wget -qO- http://127.0.0.1/version.txt 2>/dev/null | tr -d '[:space:]' || true)
              if [ -z "$body" ]; then
                echo "  ✗ $label: container $container did not serve /version.txt (image missing the verification probe — needs rebuild)"
                VERSION_FAIL=1
              elif [ "$body" = "$EXPECTED_SHA" ]; then
                echo "  ✓ $label: $body"
              elif git -C /opt/shitaleco merge-base --is-ancestor "$body" "$EXPECTED_SHA" 2>/dev/null; then
                # Image's stamped SHA is an ancestor of HEAD — i.e. this
                # image was built on an earlier main commit and CI's
                # path-filter decided not to rebuild for the current
                # commit because nothing under apps/service changed.
                # Acceptable: the running container's code matches a
                # legitimate point on the main branch.
                echo "  ~ $label: serving $body (ancestor of $EXPECTED_SHA — no rebuild needed)"
              else
                echo "  ✗ $label: got '$body', expected '$EXPECTED_SHA' — STALE IMAGE (not on main)"
                VERSION_FAIL=1
              fi
            }
            if [ -n "$EXPECTED_SHA" ]; then
              verify_version "service portal" "shitaleco-service-1"
              # Kiosk now bakes /version.txt the same way (PR adds it to
              # apps/kiosk/Dockerfile). Catches the drift where main has new
              # kiosk SPA code (e.g. the Cash/Card chooser) but the prod
              # container still serves an older build.
              verify_version "kiosk"          "shitaleco-kiosk-1"
            fi

            if [ "$VERSION_FAIL" -ne 0 ]; then
              echo "!!! Version mismatch — refusing to claim a successful deploy !!!"
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
              docker compose -f docker-compose.prod.yml logs --tail=30 service 2>/dev/null || true
              exit 1
            fi

            # ── SSL cert renewal (idempotent) ─────────────────────────────────
            # Reissue with --expand so the existing shital.org.uk cert picks
            # up any new SANs (e.g. service.shital.org.uk added later).
            # Without this nginx serves a cert that doesn't cover the
            # subdomain, and Cloudflare reports
            # "remote connection failure ... TLS_error" → 503 to users.
            #
            # --cert-name shital.org.uk pins certbot to update the EXISTING
            # cert directory (`/etc/letsencrypt/live/shital.org.uk/`) rather
            # than create a parallel `live/shital.org.uk-0001/` when the SAN
            # list changes. nginx config points at the un-suffixed path; if
            # certbot creates -0001, nginx keeps serving the OLD cert with
            # the OLD SAN list — exactly the failure mode that bit
            # service.shital.org.uk earlier today.
            #
            # api.shital.org.uk added to the list because it was already in
            # the live cert (set by an earlier manual certbot run) and we
            # don't want a deploy to drop it.
            echo "=== Renewing SSL certs ==="
            docker run --rm \
              -v /var/www/certbot:/var/www/certbot \
              -v /etc/letsencrypt:/etc/letsencrypt \
              certbot/certbot certonly --webroot \
              --cert-name shital.org.uk \
              --webroot-path /var/www/certbot \
              -d shital.org.uk -d www.shital.org.uk \
              -d admin.shital.org.uk -d kiosk.shital.org.uk \
              -d donate.shital.org.uk -d screen.shital.org.uk \
              -d api.shital.org.uk -d dev.shital.org.uk \
              -d service.shital.org.uk \
              --expand --non-interactive --agree-tos \
              -m admin@shirdisai.org.uk \
              2>&1 | tail -10 || echo "certbot returned non-zero — non-fatal, certs may be unchanged"

            # Reload nginx to pick up any cert SAN changes from certbot.
            # Required for service.shital.org.uk to start working when the
            # cert was first issued without it as a SAN.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>&1 | tail -3 || true

            # ── Refresh dev stack with the just-pushed :dev images ───────────
            # NOTE: removed the previous "tag :latest as :dev" retag — it wiped
            # the fresh :dev images CI had just pushed to GHCR, leaving dev
            # permanently mirroring prod. Now we pull :dev directly.
            DEV_DIR=/opt/shitaleco-dev
            if [ -d "$DEV_DIR/.git" ]; then
              cd "$DEV_DIR"
              git fetch origin
              git reset --hard origin/main
              docker compose -f docker-compose.dev.yml pull 2>/dev/null || true
              docker compose -f docker-compose.dev.yml up -d --remove-orphans 2>/dev/null || true
            fi

            # CRITICAL: cd back to prod dir before any further docker compose
            # calls. The post-deploy nginx reload below used to run while still
            # in /opt/shitaleco-dev, picking up dev's .env (which doesn't have
            # prod's DEPLOY_SECRET). compose interpolation then failed with
            # "required variable DEPLOY_SECRET is missing a value" → exit 1 →
            # the whole job marked FAILED even though deploy.sh had already
            # printed "Deploy complete — all sites live" and all smoke tests
            # had passed. The cosmetic failure spammed dashboards and made
            # operators distrust the deploy chain.
            cd /opt/shitaleco
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true

            # ── Install / refresh prod-host watchdog ────────────────────────────
            # */2 min cron that auto-restarts any stopped prod container and
            # kicks the backend on a 502 from /health. Mirror of the dev
            # watchdog installed by deploy-dev.yml. Idempotent — safe to re-run.
            # This is what catches a 3am crash without anyone watching.
            mkdir -p /opt/shitaleco/infra
            cat > /opt/shitaleco/infra/watchdog-prod.sh << 'WDEOF'
            #!/bin/bash
            set -uo pipefail
            COMPOSE_FILE=/opt/shitaleco/docker-compose.prod.yml
            LOG=/var/log/shital-prod-watchdog.log
            ts() { date -u +'%Y-%m-%dT%H:%M:%SZ'; }
            log() { echo "[$(ts)] $*" >> "$LOG"; }

            # 1. Restart any prod container that isn't running
            stopped=$(docker ps -a --filter "name=shitaleco-" --filter "status=exited" --format '{{.Names}}'; \
                      docker ps -a --filter "name=shitaleco-" --filter "status=dead"   --format '{{.Names}}'; \
                      docker ps -a --filter "name=shitaleco-" --filter "status=created" --format '{{.Names}}')
            # Exclude dev containers (-dev- in name) which have their own watchdog
            stopped=$(echo "$stopped" | grep -v 'shitaleco-dev-' || true)
            if [ -n "${stopped}" ]; then
              log "stopped prod containers: $(echo "$stopped" | tr '\n' ' ')"
              cd /opt/shitaleco
              docker compose -f "$COMPOSE_FILE" up -d >> "$LOG" 2>&1 || log "compose up failed"
            fi

            # 2. Backend health probe (502 from public nginx == backend wedged)
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 8 https://shital.org.uk/health 2>/dev/null || echo "000")
            if [ "$code" != "200" ]; then
              last_kick=$(stat -c %Y /tmp/.shital-prod-kicked 2>/dev/null || echo 0)
              now=$(date +%s)
              if [ $((now - last_kick)) -ge 300 ]; then
                log "health=$code → restarting backend + nginx"
                docker compose -f "$COMPOSE_FILE" restart backend nginx >> "$LOG" 2>&1 || true
                touch /tmp/.shital-prod-kicked
              else
                log "health=$code rate-limited (last kick $((now-last_kick))s ago)"
              fi
            fi

            # 3. Trim log
            if [ -f "$LOG" ] && [ $(wc -l < "$LOG") -gt 2000 ]; then
              tail -n 2000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            WDEOF
            chmod +x /opt/shitaleco/infra/watchdog-prod.sh
            (crontab -l 2>/dev/null | grep -v 'shital-prod-watchdog' ; \
             echo "*/2 * * * * /opt/shitaleco/infra/watchdog-prod.sh # shital-prod-watchdog") | crontab -
            echo "=== Watchdog cron installed (prod) ==="
            crontab -l | grep shital-prod-watchdog || echo "WARN: cron entry not found after install"

            echo ""
            echo "=== Deploy complete — all sites live ==="
            docker compose -f docker-compose.prod.yml ps
