name: Find rogue watcher killing backend

# Read-only diagnostic: SSH to prod, hunt for any process / cron /
# systemd timer / docker container that watches docker "unhealthy"
# status and removes containers. Does NOT touch the running backend.
#
# Triggered manually via workflow_dispatch, or by pushing changes to
# this file (so we can iterate on the diagnostic queries).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-rogue-watcher.yml'
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: SSH inspect (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 5m
          script: |
            set +e  # don't bail on any single failure
            echo "============================================="
            echo "==        Hunt the rogue watcher           =="
            echo "============================================="

            echo ""
            echo "=== 1) systemd services with names suggesting docker watching ==="
            systemctl list-units --type=service --all --no-pager 2>/dev/null \
              | grep -Ei 'docker|autoheal|monitor|watchdog|heal' | head -30

            echo ""
            echo "=== 2) /etc/systemd/system/ custom unit files ==="
            ls -la /etc/systemd/system/ 2>/dev/null | grep -vE '^(total|d|l)' | head -30
            echo ""
            echo "--- contents of any file mentioning 'docker' or 'shital' ---"
            grep -rl --include='*.service' --include='*.timer' -i 'docker\|shital\|backend' /etc/systemd/system/ 2>/dev/null | while read f; do
              echo "----- $f -----"
              cat "$f" 2>/dev/null | head -30
              echo ""
            done

            echo ""
            echo "=== 3) systemd TIMERS (not just services) ==="
            systemctl list-timers --all --no-pager 2>/dev/null | head -30

            echo ""
            echo "=== 4) Running processes that listen for docker events ==="
            ps auxf 2>/dev/null | grep -Ei 'autoheal|docker.*events|docker.*health|docker.*watch' | grep -v grep | head -20

            echo ""
            echo "=== 5) Long-running processes by root ==="
            ps -eo pid,etime,user,cmd --sort=-etime 2>/dev/null | awk '$3=="root" && NR>1 {print}' | head -30

            echo ""
            echo "=== 6) Containers possibly named autoheal or similar ==="
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null \
              | grep -Ei 'autoheal|heal|watch|monitor' | head -20

            echo ""
            echo "=== 7) All crons across the system (user + /etc/cron.d + /etc/cron.*) ==="
            echo "--- root crontab ---"
            crontab -l 2>/dev/null | head -20
            echo "--- /etc/cron.d/ ---"
            ls -la /etc/cron.d/ 2>/dev/null
            echo "--- /etc/cron.hourly /etc/cron.daily etc ---"
            for d in /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly; do
              echo "[$d]"
              ls -la "$d" 2>/dev/null
            done
            echo "--- /var/spool/cron/* user crontabs ---"
            ls -la /var/spool/cron/crontabs/ 2>/dev/null

            echo ""
            echo "=== 8) Anything in /usr/local/bin or /usr/local/sbin that mentions docker ==="
            grep -rl -i 'docker' /usr/local/bin/ /usr/local/sbin/ 2>/dev/null | head -10
            echo ""
            echo "--- contents of any matching scripts ---"
            for f in $(grep -rl -i 'docker' /usr/local/bin/ /usr/local/sbin/ 2>/dev/null); do
              echo "----- $f -----"
              head -30 "$f"
              echo ""
            done

            echo ""
            echo "=== 9) Recent docker events for backend (last hour) ==="
            docker events --since 1h --until 0s --filter container=shitaleco-backend-1 2>&1 | tail -30

            echo ""
            echo "=== 10) journalctl docker daemon (any 'killed unhealthy' / restart events) ==="
            journalctl -u docker --since '1 hour ago' --no-pager 2>&1 | grep -Ei 'kill|removed|unhealthy|destroy' | tail -30

            echo ""
            echo "=== 11) journalctl ALL services for shitaleco-backend container ==="
            journalctl --since '1 hour ago' --no-pager 2>&1 | grep -i 'shitaleco-backend' | tail -30

            echo ""
            echo "=== 12) Active TCP connections to docker.sock from non-docker procs ==="
            lsof /var/run/docker.sock 2>/dev/null | head -20

            echo ""
            echo "=== 13) Files with 'autoheal' name anywhere ==="
            find / -iname '*autoheal*' 2>/dev/null | head -20

            echo ""
            echo "=========================="
            echo "==     Hunt complete    =="
            echo "=========================="
