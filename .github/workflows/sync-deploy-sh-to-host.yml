# Sync the fixed deploy.sh (+ infra scripts) to the host so the
# pg_dump PIPESTATUS fix and nginx EXIT-trap actually take effect.
# deploy.sh is bind-mounted into the deployer container, so updating the
# file on the host + restarting the deployer is enough — no image rebuild,
# no promote, no prod disruption.
name: Sync deploy.sh to host
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/sync-deploy-sh-to-host.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (need deployer/deploy.sh)
        uses: actions/checkout@v4

      - name: Copy deploy.sh to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          source: "deployer/deploy.sh"
          target: "/opt/shitaleco/__incoming"
          strip_components: 0

      - name: Install + verify + restart deployer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set +e
            cd /opt/shitaleco

            echo "=== backup current deploy.sh ==="
            cp -f deployer/deploy.sh "deployer/deploy.sh.bak-$(date -u +%Y%m%dT%H%M%SZ)" 2>&1

            echo "=== install the synced deploy.sh ==="
            if [ -f /opt/shitaleco/__incoming/deployer/deploy.sh ]; then
              cp -f /opt/shitaleco/__incoming/deployer/deploy.sh deployer/deploy.sh
              chmod +x deployer/deploy.sh
              echo "  installed."
            else
              echo "  !!! synced file not found at /opt/shitaleco/__incoming/deployer/deploy.sh"
              ls -la /opt/shitaleco/__incoming 2>&1
            fi

            echo ""
            echo "=== bash syntax check ==="
            bash -n deployer/deploy.sh && echo "  ✓ syntax OK" || echo "  ✗ SYNTAX ERROR — NOT restarting deployer"

            echo ""
            echo "=== verify the two critical fixes are present ==="
            echo "PIPESTATUS pg_dump fix (pipe_rcs):"
            grep -nE 'pipe_rcs=\(' deployer/deploy.sh | head -2
            echo "nginx EXIT-trap (ensure_nginx_up / _deploy_exit_guard):"
            grep -nE '_deploy_exit_guard|ensure_nginx_up' deployer/deploy.sh | head -4

            echo ""
            echo "=== restart deployer to pick up new bind-mounted deploy.sh ==="
            docker compose -p shitaleco -f docker-compose.prod.yml --env-file .env up -d --no-deps deployer 2>&1 | tail -5
            sleep 4
            docker ps --filter 'name=shitaleco-deployer-1' --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "=== run a STANDALONE pg_dump snapshot test with the new code path ==="
            set -a; . .env; set +a
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            out="/opt/shitaleco/backups/manual-test-${ts}.sql.gz"
            err="/opt/shitaleco/backups/manual-test-${ts}-pg_dump.log"
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD:-}" db \
              pg_dump -U "${POSTGRES_USER:-shitaleco_db_user}" -d "${POSTGRES_DB:-shitaleco_db}" \
              2>"$err" | gzip > "$out"
            echo "  out: $(ls -la "$out" 2>&1)"
            echo "  err size: $(wc -c < "$err" 2>/dev/null) bytes"
            if [ -s "$out" ]; then
              echo "  ✅ pg_dump WORKS — $(du -h "$out" | cut -f1) — next promote will capture a real DB snapshot"
              rm -f "$out" "$err"
            else
              echo "  ✗ pg_dump still failing:"; cat "$err" 2>&1 | head -10
            fi

            echo ""
            echo "=== prod still healthy after deployer restart? ==="
            curl -sk -o /dev/null -w '/health → %{http_code}\n' -m 8 https://shital.org.uk/health
            rm -rf /opt/shitaleco/__incoming 2>/dev/null

