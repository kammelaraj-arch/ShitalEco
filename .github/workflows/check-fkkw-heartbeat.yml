# READ-ONLY — is FKKW's heartbeat actually landing on the server?
name: Check FKKW heartbeat (READ-ONLY)
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/check-fkkw-heartbeat.yml

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 60s
          script: |
            set +e
            cd /opt/shitaleco
            set -a; . .env; set +a

            echo "=== FKKW heartbeat freshness ==="
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -x -c "
                SELECT name,
                       device_type,
                       status,
                       last_seen_at,
                       NOW() - last_seen_at AS age,
                       pending_command,
                       updated_at
                FROM kiosk_devices
                WHERE name ILIKE '%FKKW%' OR device_username ILIKE '%FKKW%';
              " 2>&1 | head -20

            echo ""
            echo "=== Recent heartbeat hits in backend logs (last 5 min) ==="
            docker logs shitaleco-backend-1 --since 5m 2>&1 \
              | grep -E 'kiosk-devices.*heartbeat|/heartbeat' | tail -10

            echo ""
            echo "=== Recent backend access lines mentioning kiosk-devices (last 5 min) ==="
            docker logs shitaleco-backend-1 --since 5m 2>&1 \
              | grep -E 'POST.*kiosk-devices' | tail -10

            echo ""
            echo "=== All kiosks ranked by recency ==="
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "
                SELECT name,
                       device_type,
                       branch_id,
                       last_seen_at,
                       (NOW() - last_seen_at) AS age
                FROM kiosk_devices
                WHERE deleted_at IS NULL
                ORDER BY last_seen_at DESC NULLS LAST
                LIMIT 10;
              " 2>&1 | head -20
