# verify code in container 2026-06-23T21:22

# Read the actual file inside the running container and curl /openapi.json
# from INSIDE the container (bypassing nginx). Tells us definitively whether
# the running image has the new code, vs whether nginx/cache is the issue.
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/verify-code-in-container.yml

jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set +e
            echo "=== container state ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Status={{.State.Status}}  StartedAt={{.State.StartedAt}}  Image={{.Image}}' 2>&1

            echo ""
            echo "=== find recurring_giving.py inside container + check for refresh-from-paypal ==="
            docker exec shitaleco-dev-backend-dev-1 sh -c '
              p=$(find / -name "recurring_giving.py" -path "*shital*" 2>/dev/null | head -1)
              echo "  path: $p"
              if [ -n "$p" ]; then
                echo "  refresh-from-paypal grep count: $(grep -c "refresh-from-paypal" "$p")"
                echo "  --- last 6 lines containing route decorators ---"
                grep -nE "@router\.(post|get|put|delete)" "$p" | tail -6
              fi
            ' 2>&1

            echo ""
            echo "=== curl /openapi.json from INSIDE container (port 8000 direct) ==="
            docker exec shitaleco-dev-backend-dev-1 sh -c '
              curl -s http://localhost:8000/openapi.json 2>&1 | head -c 200
              echo ""
              echo "---"
              curl -s http://localhost:8000/openapi.json 2>&1 | grep -c "refresh-from-paypal"
            ' 2>&1 | tail -20

            echo ""
            echo "=== curl /openapi.json via host (port 8001) ==="
            curl -s http://localhost:8001/openapi.json 2>&1 | grep -c "refresh-from-paypal" 2>&1 || echo "host port probe failed"

            echo ""
            echo "=== external probe NOW ==="
            curl -sk -o /dev/null -w "/health → %{http_code}\n" -m 8 https://dev.shital.org.uk/health
            n=$(curl -sk -m 12 https://dev.shital.org.uk/openapi.json 2>/dev/null | grep -c 'refresh-from-paypal' 2>/dev/null | head -1)
            echo "external openapi refresh-from-paypal: ${n:-0}"
