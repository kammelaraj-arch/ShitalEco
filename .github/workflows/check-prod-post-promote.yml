# READ-ONLY — verify prod is healthy after promote
name: Check prod post-promote (READ-ONLY)
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/check-prod-post-promote.yml

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 90s
          script: |
            set +e

            echo "=== Public probes (prod URLs) ==="
            for url in https://shital.org.uk/health https://kiosk.shital.org.uk/api/v1/health https://admin.shital.org.uk/admin/ https://donate.shital.org.uk/donate/; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
              echo "  $url → $code"
            done

            echo ""
            echo "=== prod backend container state ==="
            docker inspect shitaleco-backend-1 --format \
              'Status={{.State.Status}}  StartedAt={{.State.StartedAt}}  Restarts={{.RestartCount}}  OOM={{.State.OOMKilled}}' 2>&1

            echo ""
            echo "=== prod backend image SHA — does the running image match the new code? ==="
            docker inspect shitaleco-backend-1 --format 'Image={{.Image}}' 2>&1
            docker exec shitaleco-backend-1 sh -c 'cat /app/.git-sha 2>/dev/null || echo "(no /app/.git-sha)"' 2>&1
            # Heartbeat-with-command should now return JSON with command field (proves new code)
            curl -sk -m 6 -X POST https://kiosk.shital.org.uk/api/v1/kiosk-devices/c5c4df64-beba-45d1-b8bb-ff31639bf3fd/heartbeat -o /tmp/hb.json -w 'HTTP %{http_code}\n' 2>&1
            echo "heartbeat response body:"; cat /tmp/hb.json 2>&1; echo

            echo ""
            echo "=== FKKW heartbeat freshness (kiosk app should still be ticking after promote) ==="
            cd /opt/shitaleco
            set -a; . .env; set +a
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "
                SELECT name, last_seen_at, (NOW() - last_seen_at) AS age, pending_command
                FROM kiosk_devices
                WHERE deleted_at IS NULL
                ORDER BY last_seen_at DESC NULLS LAST
                LIMIT 6;
              " 2>&1 | head -15

            echo ""
            echo "=== Latest promote snapshot — did pg_dump finally produce a .sql.gz ? ==="
            ls -lt /opt/shitaleco/backups/promote-*.sql.gz 2>/dev/null | head -3
            echo "--- latest pg_dump error log (should be empty/absent now) ---"
            f=$(ls -t /opt/shitaleco/backups/promote-*-pg_dump.log 2>/dev/null | head -1)
            echo "file: $f"
            [ -n "$f" ] && wc -c "$f" && tail -10 "$f"

            echo ""
            echo "=== last 6 promote-history entries ==="
            tail -6 /opt/shitaleco/backups/deploy-history.jsonl 2>&1 | head -6
