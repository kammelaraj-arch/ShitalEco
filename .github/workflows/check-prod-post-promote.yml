# READ-ONLY — verify prod healthy + new code live after promote (rebased branch)
name: Check prod post-promote (READ-ONLY)
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/check-prod-post-promote.yml

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 120s
          script: |
            set +e

            echo "=== Public probes (prod URLs) ==="
            for url in https://shital.org.uk/health https://kiosk.shital.org.uk/health https://admin.shital.org.uk/admin/ https://donate.shital.org.uk/donate/ https://service.shital.org.uk/; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
              echo "  $url → $code"
            done

            echo ""
            echo "=== all prod containers ==="
            docker ps --filter 'name=shitaleco-' --format 'table {{.Names}}\t{{.Status}}' | head -15

            echo ""
            echo "=== backend state ==="
            docker inspect shitaleco-backend-1 --format \
              'Status={{.State.Status}}  StartedAt={{.State.StartedAt}}  Restarts={{.RestartCount}}  OOM={{.State.OOMKilled}}' 2>&1

            echo ""
            echo "=== new-code proof: heartbeat returns 'command' field (rebased baca289) ==="
            curl -sk -m 6 -X POST https://kiosk.shital.org.uk/api/v1/kiosk-devices/c5c4df64-beba-45d1-b8bb-ff31639bf3fd/heartbeat -o /tmp/hb.json -w 'HTTP %{http_code}\n' 2>&1
            echo "heartbeat body:"; cat /tmp/hb.json 2>&1; echo

            echo ""
            echo "=== new-code proof: quick-link PayPal endpoint exists (74545de) ==="
            curl -sk -m 8 -o /dev/null -w 'quick-link → %{http_code}\n' \
              -X POST https://service.shital.org.uk/api/v1/service/giving/quick-link \
              -H 'Content-Type: application/json' -d '{"amount":1,"branch_id":"main"}' 2>&1

            echo ""
            echo "=== did the promote snapshot finally produce a real .sql.gz? (pg_dump PIPESTATUS fix) ==="
            ls -lt /opt/shitaleco/backups/promote-*.sql.gz 2>/dev/null | head -3
            f=$(ls -t /opt/shitaleco/backups/promote-*-pg_dump.log 2>/dev/null | head -1)
            echo "latest pg_dump err log: $f"
            [ -n "$f" ] && wc -c "$f"

            echo ""
            echo "=== last 4 deploy-history entries ==="
            tail -4 /opt/shitaleco/backups/deploy-history.jsonl 2>&1 | head -4
