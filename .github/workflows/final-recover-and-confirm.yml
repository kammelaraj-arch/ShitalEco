name: Final recover backend + confirm stable (watchdog now gone)

# Deployer is confirmed watchdog-free (0 watchdog log lines). Backend was
# deleted ~19:40 (likely a Promote click after the deployer came back online).
# Recreate the backend, check deploy-history for a promote, and watch 12 min.
# With the watchdog gone from code, it must now stay up.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-recover-and-confirm.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 16m
          script: |
            set +e
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a

            echo "=== deploy-history last 4 (did a promote run ~19:40?) ==="
            tail -4 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null \
              | sed -E 's/.*"at":"([^"]*)".*"env":"([^"]*)".*"status":"([^"]*)".*/  \1  env=\2  status=\3/' \
              || echo "  none"

            echo ""
            echo "=== confirm deployer watchdog-free + is anything mid-deploy? ==="
            docker logs shitaleco-deployer-1 2>&1 | grep -c watchdog | sed 's/^/  watchdog log lines (expect 0): /'
            docker exec shitaleco-deployer-1 sh -c 'ps aux 2>/dev/null | grep -E "deploy.sh|alembic" | grep -v grep' 2>&1 | head -5 || echo "  no deploy.sh running"

            echo ""
            echo "=== recreate backend ==="
            docker rm -f shitaleco-backend-1 2>/dev/null
            # also clear any auto-renamed husk holding port 8000
            for c in $(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_shitaleco-backend'); do
              docker rm -f "$c" 2>/dev/null
            done
            sleep 2
            docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -5
            for i in $(seq 1 60); do
              sleep 5
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "  healthy after $((i*5))s"; break; }
            done

            echo ""
            echo "=== watch 12 min — watchdog is gone, must stay up ==="
            BASE=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
            echo "  baseline=$BASE"
            BAD=0
            for i in $(seq 1 24); do
              sleep 30
              now=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null || echo ABSENT)
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ -z "$now" ] || [ "$now" = "ABSENT" ]; then
                echo "  [$((i*30))s] ⚠️ DELETED :8000=$c"; BAD=1
                docker logs --tail 8 shitaleco-deployer-1 2>&1 | grep -iE 'watchdog|recreate|deploy' | tail -4
              elif [ "$now" != "$BASE" ]; then
                echo "  [$((i*30))s] ⚠️ recreated ($BASE→$now) :8000=$c"; BAD=1; BASE="$now"
              else
                [ $((i % 4)) -eq 0 ] && echo "  [$((i*30))s] stable :8000=$c"
              fi
            done

            echo ""
            if [ "$BAD" = "0" ]; then
              echo "=== ✅✅ 12 MIN ROCK SOLID — crashloop is DEAD, prod stable ==="
            else
              echo "=== still disturbed — capture more ==="
            fi
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
