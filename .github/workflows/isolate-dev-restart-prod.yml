name: Isolate dev from prod network + restart prod

# THE killer: the dev-watchdog cron (*/2 min) runs `docker compose -f
# docker-compose.dev.yml up -d`. Dev's backend-dev was attached to prod's
# shitaleco_internal network, so that 2-min cron (plus deploy-dev and
# /ops recreate) kept disrupting/SIGKILLing prod backend. Prod died at
# 17:48:21 right after the 17:48:00 cron tick — proof.
#
# This workflow:
#  1. Captures the last kill event (proof)
#  2. Disables the dev-watchdog cron NOW (stop the bleeding)
#  3. Disconnects the running backend-dev from shitaleco_internal
#  4. Restarts prod backend
#  5. Watches prod 6 min — should NOT die now that the 2-min cron is gone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isolate-dev-restart-prod.yml'

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 13m
          script: |
            set +e

            echo "=== PROOF: last kill events for prod backend (full labels) ==="
            docker events --since 12m --until 0s --filter container=shitaleco-backend-1 \
              --filter event=kill --filter event=die 2>&1 | tail -6

            echo ""
            echo "=== 1) Disable the dev-watchdog cron (the 2-min killer) ==="
            crontab -l 2>/dev/null | grep -v 'shital-dev-watchdog' | crontab -
            echo "  remaining crontab:"
            crontab -l 2>/dev/null | grep -vE '^#|^$' || echo "  (empty)"

            echo ""
            echo "=== 2) Disconnect backend-dev from prod network (immediate isolation) ==="
            docker network disconnect -f shitaleco_internal shitaleco-dev-backend-dev-1 2>&1 \
              && echo "  disconnected" || echo "  (already disconnected / container gone)"
            echo "  containers still on shitaleco_internal:"
            docker network inspect shitaleco_internal \
              --format '{{range .Containers}}{{.Name}} {{end}}' 2>&1

            echo ""
            echo "=== 3) Restart prod backend ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            docker rm -f shitaleco-backend-1 2>/dev/null
            sleep 2
            docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -8

            echo ""
            echo "=== 4) Wait /health (4 min) ==="
            for i in $(seq 1 48); do
              sleep 5
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "OK after $((i*5))s"; break; }
              [ $((i % 6)) -eq 0 ] && echo "  $((i*5))s — $c"
            done

            echo ""
            echo "=== 5) Watch prod 6 min — does it survive with the cron gone? ==="
            DIED=0
            for i in $(seq 1 36); do
              sleep 10
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$c" != "200" ]; then
                echo "  [$((i*10))s] DIED — /health=$c"
                DIED=1
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  [$((i*10))s] still 200"
            done
            [ "$DIED" = "0" ] && echo "=== ✅ PROD SURVIVED 6 MIN — killer was the dev-watchdog cron ==="

            echo ""
            echo "=== final ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
