name: Deploy to Dev

# v2: polls GHCR for an image whose GIT_SHA matches this commit before
# pulling (no more stale-image race).
# Lightweight image-pull deploy. CI builds & pushes :dev images to GHCR;
# this workflow waits until the :dev image labeled with the *current commit
# SHA* is in the registry, then pulls + restarts on the VPS.
#
# We use `on: push` (works on any branch — workflow_run requires the file
# to be on the default branch). The wait-for-image step makes it safe to
# fire immediately on push, even before CI finishes building: it polls
# until the registry has a :dev image whose git.sha label matches this
# commit. If CI fails, the polling times out and the deploy fails loudly
# instead of pulling a stale image.

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Pull :dev images & restart dev stack
    runs-on: ubuntu-latest
    steps:
      - name: Wait for :dev image with this commit SHA
        # Best-effort wait. If the image arrives within 10 min we deploy
        # the new code. If it doesn't (CI failed, build errored, etc.) we
        # STILL fall through to the SSH step and force-recreate the dev
        # stack from whatever :dev currently points at — so a crashed dev
        # always recovers, even when this commit can't be built. The image
        # match outcome is exported so the SSH script can log the difference.
        id: wait_image
        env:
          GH_PAT:    ${{ secrets.GH_PAT }}
          TARGET:    ${{ github.sha }}
        run: |
          set -eu
          echo "$GH_PAT" | docker login ghcr.io -u kammelaraj-arch --password-stdin >/dev/null
          IMG=ghcr.io/kammelaraj-arch/shitaleco-backend:dev
          for i in $(seq 1 60); do
            docker pull "$IMG" >/dev/null 2>&1 || true
            CUR=$(docker inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | awk -F= '/^GIT_SHA=/{print $2; exit}')
            echo "  attempt $i/60 — :dev tag has GIT_SHA=$CUR (waiting for $TARGET)"
            if [ "$CUR" = "$TARGET" ]; then
              echo "OK — :dev image matches this commit"
              echo "image_matched=true"  >> "$GITHUB_OUTPUT"
              echo "current_sha=$CUR"    >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for :dev image with GIT_SHA=$TARGET — CI likely failed."
          echo "::warning::Falling through to force-recreate the dev stack from the existing :dev tag (GIT_SHA=$CUR) so a crashed dev recovers."
          echo "image_matched=false" >> "$GITHUB_OUTPUT"
          echo "current_sha=$CUR"    >> "$GITHUB_OUTPUT"

      - name: Pull :dev + restart dev stack on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          DEPLOY_REF:    ${{ github.ref_name }}
          IMAGE_MATCHED: ${{ steps.wait_image.outputs.image_matched }}
          IMAGE_SHA:     ${{ steps.wait_image.outputs.current_sha }}
          TARGET_SHA:    ${{ github.sha }}
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 600s
          envs: GH_PAT,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,ANTHROPIC_API_KEY,SENDGRID_API_KEY,MS_CLIENT_ID,MS_TENANT_ID,MS_CLIENT_SECRET,DEPLOY_SECRET,DEPLOY_REF,IMAGE_MATCHED,IMAGE_SHA,TARGET_SHA
          script: |
            set -eu
            if [ "${IMAGE_MATCHED:-false}" = "true" ]; then
              echo "=== Deploy to Dev — branch=${DEPLOY_REF} — NEW IMAGE (${TARGET_SHA:0:7}) ==="
            else
              echo "=== Deploy to Dev — branch=${DEPLOY_REF} — RECOVERY MODE ==="
              echo "    CI did not produce a new image for ${TARGET_SHA:0:7}; recreating dev stack from"
              echo "    the existing :dev tag (GIT_SHA=${IMAGE_SHA:-unknown}). This gets a crashed dev"
              echo "    back online even when this commit can't be built."
            fi

            # ── Pre-flight: every required secret must be present.
            # Required = without it the dev stack cannot come up at all.
            # MS_*/STRIPE_*/SENDGRID/ANTHROPIC are *optional* — empty values
            # are fine; they just disable the corresponding feature on dev.
            require() {
              local var=$1
              if [ -z "${!var:-}" ]; then
                echo "!!! Required secret '$var' is empty. Add it to GitHub Actions repo secrets." >&2
                exit 1
              fi
            }
            require GH_PAT          # git clone + GHCR docker login
            require DEPLOY_SECRET   # must match the prod deployer's value

            # ── Ensure repo exists on VPS (we only need docker-compose.dev.yml) ─
            if [ -d /opt/shitaleco-dev/.git ]; then
              cd /opt/shitaleco-dev
              git fetch origin --quiet
              git reset --hard "origin/${DEPLOY_REF}" --quiet
            else
              apt-get install -y git -q
              git clone --branch "${DEPLOY_REF}" --depth 1 \
                "https://${GH_PAT}@github.com/kammelaraj-arch/ShitalEco.git" /opt/shitaleco-dev
              cd /opt/shitaleco-dev
            fi

            # ── .env for dev (idempotent) ───────────────────────────────────────
            if [ ! -f .env.dev ]; then
              cat > .env.dev << 'ENVEOF'
            JWT_SECRET=shital-dev-jwt-secret-not-for-prod
            APP_ENV=development
            ENVEOF
            fi
            inject() {
              local file=$1 key=$2 val=$3
              [ -z "$val" ] && return
              if grep -q "^${key}=" "${file}"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "${file}"
              else
                echo "${key}=${val}" >> "${file}"
              fi
            }
            inject .env.dev STRIPE_SECRET_KEY      "$STRIPE_SECRET_KEY"
            inject .env.dev STRIPE_PUBLISHABLE_KEY "$STRIPE_PUBLISHABLE_KEY"
            inject .env.dev ANTHROPIC_API_KEY      "$ANTHROPIC_API_KEY"
            inject .env.dev SENDGRID_API_KEY       "$SENDGRID_API_KEY"
            inject .env.dev MS_CLIENT_ID           "$MS_CLIENT_ID"
            inject .env.dev MS_TENANT_ID           "$MS_TENANT_ID"
            inject .env.dev MS_CLIENT_SECRET       "$MS_CLIENT_SECRET"
            # Token so docker compose pull can fetch from private GHCR packages
            inject .env.dev GITHUB_TOKEN           "$GH_PAT"
            # Same secret the prod deployer expects — without this, dev backend
            # gets HTTP 403 when querying http://deployer:9000/status.
            inject .env.dev DEPLOY_SECRET          "$DEPLOY_SECRET"
            inject .env.dev MAIL_AGENT_MAILBOXES   "accounts@shirdisai.org.uk,gtrustees@shirdisai.org.uk"
            inject .env.dev MAIL_AGENT_MODE        "auto"

            set -a; source .env.dev; set +a
            ufw allow 8080/tcp 2>/dev/null || true

            # ── Login to GHCR + pull pre-built :dev images ──────────────────────
            echo "$GH_PAT" | docker login ghcr.io -u kammelaraj-arch --password-stdin
            echo "=== Pulling :dev images from GHCR ==="
            docker compose -f docker-compose.dev.yml pull

            # ── Recreate everything (DB stays put — just restarts) ──────────────
            # Pre-clean: compose occasionally retains references to container
            # IDs that no longer exist in the docker engine (eg. after a host
            # reboot or daemon restart). Subsequent `up --force-recreate`
            # then 500s with "No such container: <stale-id>" and the deploy
            # aborts mid-rollout. Force-remove by name first so compose has
            # a clean slot to land into. -f ignores "not found" so the call
            # is safe to run unconditionally.
            #
            # ⚠️ CRITICAL — DO NOT add `--remove-orphans` here, and ALWAYS
            # pass `-p shitaleco-dev`. The dev compose references prod's
            # `shitaleco_internal` network as an external network (so the dev
            # backend can reach the deployer at deployer:9000). With
            # `--remove-orphans`, compose treats EVERY prod container on that
            # shared network (backend, admin, nginx, …) as an orphan and
            # SIGKILLs them — exitCode 137. That was the 12-Jun all-day
            # "prod keeps dying" incident: every push to main triggered this
            # deploy-dev job, whose `down --remove-orphans` nuked prod's
            # backend off the shared network. Scope to the dev project and
            # never sweep orphans across a shared external network.
            echo "=== Pre-clean: dev compose down (NO --remove-orphans) ==="
            docker compose -p shitaleco-dev -f docker-compose.dev.yml down 2>/dev/null || true
            for c in db backend admin quick-donation kiosk screen nginx; do
              docker rm -f "shitaleco-dev-${c}-dev-1" 2>/dev/null || true
            done

            echo "=== Bring dev stack up ==="
            docker compose -p shitaleco-dev -f docker-compose.dev.yml up -d

            # ── Backend health check ────────────────────────────────────────────
            # 180 × 5s = 900s (15 min). Cold start on the 2GB VPS runs alembic
            # upgrade head + _patch_schema (60+ ALTERs) + sync_from_digital_dna
            # + four seed functions synchronously before /health responds.
            # 90 × 5s = 450s was timing out for the last 6 dev pushes because
            # migration 030 (donations.kiosk_device_id backfill) does a large
            # UPDATE that takes 2-3 min on its own with the current donations
            # row count. Matches the principle of "wait until the box is genuinely
            # broken, don't give up while it's working." 15 min covers any
            # realistic cold start without false-failing the deploy.
            echo "=== Waiting for backend-dev health ==="
            DEV_OK=0
            for i in $(seq 1 180); do
              sleep 5
              if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
                DEV_OK=1; break
              fi
              # Tail backend logs every 30s so the workflow log shows WHY
              # startup is slow (helpful when this DOES legitimately fail).
              if [ $((i % 6)) -eq 0 ]; then
                echo "  attempt $i/180 — tailing backend-dev logs:"
                docker compose -f docker-compose.dev.yml logs --tail=10 backend-dev 2>&1 | sed 's/^/    /'
              else
                echo "  attempt $i/180..."
              fi
            done
            if [ "$DEV_OK" -eq 0 ]; then
              echo "!!! Dev backend failed health check after 900s !!!"
              docker compose -f docker-compose.dev.yml logs --tail=50 backend-dev
              exit 1
            fi

            # Seed dev catalog (idempotent)
            curl -sf -X POST http://localhost:8001/api/v1/admin/seed-catalog || true

            # ── Post-deploy sanity: probe deployer from inside backend-dev.
            # The prod-side deployer container has its DEPLOY_SECRET baked in
            # at start time. If the secret has rotated since the deployer was
            # last recreated, the dev backend gets HTTP 403 here even though
            # everything in the DEV stack is healthy.
            #
            # Treat as a warning, not a hard failure: the prod deploy
            # (.github/workflows/deploy-vultr.yml) is what reconciles the
            # deployer container; failing the dev deploy on this would block
            # every dev push until prod is touched. Surfaces the issue
            # loudly so it's still actionable from the workflow log.
            echo "=== Sanity: probe deployer from inside backend-dev ==="
            DEPLOYER_PROBE=$(docker exec shitaleco-dev-backend-dev-1 \
              curl -s -o /dev/null -w "%{http_code}" \
                -H "X-Deploy-Secret: $DEPLOY_SECRET" \
                http://deployer:9000/status 2>&1 || echo 000)
            echo "deployer /status from backend-dev → HTTP $DEPLOYER_PROBE"
            if [ "$DEPLOYER_PROBE" != "200" ]; then
              echo "::warning::Deployer probe returned $DEPLOYER_PROBE (expected 200)."
              echo "::warning::DEPLOY_SECRET in the prod-side deployer container is out of sync with the GitHub secret."
              echo "::warning::Next prod deploy will reconcile (see deploy-vultr.yml force-recreate step)."
              # Non-fatal — dev stack is healthy regardless.
            fi

            # ── Install / refresh dev-host watchdog ─────────────────────────────
            # Independent of the GitHub Actions deploy: a host-side cron that
            # runs every 2 min, restarts any stopped dev container, and curls
            # /health on backend-dev. If health fails it `docker compose up -d`
            # (idempotent — only restarts what's actually broken). This is the
            # piece that catches a crash at 3 am without anyone clicking
            # Promote / pushing a commit.
            mkdir -p /opt/shitaleco-dev/infra
            cat > /opt/shitaleco-dev/infra/watchdog-dev.sh << 'WDEOF'
            #!/bin/bash
            # Auto-installed by deploy-dev.yml every push. Re-running this file
            # is safe — it ONLY restarts containers that are actually down.
            set -uo pipefail
            COMPOSE_FILE=/opt/shitaleco-dev/docker-compose.dev.yml
            LOG=/var/log/shital-dev-watchdog.log
            ts() { date -u +'%Y-%m-%dT%H:%M:%SZ'; }
            log() { echo "[$(ts)] $*" >> "$LOG"; }

            # 1. Find any dev container that isn't running
            stopped=$(docker ps -a --filter "name=shitaleco-dev-" --filter "status=exited" --format '{{.Names}}'; \
                      docker ps -a --filter "name=shitaleco-dev-" --filter "status=dead" --format '{{.Names}}'; \
                      docker ps -a --filter "name=shitaleco-dev-" --filter "status=created" --format '{{.Names}}')
            if [ -n "${stopped}" ]; then
              log "stopped containers found: $(echo "$stopped" | tr '\n' ' ')"
              cd /opt/shitaleco-dev
              docker compose -f "$COMPOSE_FILE" up -d >> "$LOG" 2>&1 || log "compose up failed"
            fi

            # 2. Backend health probe. 502 from nginx === backend wedged.
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 8 https://dev.shital.org.uk/api/v1/health 2>/dev/null || echo "000")
            if [ "$code" != "200" ]; then
              # Rate-limit: don't restart more than once per 5 min from this path
              last_kick=$(stat -c %Y /tmp/.shital-dev-kicked 2>/dev/null || echo 0)
              now=$(date +%s)
              if [ $((now - last_kick)) -ge 300 ]; then
                log "health=$code → restarting backend-dev + nginx-dev"
                docker compose -f "$COMPOSE_FILE" restart backend-dev nginx-dev >> "$LOG" 2>&1 || true
                touch /tmp/.shital-dev-kicked
              else
                log "health=$code but rate-limited (last kick $((now-last_kick))s ago)"
              fi
            fi

            # 3. Trim log to last 2000 lines so it doesn't grow unbounded
            if [ -f "$LOG" ] && [ $(wc -l < "$LOG") -gt 2000 ]; then
              tail -n 2000 "$LOG" > "${LOG}.tmp" && mv "${LOG}.tmp" "$LOG"
            fi
            WDEOF
            chmod +x /opt/shitaleco-dev/infra/watchdog-dev.sh

            # Idempotent cron entry — replace any prior shital-dev-watchdog line
            (crontab -l 2>/dev/null | grep -v 'shital-dev-watchdog' ; \
             echo "*/2 * * * * /opt/shitaleco-dev/infra/watchdog-dev.sh # shital-dev-watchdog") | crontab -
            echo "=== Watchdog cron installed ==="
            crontab -l | grep shital-dev-watchdog || echo "WARN: cron entry not found after install"

            echo ""
            echo "=== DEV deploy complete — branch ${DEPLOY_REF} ==="
            docker compose -f docker-compose.dev.yml ps
