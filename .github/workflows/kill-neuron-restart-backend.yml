name: Kill Neuron interference + Restart backend

# Found via find-rogue-watcher: a Neuron platform is co-located on this VPS
# (neuron-deployer container + neuron-vhost-watchdog.timer). One of them
# was removing shitaleco-backend-1 every 1-4 minutes. This workflow stops
# the Neuron pieces and brings our backend up clean.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kill-neuron-restart-backend.yml'
  workflow_dispatch:

jobs:
  kill-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: SSH stop Neuron, restart shital backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            set +e
            echo "=== Step 1: stop + DELETE all Neuron pieces ==="
            # User directive: delete any Neuron stuff. Make Shital independent.

            # 1a. Find and disable ALL neuron-* systemd units (not just watchdog)
            for u in $(systemctl list-units --all --type=service --no-pager 2>/dev/null | awk '/neuron/{print $2}'); do
              echo "  stopping/disabling $u"
              systemctl stop "$u"     2>/dev/null || true
              systemctl disable "$u"  2>/dev/null || true
              systemctl mask "$u"     2>/dev/null || true
            done
            for u in $(systemctl list-units --all --type=timer --no-pager 2>/dev/null | awk '/neuron/{print $2}'); do
              echo "  stopping/disabling $u"
              systemctl stop "$u"     2>/dev/null || true
              systemctl disable "$u"  2>/dev/null || true
              systemctl mask "$u"     2>/dev/null || true
            done

            # 1b. Remove any neuron systemd unit files
            rm -f /etc/systemd/system/neuron-*.service /etc/systemd/system/neuron-*.timer
            rm -f /lib/systemd/system/neuron-*.service /lib/systemd/system/neuron-*.timer
            systemctl daemon-reload

            # 1c. Containers (any container with "neuron" in name)
            docker ps -a --format '{{.Names}}' | grep -i neuron | xargs -r docker rm -f
            # 1d. Images (any image with "neuron" in repo)
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -i neuron | xargs -r docker rmi -f

            # 1e. Scripts + data dirs
            rm -f /usr/local/bin/neuron-* /usr/local/sbin/neuron-*
            rm -rf /opt/neuron-platform /opt/neuron 2>/dev/null || true

            # 1f. Nginx vhost config that proxied to Neuron
            rm -f /opt/shitaleco/nginx/conf.d/neuron.conf

            # 1g. Any docker compose file referencing neuron in /etc or /opt
            find /etc /opt -maxdepth 4 -name 'docker-compose*.yml' 2>/dev/null \
              | xargs grep -l -i 'neuron' 2>/dev/null \
              | while read f; do
                  echo "  WARNING: $f references neuron — manual review needed"
                done

            # 1h. Cron entries that mention neuron
            crontab -l 2>/dev/null | grep -v -i 'neuron' | crontab - || true
            for cf in /etc/cron.d/*; do
              if grep -l -i 'neuron' "$cf" 2>/dev/null; then
                echo "  removing $cf"
                rm -f "$cf"
              fi
            done

            echo "Neuron pieces deleted from host"
            echo "--- verify nothing neuron-related remains ---"
            ls /etc/systemd/system/ 2>/dev/null | grep -i neuron || echo "  no systemd units"
            docker ps -a | grep -i neuron || echo "  no containers"
            ls /usr/local/bin/ 2>/dev/null | grep -i neuron || echo "  no scripts"
            ls /opt/ 2>/dev/null | grep -i neuron || echo "  no /opt dirs"

            echo ""
            echo "=== Step 2: remove the duplicate 'workspace-*' containers ==="
            # These shared the same images as our shitaleco-* containers but
            # under project name 'workspace'. Likely Neuron-managed. Clean up.
            for c in workspace-backend-1 workspace-admin-1 workspace-kiosk-1 \
                     workspace-quick-donation-1 workspace-screen-1 \
                     workspace-service-1 workspace-db-1 workspace-nginx-1 \
                     workspace-deployer-1; do
              docker rm -f "$c" 2>/dev/null && echo "  removed $c" || true
            done

            echo ""
            echo "=== Step 3: clean docker network state ==="
            docker network prune -f >/dev/null 2>&1 || true

            echo ""
            echo "=== Step 4: bring up backend (uses local :latest, no pull) ==="
            cd /opt/shitaleco
            # Free port 8000 first if anything is still holding it
            docker rm -f shitaleco-backend-1 2>/dev/null || true
            fuser -k 8000/tcp 2>/dev/null || true
            sleep 3

            # Tag the freshest :dev as :latest so we get latest code
            docker pull ghcr.io/kammelaraj-arch/shitaleco-backend:dev || true
            docker tag ghcr.io/kammelaraj-arch/shitaleco-backend:dev \
                       ghcr.io/kammelaraj-arch/shitaleco-backend:latest || true

            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo ""
            echo "=== Step 5: wait for backend /health (up to 10 min) ==="
            for i in $(seq 1 120); do
              sleep 5
              c=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$c" = "200" ]; then
                echo "Backend healthy after $((i*5))s"
                break
              fi
              [ $((i % 12)) -eq 0 ] && echo "  attempt $i/120 ($((i*5))s)"
            done

            echo ""
            echo "=== Step 6: confirm Neuron is genuinely gone ==="
            docker ps -a | grep -i neuron || echo "  no neuron containers"
            systemctl is-enabled neuron-vhost-watchdog.timer 2>&1 || echo "  timer disabled"

            echo ""
            echo "=== Done ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
