# Daily poll of the finance inbox. Pulls UNSEEN mail, lets the
# AI classify each message, and writes invoices rows (doc_type
# INVOICE / PURCHASE_ORDER / RECEIPT / STATEMENT).
#
# Once a day keeps Azure OpenAI inference spend minimal — the
# charity typically sees a handful of supplier emails per day, so
# one pass in the morning covers them. Admins can also hit
# "Run ingest now" on the Invoices page or dispatch this workflow
# manually for an ad-hoc refresh.
#
# Prerequisites in GitHub secrets:
#   API_BASE_URL        — e.g. https://api.shital.org.uk
#   PAYMENT_SYNC_TOKEN  — same token the nightly transaction sync
#                         uses; set it in Admin → API Keys and
#                         mirror it here
#
# Prerequisites in Admin → API Keys (on the running backend):
#   INBOX_IMAP_USERNAME   finance mailbox address
#   INBOX_IMAP_PASSWORD   app password for that mailbox
#   INBOX_IMAP_HOST       (optional) default outlook.office365.com
#   INBOX_IMAP_FOLDER     (optional) default INBOX
#   AZURE_OPENAI_ENDPOINT   charity's Azure OpenAI resource URL
#   AZURE_OPENAI_API_KEY    Azure OpenAI key
#   AZURE_OPENAI_DEPLOYMENT deployment name (e.g. "gpt-4o-mini")
#   # Covered by the charity's Azure for Nonprofits grant — no
#   # ANTHROPIC key is needed. Anthropic stays as a fallback only.
#
# Idempotent: skips any email whose Message-ID is already stored.
name: Email ingest — daily

on:
  schedule:
    # 06:30 UTC every day — after overnight batches, before UK office start.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill from this date (YYYY-MM-DD). Empty = UNSEEN only.'
        required: false
        default: ''
      limit:
        description: 'Max messages per run (1-50, default 50).'
        required: false
        default: '50'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call /admin/finance/email-ingest/run/cron
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PAYMENT_SYNC_TOKEN: ${{ secrets.PAYMENT_SYNC_TOKEN }}
          SINCE: ${{ github.event.inputs.since || '' }}
          LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ] || [ -z "${PAYMENT_SYNC_TOKEN:-}" ]; then
            echo "::error::API_BASE_URL and PAYMENT_SYNC_TOKEN must be set as repo secrets"
            exit 1
          fi
          BODY="{\"limit\": ${LIMIT}"
          if [ -n "${SINCE}" ]; then
            BODY="${BODY}, \"since\": \"${SINCE}\""
          fi
          BODY="${BODY}}"
          echo "Starting email ingest with body: ${BODY}"
          RESPONSE=$(curl --fail-with-body -sS -X POST \
            "${API_BASE_URL%/}/api/v1/admin/finance/email-ingest/run/cron" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Token: ${PAYMENT_SYNC_TOKEN}" \
            -d "${BODY}")
          echo "$RESPONSE" | tee /tmp/ingest.json
          if echo "$RESPONSE" | grep -q '"status":"error"'; then
            echo "::error::Ingest reported an error — see response above"
            exit 1
          fi
          echo "Email ingest complete."
