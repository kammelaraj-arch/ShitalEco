name: Read deployer audit log + deploy-history (READ-ONLY)

# Prod stable with deployer stopped. The watchdog is provably gone, yet the
# backend went ABSENT ~19:40 and ~20:00. That signature (removed, not
# force-recreated) = a PROMOTE running deploy.sh's `docker rm -f backend`.
# This reads the deployer's audit trail + request log + deploy-history to
# name exactly what was triggered and when. READ-ONLY; deployer stays stopped.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-ops-audit.yml'

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 3m
          script: |
            set +e
            echo "=== /var/log/shital-ops.log — last 30 audited /ops/run actions ==="
            tail -30 /var/log/shital-ops.log 2>/dev/null || echo "  (no ops audit log)"

            echo ""
            echo "=== deploy-history.jsonl — last 8 (promotes/deploys w/ timestamps) ==="
            tail -8 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null \
              | sed -E 's/.*"at":"([^"]*)".*"env":"([^"]*)".*"status":"([^"]*)".*"message":"([^"]{0,60})[^"]*".*/  \1  env=\2  \3  \4/' \
              || echo "  none"

            echo ""
            echo "=== deployer incoming HTTP requests (docker logs — even though stopped) ==="
            echo "  looking for POST /deploy, /promote-prod, /ops/run around 19:35-20:05:"
            docker logs shitaleco-deployer-1 2>&1 | grep -iE 'POST|/deploy|/promote|/ops/run|recreate' | tail -25 || echo "  (no request lines / deployer logs rotated)"

            echo ""
            echo "=== promote-backend log files (deploy.sh backend dumps) — last few ==="
            ls -lt /opt/shitaleco/backups/promote-backend-*.log 2>/dev/null | head -6

            echo ""
            echo "=== current state (deployer stopped, backend should be up) ==="
            docker ps -a --filter 'name=shitaleco-deployer-1' --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
