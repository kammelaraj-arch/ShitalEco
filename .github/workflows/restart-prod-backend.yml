name: Restart Prod Backend (one-shot)
# Re-run trigger: healthcheck disabled in compose

# Surgical workflow: SSH to prod and `docker restart shitaleco-backend-1`.
# Faster than a full deploy (~60s vs 10 min), no image pull, no port-conflict
# games. Used when backend container is wedged but the rest of the stack
# is fine — e.g. recovery from the 11-Jun watchdog/cold-start race.
#
# Trigger: push to main. This file's push event itself fires the workflow
# (so we can use this without manual workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-prod-backend.yml'
  workflow_dispatch:

concurrency:
  group: restart-prod-backend
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to prod and docker restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            echo "=== ALL crons on the host (root + /etc/cron.d/ + /etc/crontab) ==="
            echo "--- root user crontab ---"
            crontab -l 2>/dev/null | head -20 || echo "(none)"
            echo "--- /etc/cron.d/ entries ---"
            ls -la /etc/cron.d/ 2>/dev/null || true
            cat /etc/cron.d/* 2>/dev/null | head -40 || true
            echo "--- /etc/crontab ---"
            cat /etc/crontab 2>/dev/null | tail -20 || true
            echo "--- recent /var/log/shital-ops.log (last 30) ---"
            tail -30 /var/log/shital-ops.log 2>/dev/null || echo "(no shital-ops.log)"
            echo ""

            echo "=== Removing watchdog AND monitor.sh crons (both kill backend mid-cold-start) ==="
            # monitor.sh check_containers() regex only matches "Up N seconds"
            # but Docker shows "Up About a minute" for 45-90s — backend gets
            # mis-classified as broken and restarted with SIGKILL right when
            # it's about to finish cold-starting. Disabling until check is fixed.
            # Also disable dev watchdog. Even though it claims to only touch
            # dev containers, backend dies at exactly 2-min uptime which
            # matches `*/2 * * * *`. Worth ruling out.
            crontab -l 2>/dev/null \
              | grep -v 'shital-prod-watchdog' \
              | grep -v 'monitor.sh' \
              | grep -v 'shital-dev-watchdog' \
              | crontab - || true
            crontab -l 2>/dev/null | head -20

            echo "=== Current backend container state ==="
            docker ps -a --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo "=== Git pull latest main (picks up compose changes) ==="
            cd /opt/shitaleco
            git fetch origin
            git reset --hard origin/main
            echo "now at: $(git log -1 --oneline)"

            echo "=== Pull :dev image and tag as :latest (force latest code) ==="
            # CI pushes images to :dev. Promote-to-Prod normally retags :dev → :latest.
            # When we need a code-fix on prod fast WITHOUT going through Promote, we
            # do that retag here. The next compose up uses :latest which now points
            # at the freshly-built CI image.
            docker pull ghcr.io/kammelaraj-arch/shitaleco-backend:dev
            docker rmi ghcr.io/kammelaraj-arch/shitaleco-backend:latest 2>/dev/null || true
            docker tag ghcr.io/kammelaraj-arch/shitaleco-backend:dev \
                       ghcr.io/kammelaraj-arch/shitaleco-backend:latest

            echo "=== Hard restart shitaleco-backend-1 ==="
            # 1. Kill ANY container holding HOST port 8000 (not just backend).
            # Grep matches only `:8000->` so it can't false-positive on dev's
            # `:8001->8000/tcp` (where container-side is 8000 but host-side is
            # 8001). The dev backend was getting killed by this workflow before
            # because of the broader `->8000` pattern.
            holder=$(docker ps -a --format '{{.ID}} {{.Names}} {{.Ports}}' | grep ':8000->' || true)
            if [ -n "$holder" ]; then
              echo "containers on port 8000:"; echo "$holder" | sed 's/^/  /'
              echo "$holder" | awk '{print $1}' | xargs -r docker rm -f
            fi
            # 2. compose-level cleanup
            docker compose -f docker-compose.prod.yml stop backend 2>/dev/null || true
            docker compose -f docker-compose.prod.yml rm -f backend 2>/dev/null || true
            docker rm -f shitaleco-backend-1 2>/dev/null || true
            # 3. Kill any process bound to port 8000
            fuser -k 8000/tcp 2>/dev/null || true
            # 4. Drop docker's internal port allocation state
            docker network prune -f >/dev/null 2>&1 || true
            # 5. Poll-wait up to 20s, then nuclear (restart docker daemon)
            STILL_BOUND=1
            for i in $(seq 1 20); do
              if ! ss -tlnp 2>/dev/null | grep -q ':8000 ' && \
                 ! docker ps --format '{{.Ports}}' 2>/dev/null | grep -q ':8000->'; then
                STILL_BOUND=0; echo "port 8000 free after ${i}s"; break
              fi
              sleep 1
            done
            if [ "$STILL_BOUND" -eq 1 ]; then
              echo "port 8000 still bound — NUCLEAR: systemctl restart docker"
              systemctl restart docker
              sleep 10
            fi
            # 6. Now safe to create backend
            # NOTE: NO --pull here. We've already done `docker pull :dev`
            # + `docker tag :dev :latest` above, so the LOCAL :latest
            # points at the freshly-built CI image. `--pull always` would
            # re-pull :latest from the REGISTRY, but CI only pushes :dev
            # (not :latest), so the registry's :latest is the stale
            # last-Promote image — overwriting our local retag with old
            # code. That was the 12-Jun "fix lands, prod still old" bug.
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "=== Waiting for /health (up to 8 min) ==="
            for i in $(seq 1 96); do
              sleep 5
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "BACKEND HEALTHY after $((i*5))s"
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  attempt $i/96"
            done

            echo "=== Final state ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s http://localhost:8000/health | head -c 200 || echo "still 502"

            echo ""
            echo "=== Backend logs (last 100 lines) ==="
            docker logs --tail=100 shitaleco-backend-1 2>&1 | sed 's/^/  /'

            echo ""
            echo "=== Monitoring backend for 6 min — catch the death window ==="
            # Backend has been dying at 1-4 min after startup. Poll /health
            # every 20s; if it goes from 200 → not-200, dump logs IMMEDIATELY
            # to capture what was happening at the moment of death.
            BACKEND_DIED_AT=""
            for i in $(seq 1 18); do
              sleep 20
              c=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:8000/health 2>/dev/null || echo "000")
              echo "  t=$((i*20))s /health=${c}"
              if [ "$c" != "200" ]; then
                BACKEND_DIED_AT="$((i*20))s"
                echo "  *** BACKEND DIED at t=${BACKEND_DIED_AT} ***"
                break
              fi
            done

            if [ -n "$BACKEND_DIED_AT" ]; then
              echo "=== docker events for last 5 min (shows WHO/WHAT acted on backend) ==="
              docker events --since 5m --until 0s --filter container=shitaleco-backend-1 2>&1 | head -50 || true
              echo ""
              echo "=== systemd journal for docker daemon (any crashes / restarts) ==="
              journalctl -u docker --since "5 minutes ago" 2>&1 | tail -40 || true
              echo ""
              echo "=== Backend container state ==="
              docker inspect shitaleco-backend-1 --format '{{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' || true
              docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}} → {{.State.FinishedAt}}' || true
              echo ""
              echo "=== Backend container logs (last 250 lines) ==="
              docker logs --tail=250 shitaleco-backend-1 2>&1 | sed 's/^/  /' || true
              echo ""
              echo "=== Host memory at time of death ==="
              free -h
              echo ""
              echo "=== dmesg for OOM kills (last 5) ==="
              dmesg | grep -i "oom\|killed" | tail -5 || echo "  (no OOM events in dmesg)"
            else
              echo "Backend stayed alive 6 min — diagnostic window passed without death"
            fi

            echo ""
            echo "=== Watchdog cron LEFT DISABLED ==="
            echo "The */5 min watchdog was kicking backend mid-cold-start (cold"
            echo "start = 5-8 min; watchdog timer = 5 min; backend never"
            echo "finished booting). Leaving cron off until we make the"
            echo "watchdog deploy-aware. Re-install manually with:"
            echo "  (crontab -l 2>/dev/null | grep -v shital-prod-watchdog ; \\"
            echo "   echo '*/15 * * * * /opt/shitaleco/infra/watchdog-prod.sh') | crontab -"
            crontab -l 2>/dev/null | grep -v shital || echo "no shital crons (clean)"

            echo ""
            echo "=== Done ==="
