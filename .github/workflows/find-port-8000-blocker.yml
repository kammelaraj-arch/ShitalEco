name: Find and remove all containers blocking port 8000

# Port 8000 is free at the OS level (ss/fuser/lsof confirm) but docker
# daemon refuses to bind it for shitaleco-backend-1. This means another
# container — visible or not — has port 8000 in its mapping spec.
# Find ALL containers (any name, any state) that publish 8000, remove them,
# then bring backend up.

on:
  push:
    branches: [claude/fix-access-payment-stability-Q40dj]
    paths:
      - '.github/workflows/find-port-8000-blocker.yml'
  workflow_dispatch:

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 8m
          script: |
            set +e

            echo "=== ALL containers (any state) ==="
            docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "=== Any with 8000 in their port spec? ==="
            # Inspect every container; print any whose PortBindings include 8000.
            for cid in $(docker ps -a -q); do
              has8000=$(docker inspect "$cid" --format '{{.Name}} state={{.State.Status}} hostport_8000={{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' 2>/dev/null)
              # Filter for ones referencing 8000
              hp=$(docker inspect "$cid" --format '{{range $p, $bs := .HostConfig.PortBindings}}{{if eq $p "8000/tcp"}}{{range $bs}}{{.HostPort}}{{end}}{{end}}{{end}}' 2>/dev/null)
              if [ "$hp" = "8000" ]; then
                name=$(docker inspect "$cid" --format '{{.Name}}' 2>/dev/null)
                state=$(docker inspect "$cid" --format '{{.State.Status}}' 2>/dev/null)
                echo "  $cid  $name  state=$state  publishes 8000:8000"
              fi
            done

            echo ""
            echo "=== Force-remove every container with host-port 8000 binding ==="
            for cid in $(docker ps -a -q); do
              hp=$(docker inspect "$cid" --format '{{range $p, $bs := .HostConfig.PortBindings}}{{if eq $p "8000/tcp"}}{{range $bs}}{{.HostPort}}{{end}}{{end}}{{end}}' 2>/dev/null)
              if [ "$hp" = "8000" ]; then
                name=$(docker inspect "$cid" --format '{{.Name}}' 2>/dev/null)
                echo "  removing $name ($cid)"
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done

            echo ""
            echo "=== After removal, ALL containers ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "=== Now compose up backend ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            timeout 60 docker compose -f docker-compose.prod.yml up -d --no-deps backend 2>&1
            UP_RC=$?
            echo "compose up exit=$UP_RC"

            if [ "$UP_RC" != "0" ]; then
              echo "!!! compose up STILL failed. Trying: docker network restart on prod network"
              # Last resort: disconnect and reconnect the network
              docker network inspect shitaleco_internal --format '{{json .Containers}}' | head -c 500
              echo ""
            fi

            echo ""
            echo "=== Wait /health (4 min) ==="
            for i in $(seq 1 48); do
              sleep 5
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$c" = "200" ]; then
                echo "OK — healthy after $((i*5))s"
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  $i/48 ($((i*5))s) — got $c"
            done

            echo ""
            echo "=== Final ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host /health → %{http_code}\n" -m 5 http://localhost:8000/health
            docker logs --tail 30 shitaleco-backend-1 2>&1 | tail -30
