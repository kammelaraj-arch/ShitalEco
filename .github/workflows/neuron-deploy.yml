name: Neuron Auto-Deploy

# Auto-deploys the Neuron block to production by hitting the existing
# ShitalEco webhook deployer at https://shital.org.uk/deploy/neuron.
# That endpoint is served by the `deployer` container, which runs
# /workspace/neuron-platform/deploy.sh in the background. This is the
# same pattern the main ShitalEco workflow uses (deploy-vultr.yml),
# so we no longer need SSH keys, hostnames, or username secrets.
#
# Required GitHub Actions secret:
#
#   DEPLOY_SECRET   The X-Deploy-Secret header value the deployer
#                   accepts. Already set for ShitalEco — Neuron reuses it.
#
# That's it. No SSH key, no NEURON_DEPLOY_HOST, no NEURON_DEPLOY_USER.

on:
  push:
    branches:
      - claude/shital-erp-platform-iR2UF
    paths:
      - 'neuron-platform/**'
      - '.github/workflows/neuron-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: neuron-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Neuron Master to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Neuron webhook deployer
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -e
          # Fall back to the same default the ShitalEco workflow uses
          # if the secret is missing — keeps both stacks in lockstep.
          SECRET="${DEPLOY_SECRET:-ShitalDeploy2026!}"
          echo "==> POST https://shital.org.uk/deploy/neuron"
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST https://shital.org.uk/deploy/neuron \
            -H "X-Deploy-Secret: ${SECRET}" \
            --max-time 15 --retry 3 --retry-delay 5)
          echo "HTTP ${code}"
          cat /tmp/body || true
          # 202 = accepted (deployer started in background)
          [ "$code" = "202" ] || { echo "::error::deployer rejected the webhook"; exit 1; }

      - name: Wait for the Master to come back up
        run: |
          set -e
          # The deployer runs deploy.sh in the background, so we poll
          # the live healthz until the new revision is up. ~3 min budget.
          for i in $(seq 1 36); do
            if out=$(curl -fsS --max-time 5 https://neuron.shital.org.uk/healthz 2>/dev/null); then
              echo "attempt $i: $out"
              echo "$out" | grep -q '"status":"ok"' && exit 0
            else
              echo "attempt $i: not ready yet"
            fi
            sleep 5
          done
          echo "::error::healthz didn't return ok within 3 minutes"
          exit 1
