name: Neuron Auto-Deploy

# Auto-deploys the Neuron block to the production VPS the moment a
# neuron-platform/** change lands on the deploy branch. Never touches
# any ShitalEco service — calls neuron-platform/deploy.sh which is
# fully isolated.
#
# Required GitHub Actions secrets (set under
#  Settings → Secrets and variables → Actions):
#
#   NEURON_DEPLOY_HOST       e.g. 192.248.147.205
#   NEURON_DEPLOY_USER       typically 'root'
#
# AND ONE of the following two — base64 is preferred because GitHub's
# secret form sometimes mangles multi-line PEM whitespace:
#
#   NEURON_DEPLOY_KEY_B64    base64(private key file).  Single line.
#                            Generate with:  base64 -w 0 /root/neuron_deploy
#   NEURON_DEPLOY_KEY        raw -----BEGIN OPENSSH PRIVATE KEY-----…
#                            -----END OPENSSH PRIVATE KEY----- block.
#
#   NEURON_DEPLOY_PORT       optional, defaults to 22
#
# Generate the key on the VPS:
#
#   ssh-keygen -t ed25519 -C "neuron-deploy@github" -f /root/neuron_deploy -N ""
#   cat /root/neuron_deploy.pub >> /root/.ssh/authorized_keys
#   cat /root/neuron_deploy   # paste this whole block into the secret
#   # After the workflow runs green:
#   shred -u /root/neuron_deploy

on:
  push:
    branches:
      - claude/shital-erp-platform-iR2UF
    paths:
      - 'neuron-platform/**'
      - '.github/workflows/neuron-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_pull:
        description: "Skip the deploy.sh git pull"
        type: boolean
        default: false
      skip_nginx:
        description: "Skip the nginx -s reload"
        type: boolean
        default: false

concurrency:
  group: neuron-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Neuron Master to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate required secrets
        env:
          NEURON_DEPLOY_HOST: ${{ secrets.NEURON_DEPLOY_HOST }}
          NEURON_DEPLOY_USER: ${{ secrets.NEURON_DEPLOY_USER }}
          NEURON_DEPLOY_KEY: ${{ secrets.NEURON_DEPLOY_KEY }}
          NEURON_DEPLOY_KEY_B64: ${{ secrets.NEURON_DEPLOY_KEY_B64 }}
        run: |
          missing=0
          for v in NEURON_DEPLOY_HOST NEURON_DEPLOY_USER; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          if [ -z "$NEURON_DEPLOY_KEY" ] && [ -z "$NEURON_DEPLOY_KEY_B64" ]; then
            echo "::error::Set NEURON_DEPLOY_KEY (raw PEM) or NEURON_DEPLOY_KEY_B64 (base64). Base64 is preferred."
            missing=1
          fi
          [ $missing -eq 0 ]

      # ── Pre-flight: decode + sanity-check the SSH key ──────────────────────
      # Prefers NEURON_DEPLOY_KEY_B64 (single line, paste-safe). Falls back
      # to NEURON_DEPLOY_KEY (raw PEM) when the b64 secret isn't set.
      # Either way, we end up with a normalised key file at /tmp/.ssh/test_key
      # and assert it parses with ssh-keygen.
      - name: Decode + sanity-check the deploy key
        id: keycheck
        env:
          KEY:     ${{ secrets.NEURON_DEPLOY_KEY }}
          KEY_B64: ${{ secrets.NEURON_DEPLOY_KEY_B64 }}
        run: |
          mkdir -p /tmp/.ssh
          # Length-only diagnostic (NEVER prints the actual values).
          echo "NEURON_DEPLOY_KEY     length: ${#KEY}"
          echo "NEURON_DEPLOY_KEY_B64 length: ${#KEY_B64}"
          if [ -n "$KEY_B64" ]; then
            echo "Source: NEURON_DEPLOY_KEY_B64"
            # Tolerate base64 with or without line wrapping.
            printf '%s' "$KEY_B64" | tr -d ' \n\r' | base64 -d > /tmp/.ssh/test_key
          else
            echo "Source: NEURON_DEPLOY_KEY (raw PEM)"
            if [ -z "$KEY" ]; then
              echo "::error::Both secrets are empty. Save NEURON_DEPLOY_KEY_B64 with the output of: base64 -w 0 /root/neuron_deploy"
              exit 1
            fi
            printf '%s\n' "$KEY" | tr -d '\r' > /tmp/.ssh/test_key
          fi
          chmod 600 /tmp/.ssh/test_key
          echo "Key file byte count: $(wc -c < /tmp/.ssh/test_key)"
          echo "Key file line count: $(wc -l < /tmp/.ssh/test_key)"
          echo "First line:          $(head -1 /tmp/.ssh/test_key)"
          echo "Last  line:          $(tail -1 /tmp/.ssh/test_key)"
          if ssh-keygen -y -f /tmp/.ssh/test_key > /tmp/.ssh/test_key.pub 2>&1; then
            echo "::notice::Private key parses OK."
            echo "Derived public key (compare against /root/.ssh/authorized_keys on the VPS):"
            cat /tmp/.ssh/test_key.pub
          else
            echo "::error::Private key did NOT parse:"
            ssh-keygen -y -f /tmp/.ssh/test_key 2>&1 | sed 's/^/  /'
            if [ -n "$KEY_B64" ]; then
              echo "::error::Re-generate the b64 secret with: base64 -w 0 /root/neuron_deploy"
            else
              echo "::error::Switch to NEURON_DEPLOY_KEY_B64 — base64 -w 0 /root/neuron_deploy"
            fi
            exit 1
          fi

      - name: Set up ssh-agent with the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cp /tmp/.ssh/test_key ~/.ssh/id_neuron
          chmod 600 ~/.ssh/id_neuron
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_neuron
          # Persist the agent socket for following steps.
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Trust the VPS host key (one-time per run)
        env:
          HOST: ${{ secrets.NEURON_DEPLOY_HOST }}
          PORT: ${{ secrets.NEURON_DEPLOY_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "known_hosts entries:"
          wc -l ~/.ssh/known_hosts

      - name: Run neuron-platform/deploy.sh on the VPS
        env:
          HOST: ${{ secrets.NEURON_DEPLOY_HOST }}
          USER: ${{ secrets.NEURON_DEPLOY_USER }}
          PORT: ${{ secrets.NEURON_DEPLOY_PORT || 22 }}
          SKIP_PULL: ${{ github.event.inputs.skip_pull || 'false' }}
          SKIP_NGINX: ${{ github.event.inputs.skip_nginx || 'false' }}
        run: |
          FLAGS=""
          [ "$SKIP_PULL" = "true" ]  && FLAGS="$FLAGS --no-pull"
          [ "$SKIP_NGINX" = "true" ] && FLAGS="$FLAGS --no-nginx"
          echo "==> Triggered by ${{ github.event_name }} from ${{ github.sha }}"
          echo "==> Running: bash neuron-platform/deploy.sh $FLAGS"
          # -tt forces a TTY (better progress output for compose build),
          # -o ConnectTimeout cuts the wait if the box is unreachable.
          ssh -tt \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -o BatchMode=yes \
              -p "$PORT" "$USER@$HOST" \
              "set -e; cd /opt/shitaleco && bash neuron-platform/deploy.sh $FLAGS"

      - name: Smoke test the live Master
        env:
          HOST: ${{ secrets.NEURON_DEPLOY_HOST }}
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            if out=$(curl -fsS  --max-time 8 "https://${HOST}/healthz" 2>/dev/null) ||
               out=$(curl -fsSk --max-time 8 -H "Host: neuron.shital.org.uk" \
                     "https://${HOST}/healthz" 2>/dev/null); then
              echo "healthz: $out"
              echo "$out" | grep -q '"status":"ok"' && exit 0
            fi
            echo "attempt $i: waiting…"
            sleep 5
          done
          echo "::error::healthz didn't return ok after 6 retries"
          exit 1
