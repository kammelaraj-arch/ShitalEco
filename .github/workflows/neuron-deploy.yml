name: Neuron Auto-Deploy

# Auto-deploys the Neuron block by hitting the NEURON-OWNED webhook
# deployer at https://neuron.shital.org.uk/deploy. That endpoint is
# served by the `neuron-deployer` container (see
# neuron-platform/master_platform/docker-compose.yml) — a completely
# separate image, secret, and port from the ShitalEco /deploy webhook.
# This workflow can NOT trigger a ShitalEco deploy and vice-versa.
#
# Required GitHub Actions secret:
#
#   NEURON_DEPLOY_SECRET   The X-Deploy-Secret header value the
#                          neuron-deployer accepts. Must match the
#                          NEURON_DEPLOY_SECRET env var on the VPS.

on:
  push:
    branches:
      - claude/shital-erp-platform-iR2UF
    paths:
      - 'neuron-platform/**'
      - '.github/workflows/neuron-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: neuron-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Neuron Master to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secret
        env:
          NEURON_DEPLOY_SECRET: ${{ secrets.NEURON_DEPLOY_SECRET }}
        run: |
          if [ -z "$NEURON_DEPLOY_SECRET" ]; then
            echo "::error::NEURON_DEPLOY_SECRET is not set in repo secrets."
            echo "::error::Set it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Trigger Neuron webhook deployer
        env:
          NEURON_DEPLOY_SECRET: ${{ secrets.NEURON_DEPLOY_SECRET }}
        run: |
          set -e
          echo "==> POST https://neuron.shital.org.uk/deploy"
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST https://neuron.shital.org.uk/deploy \
            -H "X-Deploy-Secret: ${NEURON_DEPLOY_SECRET}" \
            --max-time 15 --retry 3 --retry-delay 5)
          echo "HTTP ${code}"
          cat /tmp/body || true
          [ "$code" = "202" ] || { echo "::error::neuron-deployer rejected the webhook"; exit 1; }

      - name: Wait for the Master to come back up
        run: |
          set -e
          # neuron-deployer runs deploy.sh in the background; poll
          # /healthz until the new revision is live. ~3 min budget.
          for i in $(seq 1 36); do
            if out=$(curl -fsS --max-time 5 https://neuron.shital.org.uk/healthz 2>/dev/null); then
              echo "attempt $i: $out"
              echo "$out" | grep -q '"status":"ok"' && exit 0
            else
              echo "attempt $i: not ready yet"
            fi
            sleep 5
          done
          echo "::error::healthz didn't return ok within 3 minutes"
          exit 1
