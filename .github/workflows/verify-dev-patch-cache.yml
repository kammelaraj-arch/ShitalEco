name: Verify schema-patch cache on dev (before promoting to prod)

# Two-part test:
# 1. Read current dev backend logs — did first boot with new code
#    actually record patches to schema_patches_applied?
# 2. Restart backend-dev, time the cold-start, look for the
#    'schema_patch_skipped_cached' log line confirming the cache hit.
#
# If cache works on dev, prod can be promoted safely with the assurance
# that the second restart will be fast.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-dev-patch-cache.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 12m
          script: |
            set +e

            echo "=== current backend-dev state ==="
            docker ps -a --filter 'name=shitaleco-dev-backend-dev-1' --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "=== dev backend log tail (200 lines) — first-boot evidence ==="
            docker logs --tail 200 shitaleco-dev-backend-dev-1 2>&1 | tail -200

            echo ""
            echo "=== schema_patches_applied row count (proof first boot recorded) ==="
            docker exec shitaleco-dev-db-dev-1 \
              psql -U shitaleco_dev_user -d shitaleco_dev_db \
                -c "SELECT COUNT(*) AS applied_patches FROM schema_patches_applied" 2>&1 \
              || echo "  table missing or db unreachable"

            echo ""
            echo "=== Force-recreate backend-dev to TIME the second boot ==="
            T0=$(date +%s)
            cd /opt/shitaleco-dev
            docker compose -p shitaleco-dev -f docker-compose.dev.yml up -d --force-recreate backend-dev 2>&1 | tail -20

            echo ""
            echo "=== Wait for /health on backend-dev (host port 8001) ==="
            for i in $(seq 1 60); do
              sleep 5
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { T1=$(date +%s); echo "OK after $((T1-T0))s"; break; }
              [ $((i % 6)) -eq 0 ] && echo "  $((i*5))s — $c"
            done

            echo ""
            echo "=== Look for cache-hit signal in fresh logs ==="
            docker logs --since 5m shitaleco-dev-backend-dev-1 2>&1 \
              | grep -E "schema_patch_skipped_cached|schema_patch_done|schema_patch_progress|email_template_seed_failed" \
              | tail -20

            echo ""
            echo "=== schema_patches_applied count after restart ==="
            docker exec shitaleco-dev-db-dev-1 \
              psql -U shitaleco_dev_user -d shitaleco_dev_db \
                -c "SELECT COUNT(*) AS applied_patches FROM schema_patches_applied" 2>&1
