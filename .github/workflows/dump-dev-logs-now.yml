name: Dump dev backend logs NOW

# One-shot: SSH in, dump the last 200 lines of backend-dev (whether it's
# running, restarting, or dead). Auto-fires on push to this branch.
# Previous recovery ran the log dump BEFORE the up -d so it caught nothing;
# this just gets us the post-crash logs from the existing container.
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/dump-dev-logs-now.yml

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and dump backend-dev logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set +e
            echo "=== docker ps -a for backend-dev ==="
            docker ps -a --filter 'name=shitaleco-dev-backend-dev-1' --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'

            echo ""
            echo "=== container State (Status / ExitCode / OOMKilled / Restarts) ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Status={{.State.Status}}  Exit={{.State.ExitCode}}  OOMKilled={{.State.OOMKilled}}  Restarts={{.RestartCount}}  StartedAt={{.State.StartedAt}}  FinishedAt={{.State.FinishedAt}}  Error={{.State.Error}}' 2>&1 || true

            echo ""
            echo "=== LAST 200 LINES OF backend-dev LOG (this is what crashed it) ==="
            docker logs --tail 200 shitaleco-dev-backend-dev-1 2>&1 | tail -200

            echo ""
            echo "=== docker events for backend-dev in the last 10 min (OOM, exit, etc.) ==="
            since_ts=$(date -u -d '10 minutes ago' '+%Y-%m-%dT%H:%M:%S' 2>/dev/null || date -u -v -10M '+%Y-%m-%dT%H:%M:%S')
            timeout 5 docker events --since "$since_ts" --until "$(date -u '+%Y-%m-%dT%H:%M:%S')" \
              --filter "container=shitaleco-dev-backend-dev-1" 2>&1 | head -40

            echo ""
            echo "=== external dev probe NOW ==="
            for u in https://dev.shital.org.uk/health https://dev.shital.org.uk/; do
              c=$(curl -sk -o /dev/null -w '%{http_code}' -m 6 "$u" 2>/dev/null || echo 000)
              echo "  $u → $c"
            done
