name: Diagnose prod state (read-only)

# Pure diagnostic — does NOT touch docker compose, NOT remove containers,
# NOT restart anything. Just reports the current state of the prod stack
# so we can tell if a promote is mid-cold-start or stalled.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-prod-state.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 4m
          script: |
            set +e

            echo "================ TIME ================"
            date -u +'%Y-%m-%d %H:%M:%S UTC (host)'

            echo ""
            echo "================ docker ps (all shitaleco-*) ================"
            docker ps -a --filter 'name=shitaleco-' \
              --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | head -30

            echo ""
            echo "================ prod backend state ================"
            docker inspect shitaleco-backend-1 \
              --format 'StartedAt={{.State.StartedAt}}  Status={{.State.Status}}  ExitCode={{.State.ExitCode}}  Restarts={{.RestartCount}}  Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null \
              || echo "  shitaleco-backend-1 ABSENT"

            echo ""
            echo "================ dev backend state ================"
            docker inspect shitaleco-dev-backend-dev-1 \
              --format 'StartedAt={{.State.StartedAt}}  Status={{.State.Status}}  ExitCode={{.State.ExitCode}}  Restarts={{.RestartCount}}  Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null \
              || echo "  shitaleco-dev-backend-dev-1 ABSENT"

            echo ""
            echo "================ host :8000 / :8001 ================"
            curl -s -o /dev/null -w "  prod :8000/health → %{http_code}\n" -m 4 http://localhost:8000/health
            curl -s -o /dev/null -w "  dev  :8001/health → %{http_code}\n" -m 4 http://localhost:8001/health 2>/dev/null

            echo ""
            echo "================ prod backend log tail (80 lines) ================"
            docker logs --tail 80 shitaleco-backend-1 2>&1 | sed 's/^/  /'

            echo ""
            echo "================ deployer log tail (40 lines) ================"
            docker logs --tail 40 shitaleco-deployer-1 2>&1 | sed 's/^/  /'

            echo ""
            echo "================ latest in-flight deploy.log ================"
            DLOG=$(ls -t /opt/shitaleco/backups/promote-backend-*.log 2>/dev/null | head -1)
            if [ -z "$DLOG" ]; then DLOG=$(ls -t /opt/shitaleco/backups/deploy-*.log 2>/dev/null | head -1); fi
            if [ -n "$DLOG" ]; then
              echo "  file: $DLOG  ($(stat -c '%y' "$DLOG"))"
              tail -80 "$DLOG" | sed 's/^/  /'
            else
              echo "  no deploy log found in /opt/shitaleco/backups/"
            fi

            echo ""
            echo "================ deploy-history tail (5) ================"
            tail -5 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null | sed 's/^/  /'

            echo ""
            echo "================ /opt/shitaleco/deployer/deploy.sh has target-aware fix? ================"
            grep -n 'BACKEND_CONTAINER=' /opt/shitaleco/deployer/deploy.sh | head -4 | sed 's/^/  /'
            grep -c 'docker rm -f shitaleco-backend-1 2>/dev/null' /opt/shitaleco/deployer/deploy.sh \
              | sed 's/^/  literal unconditional-rm occurrences (expect 0): /'
