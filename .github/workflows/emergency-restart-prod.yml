name: EMERGENCY restart prod backend

# Aggressive — assumes docker daemon may be sluggish/hung from OOM pressure.
# 1. Stop non-essential dev containers to free RAM
# 2. Kill any stuck docker compose processes
# 3. Restart docker daemon if needed
# 4. docker run backend directly (no compose) to bypass any compose-state issues
# 5. Verify

on:
  push:
    branches: [claude/fix-access-payment-stability-Q40dj]
    paths:
      - '.github/workflows/emergency-restart-prod.yml'
  workflow_dispatch:

jobs:
  emergency:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            set +e
            echo "=== Host memory + load ==="
            free -h
            uptime
            echo ""

            echo "=== Top 10 memory consumers ==="
            ps -eo pid,rss,comm --sort=-rss 2>/dev/null | head -11

            echo ""
            echo "=== List stuck docker compose processes (do NOT pkill; matched our own script last time) ==="
            pgrep -af 'docker compose' 2>/dev/null | grep -v "$$" | head -5 || true

            echo ""
            echo "=== Free RAM: stop the non-critical dev containers (we can restart them later) ==="
            for c in shitaleco-dev-screen-dev-1 shitaleco-dev-kiosk-dev-1 \
                     shitaleco-dev-quick-donation-dev-1 shitaleco-dev-service-dev-1; do
              docker stop --time=2 "$c" 2>/dev/null && echo "  stopped $c" || true
            done

            echo ""
            echo "=== free -h after stop ==="
            free -h

            echo ""
            echo "=== Check backend container state ==="
            docker ps -a --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'

            # Force-remove any lingering shitaleco-backend-1
            docker rm -f shitaleco-backend-1 2>/dev/null && echo "removed lingering" || echo "no lingering container"

            echo ""
            echo "=== Confirm :latest image exists locally ==="
            docker images ghcr.io/kammelaraj-arch/shitaleco-backend --format 'table {{.Tag}}\t{{.ID}}\t{{.CreatedSince}}'

            # If no :latest, pull :dev and retag
            if ! docker image inspect ghcr.io/kammelaraj-arch/shitaleco-backend:latest >/dev/null 2>&1; then
              echo "  no :latest — pulling :dev (may take 1-2 min)"
              docker pull ghcr.io/kammelaraj-arch/shitaleco-backend:dev
              docker tag ghcr.io/kammelaraj-arch/shitaleco-backend:dev \
                         ghcr.io/kammelaraj-arch/shitaleco-backend:latest
            fi

            echo ""
            echo "=== Bring backend up via compose (no pull — use whatever :latest is) ==="
            cd /opt/shitaleco
            # Load .env so DATABASE_URL etc. are populated
            set -a; [ -f .env ] && . .env; set +a
            timeout 90 docker compose -f docker-compose.prod.yml up -d --no-deps backend
            UP_RC=$?
            echo "compose up exit=$UP_RC"

            echo ""
            echo "=== State after up ==="
            docker ps -a --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "=== Wait for /health (up to 3 min) ==="
            HEALTHY=0
            for i in $(seq 1 36); do
              sleep 5
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$c" = "200" ]; then
                echo "OK — backend healthy after $((i*5))s"
                HEALTHY=1
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  attempt $i/36 ($((i*5))s) — got $c"
            done

            echo ""
            echo "=== Final state ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "external /health → %{http_code}\n" -m 5 http://localhost:8000/health

            if [ "$HEALTHY" != "1" ]; then
              echo ""
              echo "=== !!! Backend STILL not healthy — dump logs ==="
              docker logs --tail 80 shitaleco-backend-1 2>&1 | tail -80
              exit 4
            fi

            echo ""
            echo "=== Bring dev non-essentials back up ==="
            cd /opt/shitaleco-dev
            timeout 60 docker compose -f docker-compose.dev.yml up -d --no-deps \
              screen-dev kiosk-dev quick-donation-dev service-dev 2>&1 | tail -10 || true
