name: Diag backend-dev state NOW

# What's actually on the host vs main HEAD:
# - docker-compose.dev.yml memory limit
# - running container's memory limit (Memory cgroup setting)
# - running container's image SHA vs latest :dev in GHCR
# - last 60 lines of backend-dev logs
# - container State (Status / OOMKilled / Restarts)
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/diag-backend-dev-state.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set +e
            echo "=== /opt/shitaleco-dev git state ==="
            cd /opt/shitaleco-dev
            git log -1 --oneline
            echo ""
            echo "=== docker-compose.dev.yml memory limit on disk ==="
            grep -nE 'memory:' docker-compose.dev.yml | head
            echo ""
            echo "=== RUNNING container memory limit (cgroup) ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Memory limit (bytes)={{.HostConfig.Memory}}' 2>&1
            echo "(1G = 1073741824, 384M = 402653184, 0 = no limit)"
            echo ""
            echo "=== RUNNING container image vs latest :dev ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Image={{.Image}}  Created={{.Created}}' 2>&1
            docker images ghcr.io/kammelaraj-arch/shitaleco-backend --format 'Tag={{.Tag}}  ID={{.ID}}  Created={{.CreatedSince}}' | head -4
            echo ""
            echo "=== Container State ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Status={{.State.Status}}  Exit={{.State.ExitCode}}  OOM={{.State.OOMKilled}}  Restarts={{.RestartCount}}  StartedAt={{.State.StartedAt}}  FinishedAt={{.State.FinishedAt}}' 2>&1
            echo ""
            echo "=== Last 60 backend-dev log lines ==="
            docker logs --tail 60 shitaleco-dev-backend-dev-1 2>&1 | tail -60
            echo ""
            echo "=== dmesg | tail (for OOM-killer kernel messages) ==="
            dmesg 2>/dev/null | grep -iE 'killed|oom' | tail -10 || echo "(no dmesg access)"
            echo ""
            echo "=== external dev NOW ==="
            curl -sk -o /dev/null -w "  /health → %{http_code}\n" -m 8 https://dev.shital.org.uk/health
            n=$(curl -sk -m 12 https://dev.shital.org.uk/openapi.json 2>/dev/null | grep -c 'refresh-from-paypal' 2>/dev/null || echo 0)
            echo "  openapi has refresh-from-paypal: $n"
