name: Patch prod /opt/shitaleco/deployer/deploy.sh in place

# Apply the deploy.sh fix to prod's filesystem WITHOUT triggering a full
# prod deploy. The deploy.sh file is bind-mounted into the deployer
# container as read-only, so updating it on the host filesystem takes
# effect the next time the deployer runs deploy.sh.

on:
  push:
    branches: [claude/fix-access-payment-stability-Q40dj]
    paths:
      - '.github/workflows/patch-prod-deployer.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/fix-access-payment-stability-Q40dj

      - name: Copy fixed deploy.sh to prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          source: "deployer/deploy.sh"
          target: "/opt/shitaleco/"
          overwrite: true

      - name: Verify + smoke-check prod still healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          script: |
            set +e
            echo "=== deploy.sh on prod filesystem ==="
            ls -la /opt/shitaleco/deployer/deploy.sh
            echo ""
            echo "=== Check fix is present (look for the new conditional pull) ==="
            grep -n "Using locally-promoted :latest" /opt/shitaleco/deployer/deploy.sh || echo "  fix NOT found"
            grep -n "FINAL AUDIT" /opt/shitaleco/deployer/deploy.sh || echo "  final-audit NOT found"

            echo ""
            echo "=== Prod backend still healthy? ==="
            curl -s -o /dev/null -w "/health → %{http_code}\n" -m 5 http://localhost:8000/health
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
