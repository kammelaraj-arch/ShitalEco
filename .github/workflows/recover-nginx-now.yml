# P0 — recreate prod nginx that vanished after promote (round 2)
name: P0 — recover nginx now
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/recover-nginx-now.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set +e
            cd /opt/shitaleco

            echo "=== nginx container state ==="
            docker ps -a --filter 'name=shitaleco-nginx-1' --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "=== host systemd nginx hogging 80/443? ==="
            systemctl is-active nginx 2>&1 | head -1
            ss -tlnp 'sport = :80 or sport = :443' 2>&1 | head -6

            echo ""
            echo "=== recreate nginx ==="
            docker compose -p shitaleco -f docker-compose.prod.yml --env-file .env up -d nginx 2>&1 | tail -12
            sleep 5
            docker restart shitaleco-nginx-1 2>&1 | tail -3
            sleep 5

            echo ""
            echo "=== probes after recovery ==="
            for url in https://shital.org.uk/health https://kiosk.shital.org.uk/health https://admin.shital.org.uk/admin/ https://donate.shital.org.uk/donate/ https://service.shital.org.uk/; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
              echo "  $url → $code"
            done

            echo ""
            echo "=== if still down, force-recreate ==="
            code=$(curl -sk -o /dev/null -w '%{http_code}' -m 6 https://shital.org.uk/health 2>/dev/null || echo 000)
            if [ "$code" != "200" ]; then
              echo ">>> still ${code}, force-recreate nginx"
              docker compose -p shitaleco -f docker-compose.prod.yml --env-file .env up -d --force-recreate --no-deps nginx 2>&1 | tail -10
              sleep 6
              for url in https://shital.org.uk/health https://admin.shital.org.uk/admin/ https://kiosk.shital.org.uk/health; do
                code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
                echo "  POST-RECREATE $url → $code"
              done
              echo "--- nginx logs ---"
              docker logs shitaleco-nginx-1 --tail 25 2>&1 | tail -25
            else
              echo ">>> recovered"
            fi

            echo ""
            echo "=== new-code proof via nginx now ==="
            curl -sk -m 6 -X POST https://kiosk.shital.org.uk/api/v1/kiosk-devices/c5c4df64-beba-45d1-b8bb-ff31639bf3fd/heartbeat -w '\nHTTP %{http_code}\n' 2>&1 | tail -3
