# P0 URGENT — prod down, recover nginx + backend
name: P0 — recover nginx now
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/recover-nginx-now.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 4m
          script: |
            set +e
            cd /opt/shitaleco

            echo "=== current container states ==="
            docker ps -a --filter 'name=shitaleco-' --format 'table {{.Names}}\t{{.Status}}' | head -15

            echo ""
            echo "=== host nginx hogging 80/443? ==="
            systemctl is-active nginx 2>&1 | head -1
            systemctl stop nginx 2>/dev/null; systemctl disable nginx 2>/dev/null

            echo ""
            echo "=== bring up backend + nginx (no pull, no recreate of healthy ones) ==="
            docker compose -p shitaleco -f docker-compose.prod.yml --env-file .env up -d backend nginx 2>&1 | tail -15

            sleep 6
            docker restart shitaleco-nginx-1 2>&1 | tail -3
            sleep 6

            echo ""
            echo "=== probes ==="
            for url in https://shital.org.uk/health https://admin.shital.org.uk/admin/ https://kiosk.shital.org.uk/health https://donate.shital.org.uk/donate/ https://service.shital.org.uk/; do
              code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
              echo "  $url → $code"
            done

            echo ""
            code=$(curl -sk -o /dev/null -w '%{http_code}' -m 6 https://shital.org.uk/health 2>/dev/null || echo 000)
            if [ "$code" != "200" ]; then
              echo ">>> still ${code} — force-recreate backend + nginx"
              docker compose -p shitaleco -f docker-compose.prod.yml --env-file .env up -d --force-recreate --no-deps backend nginx 2>&1 | tail -12
              sleep 20
              for url in https://shital.org.uk/health https://admin.shital.org.uk/admin/; do
                code=$(curl -sk -o /dev/null -w '%{http_code}' -m 8 "$url" 2>/dev/null || echo 000)
                echo "  RETRY $url → $code"
              done
              echo "--- backend last 30 logs ---"
              docker logs shitaleco-backend-1 --tail 30 2>&1 | tail -30
              echo "--- nginx last 15 logs ---"
              docker logs shitaleco-nginx-1 --tail 15 2>&1 | tail -15
            else
              echo ">>> RECOVERED — all serving"
            fi

            echo ""
            echo "=== backend state ==="
            docker inspect shitaleco-backend-1 --format 'Status={{.State.Status}} Health={{.State.Health.Status}} Restarts={{.RestartCount}} OOM={{.State.OOMKilled}}' 2>&1
            free -h | head -2
