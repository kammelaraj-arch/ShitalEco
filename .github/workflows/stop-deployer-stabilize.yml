name: Stop deployer (proven mitigation) + check bind-mount + stabilize prod

# Backend still deleted ~6 min with deployer RUNNING. The earlier "watchdog
# log lines = 0" check was INVALID (deployer was 7s old; the loop sleeps 60s
# before logging). The watchdog may still run from the BAKED image if the
# server.py bind-mount didn't take. Isolation PROVED stopping the deployer
# keeps the backend alive. So: inspect the running deployer's actual
# /app/server.py (is the bind-mount working?), then STOP the deployer to
# stabilize prod, recreate backend, watch 10 min.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-deployer-stabilize.yml'

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 14m
          script: |
            set +e

            echo "=== is the RUNNING deployer using the watchdog-free server.py? ==="
            echo "  (bind-mount check: grep the file INSIDE the container)"
            docker exec shitaleco-deployer-1 grep -c "Autonomous watchdog REMOVED" /app/server.py 2>&1 \
              | sed 's/^/  REMOVED-marker count (1 = bind-mount worked, 0 = baked image still running): /'
            docker exec shitaleco-deployer-1 grep -c "def _watchdog_loop" /app/server.py 2>&1 \
              | sed 's/^/  _watchdog_loop def count (0 = good, 1 = OLD code still running): /'
            echo "  deployer uptime + watchdog log (now it has run >60s):"
            docker ps --filter 'name=shitaleco-deployer-1' --format '{{.Status}}'
            docker logs shitaleco-deployer-1 2>&1 | grep -i watchdog | tail -5 || echo "    (no watchdog log lines)"

            echo ""
            echo "=== STOP the deployer (proven: backend survives when it's stopped) ==="
            docker stop shitaleco-deployer-1 2>&1
            docker ps -a --filter 'name=shitaleco-deployer-1' --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "=== recreate backend ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            docker rm -f shitaleco-backend-1 2>/dev/null
            for c in $(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_shitaleco-backend'); do docker rm -f "$c" 2>/dev/null; done
            sleep 2
            docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -5
            for i in $(seq 1 60); do
              sleep 5
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "  healthy after $((i*5))s"; break; }
            done

            echo ""
            echo "=== watch 10 min with deployer STOPPED — backend must stay (proven) ==="
            BASE=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
            BAD=0
            for i in $(seq 1 20); do
              sleep 30
              now=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null || echo ABSENT)
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ -z "$now" ] || [ "$now" = "ABSENT" ]; then
                echo "  [$((i*30))s] ⚠️ DELETED even with deployer stopped :8000=$c"; BAD=1
              elif [ "$now" != "$BASE" ]; then
                echo "  [$((i*30))s] ⚠️ recreated :8000=$c"; BAD=1; BASE="$now"
              else
                [ $((i % 4)) -eq 0 ] && echo "  [$((i*30))s] stable :8000=$c"
              fi
            done

            echo ""
            [ "$BAD" = "0" ] && echo "=== ✅ STABLE 10 min, deployer stopped — prod is UP and holding ===" \
                             || echo "=== still disturbed with deployer stopped — different cause ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
