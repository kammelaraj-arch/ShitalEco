name: Recover prod backend (post-promote failure)

# Promote-to-prod removed shitaleco-backend-1 and never restarted it.
# Bring it back from :latest (which was set by the kill-neuron workflow
# to point at fresh :dev). No image change here — just re-create the
# container.

on:
  push:
    branches: [claude/fix-access-payment-stability-Q40dj]
    paths:
      - '.github/workflows/recover-prod-backend.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            set +e
            cd /opt/shitaleco

            echo "=== Before ==="
            docker ps -a --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'

            # Free port 8000 if anything still holds it
            fuser -k 8000/tcp 2>/dev/null || true

            # Make sure :latest exists and is recent. If :dev is fresher we
            # retag :dev to :latest so the next `up -d` picks a known-good
            # image (the same one the dev stack is running stable on).
            docker pull ghcr.io/kammelaraj-arch/shitaleco-backend:dev || true
            DEV_SHA=$(docker inspect ghcr.io/kammelaraj-arch/shitaleco-backend:dev --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | awk -F= '/^GIT_SHA=/{print $2; exit}')
            LATEST_SHA=$(docker inspect ghcr.io/kammelaraj-arch/shitaleco-backend:latest --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | awk -F= '/^GIT_SHA=/{print $2; exit}')
            echo "Image SHAs: dev=$DEV_SHA  latest=$LATEST_SHA"

            if [ -z "$LATEST_SHA" ] && [ -n "$DEV_SHA" ]; then
              echo "  no :latest — tagging :dev as :latest"
              docker tag ghcr.io/kammelaraj-arch/shitaleco-backend:dev \
                         ghcr.io/kammelaraj-arch/shitaleco-backend:latest
            fi

            echo ""
            echo "=== Bring backend up (no deps) ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            UP_RC=$?
            echo "up -d exit=$UP_RC"

            echo ""
            echo "=== Wait for /health (up to 4 min) ==="
            for i in $(seq 1 48); do
              sleep 5
              c=$(curl -s -o /dev/null -w "%{http_code}" -m 5 http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$c" = "200" ]; then
                echo "Backend healthy after $((i*5))s"
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  attempt $i/48 ($((i*5))s) — still $c"
            done

            echo ""
            echo "=== Final state ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            curl -s -o /dev/null -w "external /health → %{http_code}\n" -m 5 http://localhost:8000/health

            echo ""
            echo "=== Last 30 backend log lines (so we see if anything new is wrong) ==="
            docker logs --tail 30 shitaleco-backend-1 2>&1
