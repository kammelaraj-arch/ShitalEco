name: Remove BOTH auto-healers permanently + confirm prod stable

# Per decision: delete BOTH autonomous recreators. They caused more outages
# than they prevented today by force-recreating / churning a HEALTHY backend.
# Docker's own `restart: unless-stopped` already restarts a genuinely-crashed
# container in place — that's the safe mechanism we keep.
#
# Removes:
#   1. host systemd shital-assert-state.timer + .service (stop/disable/delete)
#   2. any shital-*-watchdog crons (dev + prod)
#   3. assert-state.sh + watchdog-dev.sh scripts
# Keeps: DEPLOY_WATCHDOG=0 (deployer watchdog already off).
# Then ensures backend is up and watches 8 min — StartedAt constant proves
# NOTHING recreates it anymore.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-autohealers.yml'

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 12m
          script: |
            set +e

            echo "=== 1) systemd assert-state timer: stop, disable, DELETE ==="
            systemctl stop    shital-assert-state.timer   2>&1
            systemctl disable shital-assert-state.timer   2>&1
            systemctl stop    shital-assert-state.service 2>&1
            rm -f /etc/systemd/system/shital-assert-state.timer
            rm -f /etc/systemd/system/shital-assert-state.service
            systemctl daemon-reload
            rm -f /opt/shitaleco/infra/host/assert-state.sh
            echo "  timer present? $(systemctl list-unit-files 2>/dev/null | grep -c assert-state) (0 = gone)"

            echo ""
            echo "=== 2) remove ALL shital watchdog crons ==="
            crontab -l 2>/dev/null | grep -vE 'shital-dev-watchdog|shital-prod-watchdog|assert-state' | crontab - 2>/dev/null
            rm -f /opt/shitaleco-dev/infra/watchdog-dev.sh /opt/shitaleco/infra/watchdog-dev.sh 2>/dev/null
            echo "  remaining crontab:"
            crontab -l 2>/dev/null | grep -vE '^#|^$' || echo "    (empty)"

            echo ""
            echo "=== 3) confirm deployer watchdog OFF ==="
            docker exec shitaleco-deployer-1 sh -c 'echo DEPLOY_WATCHDOG=$DEPLOY_WATCHDOG' 2>&1 | head -1

            echo ""
            echo "=== 4) ensure backend up (one-time, manual) ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            state=$(docker inspect shitaleco-backend-1 --format '{{.State.Status}}' 2>/dev/null || echo absent)
            echo "  backend state: $state"
            if [ "$state" != "running" ]; then
              docker rm -f shitaleco-backend-1 2>/dev/null; sleep 2
              docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -5
              for i in $(seq 1 48); do
                sleep 5
                c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
                [ "$c" = "200" ] && { echo "  healthy after $((i*5))s"; break; }
              done
            fi

            echo ""
            echo "=== 5) watch 8 min — StartedAt constant = NOTHING recreates it ==="
            BASE=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
            echo "  baseline StartedAt=$BASE"
            RECREATED=0
            for i in $(seq 1 16); do
              sleep 30
              now=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ "$now" != "$BASE" ]; then
                echo "  [$((i*30))s] ⚠️ RECREATED ($BASE → $now) :8000=$c"
                RECREATED=1; BASE="$now"
              else
                [ $((i % 4)) -eq 0 ] && echo "  [$((i*30))s] stable :8000=$c"
              fi
            done

            echo ""
            if [ "$RECREATED" = "0" ]; then
              echo "=== ✅ 8 MIN, ZERO RECREATES — both auto-healers gone, crashloop dead ==="
            else
              echo "=== ⚠️ still recreated — a THIRD recreator exists (investigate) ==="
            fi
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
