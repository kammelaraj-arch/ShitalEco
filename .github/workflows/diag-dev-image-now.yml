name: Diagnose dev image identity NOW

# Find out exactly which build the running backend-dev is from, vs what's
# in GHCR. The workflow shows: image digest of running container, vs the
# digest GHCR says :dev points at, vs whether the code in the container
# has the refresh-from-paypal route.
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/diag-dev-image-now.yml

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set +e
            echo "=== Running backend-dev image digest ==="
            docker inspect shitaleco-dev-backend-dev-1 --format 'Image={{.Image}}  Created={{.Created}}  ImageRef={{.Config.Image}}'
            echo ""
            echo "=== Local :dev image digest ==="
            docker images --digests ghcr.io/kammelaraj-arch/shitaleco-backend --format 'Tag={{.Tag}}  Digest={{.Digest}}  Created={{.CreatedSince}}  ID={{.ID}}' | head -8
            echo ""
            echo "=== Code identity test — does the running container have refresh-from-paypal ? ==="
            docker exec shitaleco-dev-backend-dev-1 grep -c 'refresh-from-paypal' /app/shital/api/routers/recurring_giving.py 2>&1 \
              || echo "(grep failed — file may be elsewhere)"
            echo ""
            echo "--- alternative path if /app/shital lives elsewhere ---"
            docker exec shitaleco-dev-backend-dev-1 find / -name 'recurring_giving.py' -path '*shital*' 2>/dev/null | head -3
            docker exec shitaleco-dev-backend-dev-1 sh -c 'p=$(find / -name "recurring_giving.py" -path "*shital*" 2>/dev/null | head -1); echo "path=$p"; grep -c "refresh-from-paypal" "$p" 2>&1' 2>&1
            echo ""
            echo "=== Try pulling :dev again with no cache + force, see what changes ==="
            BEFORE=$(docker images --digests ghcr.io/kammelaraj-arch/shitaleco-backend:dev --format '{{.Digest}}' | head -1)
            echo "  digest BEFORE pull: $BEFORE"
            cd /opt/shitaleco-dev
            if [ -f .env.dev ]; then set -a; . .env.dev; set +a; fi
            [ -n "${GITHUB_TOKEN:-}" ] && echo "$GITHUB_TOKEN" | docker login ghcr.io -u kammelaraj-arch --password-stdin >/dev/null 2>&1
            docker pull ghcr.io/kammelaraj-arch/shitaleco-backend:dev 2>&1 | tail -8
            AFTER=$(docker images --digests ghcr.io/kammelaraj-arch/shitaleco-backend:dev --format '{{.Digest}}' | head -1)
            echo "  digest AFTER pull: $AFTER"
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "  → GHCR's :dev is the SAME as what we already have locally."
              echo "  → That means EITHER the CI didn't actually update :dev for the latest merge,"
              echo "    OR the running container WAS rebuilt but doesn't contain the new code."
            else
              echo "  → GHCR has a NEWER :dev than what we had. Force-recreating backend-dev now."
              docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --force-recreate backend-dev 2>&1 | tail -8
              sleep 25
              docker exec shitaleco-dev-backend-dev-1 sh -c 'p=$(find / -name "recurring_giving.py" -path "*shital*" 2>/dev/null | head -1); grep -c "refresh-from-paypal" "$p" 2>&1' 2>&1
            fi
