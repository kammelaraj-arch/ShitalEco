name: Build Kiosk Apps

on:
  push:
    branches: [claude/shital-erp-platform-iR2UF, claude/fix-access-payment-stability-Q40dj, main]
    paths:
      - 'apps/kiosk/**'
      - '.github/workflows/build-kiosk.yml'
  workflow_dispatch:

# `publish-android` needs to create/update releases — default GITHUB_TOKEN is
# read-only on push events from non-default branches.
permissions:
  contents: write

jobs:
  # ─── Windows x64 installer ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Windows installer
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "http://192.248.147.205:8000/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows
          path: apps/kiosk/dist-electron/*.exe
          if-no-files-found: warn

  # ─── Linux x64 (Ubuntu/Debian) ──────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        run: sudo apt-get install -y rpm fakeroot dpkg
      - name: Install pnpm deps
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Linux x64
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "http://192.248.147.205:8000/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm build
      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-linux-x64
          path: |
            apps/kiosk/dist-electron/*.deb
            apps/kiosk/dist-electron/*.AppImage
          if-no-files-found: warn

  # ─── Linux ARM64 (Raspberry Pi 4/5) ─────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install cross-compile tools
        run: sudo apt-get install -y rpm fakeroot dpkg
      - name: Install pnpm deps
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Linux ARM64 (Raspberry Pi)
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "http://192.248.147.205:8000/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm run build:electron:arm64
      - name: Upload Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-raspberry-pi
          path: |
            apps/kiosk/dist-electron/*.deb
            apps/kiosk/dist-electron/*.AppImage
          if-no-files-found: warn

  # ─── Android APK (via Capacitor) ────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        working-directory: apps/kiosk
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build web assets for Capacitor
        working-directory: apps/kiosk
        env:
          VITE_API_URL: "http://192.248.147.205/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm run build:web
      - name: Add Android platform (generates android/ project)
        working-directory: apps/kiosk
        run: npx cap add android
      - name: Sync web assets into Android project
        working-directory: apps/kiosk
        run: npx cap sync android --inline
      - name: Apply kiosk-mode overlay
        working-directory: apps/kiosk
        # Copies our MainActivity / boot receiver / device-admin receiver into
        # the generated Android project, then patches AndroidManifest.xml to
        # turn the plain Capacitor wrapper into a real single-app kiosk
        # (immersive, screen-always-on, lock-task on device-owner devices).
        run: |
          mkdir -p android/app/src/main/java/org/shital/kiosk
          mkdir -p android/app/src/main/res/xml
          cp android-kiosk-overlay/MainActivity.java              android/app/src/main/java/org/shital/kiosk/MainActivity.java
          cp android-kiosk-overlay/KioskDeviceAdminReceiver.java  android/app/src/main/java/org/shital/kiosk/KioskDeviceAdminReceiver.java
          cp android-kiosk-overlay/KioskBootReceiver.java         android/app/src/main/java/org/shital/kiosk/KioskBootReceiver.java
          cp android-kiosk-overlay/res/xml/device_admin.xml       android/app/src/main/res/xml/device_admin.xml
          python3 scripts/patch-manifest.py \
            --manifest android/app/src/main/AndroidManifest.xml \
            --snippet  android-kiosk-overlay/AndroidManifest.kiosk-snippet.xml
      - name: Set Gradle permissions
        working-directory: apps/kiosk/android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: apps/kiosk/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-android
          path: apps/kiosk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ─── Publish APK to a stable GitHub Release download URL ────────────────────
  # Maintains a rolling `kiosk-latest` tag/release so the APK is always at:
  #   https://github.com/kammelaraj-arch/ShitalEco/releases/download/kiosk-latest/shital-kiosk-latest.apk
  # No clicking through Actions runs — bookmark that URL on your phone and tap.
  publish-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kiosk-android
          path: ./out
      - name: Rename APK with commit SHA
        run: |
          mkdir -p release
          cp out/app-debug.apk release/shital-kiosk-latest.apk
          cp out/app-debug.apk "release/shital-kiosk-${GITHUB_SHA::7}.apk"
          ls -lh release/
      - name: Move kiosk-latest tag to this commit
        # `gh release create` would fail if the release already exists — delete
        # then recreate is the simplest cross-event-type pattern. Tag is
        # force-moved to the current SHA so anyone who clones can `git checkout
        # kiosk-latest` to reproduce exactly what's in the released APK.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete kiosk-latest --cleanup-tag --yes || true
          gh release create kiosk-latest \
            --title "Kiosk APK — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). Download \`shital-kiosk-latest.apk\` and install on the phone — see apps/kiosk/ANDROID_KIOSK.md for the locked-down provisioning steps." \
            --target "$GITHUB_SHA" \
            release/shital-kiosk-latest.apk \
            "release/shital-kiosk-${GITHUB_SHA::7}.apk"
      - name: Print download URL
        run: |
          echo ""
          echo "📲  APK download URL (stable):"
          echo "    https://github.com/${{ github.repository }}/releases/download/kiosk-latest/shital-kiosk-latest.apk"
          echo ""
