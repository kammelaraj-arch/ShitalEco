name: Build Kiosk Apps

on:
  push:
    branches: [claude/shital-erp-platform-iR2UF, claude/fix-access-payment-stability-Q40dj, main]
    paths:
      - 'apps/kiosk/**'
      - 'apps/quick-donation/**'
      - '.github/workflows/build-kiosk.yml'
  workflow_dispatch:

# `publish-android` needs to create/update releases — default GITHUB_TOKEN is
# read-only on push events from non-default branches.
permissions:
  contents: write

jobs:
  # ─── Windows x64 installer ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Windows installer
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "https://shital.org.uk/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm build
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows
          path: apps/kiosk/dist-electron/*.exe
          if-no-files-found: warn

  # ─── Linux x64 (Ubuntu/Debian) ──────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        run: sudo apt-get install -y rpm fakeroot dpkg
      - name: Install pnpm deps
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Linux x64
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "https://shital.org.uk/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm build
      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-linux-x64
          path: |
            apps/kiosk/dist-electron/*.deb
            apps/kiosk/dist-electron/*.AppImage
          if-no-files-found: warn

  # ─── Linux ARM64 (Raspberry Pi 4/5) ─────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install cross-compile tools
        run: sudo apt-get install -y rpm fakeroot dpkg
      - name: Install pnpm deps
        working-directory: apps/kiosk
        run: pnpm install --no-frozen-lockfile
      - name: Build Linux ARM64 (Raspberry Pi)
        working-directory: apps/kiosk
        env:
          VITE_ELECTRON: "true"
          VITE_API_URL: "https://shital.org.uk/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm run build:electron:arm64
      - name: Upload Pi artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-raspberry-pi
          path: |
            apps/kiosk/dist-electron/*.deb
            apps/kiosk/dist-electron/*.AppImage
          if-no-files-found: warn

  # ─── Android APK (via Capacitor) ────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        working-directory: apps/kiosk
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build web assets for Capacitor
        working-directory: apps/kiosk
        env:
          VITE_API_URL: "https://shital.org.uk/api/v1"
          VITE_BRANCH_ID: "main"
        run: pnpm run build:web
      - name: Add Android platform (generates android/ project)
        working-directory: apps/kiosk
        env:
          # Build a thin loader APK that points the WebView at the live web
          # kiosk — installed app stays in sync with shital.org.uk/kiosk/ on
          # every web deploy, no APK rebuild / reinstall needed.
          KIOSK_LIVE_URL: "https://shital.org.uk/kiosk/"
        run: npx cap add android
      - name: Sync web assets into Android project
        working-directory: apps/kiosk
        env:
          KIOSK_LIVE_URL: "https://shital.org.uk/kiosk/"
        run: npx cap sync android --inline
      - name: Apply kiosk-mode overlay
        working-directory: apps/kiosk
        # Copies our MainActivity / boot receiver / device-admin receiver into
        # the generated Android project, then patches AndroidManifest.xml to
        # turn the plain Capacitor wrapper into a real single-app kiosk
        # (immersive, screen-always-on, lock-task on device-owner devices).
        run: |
          mkdir -p android/app/src/main/java/org/shital/kiosk
          mkdir -p android/app/src/main/res/xml
          cp android-kiosk-overlay/MainActivity.java              android/app/src/main/java/org/shital/kiosk/MainActivity.java
          cp android-kiosk-overlay/KioskDeviceAdminReceiver.java  android/app/src/main/java/org/shital/kiosk/KioskDeviceAdminReceiver.java
          cp android-kiosk-overlay/KioskBootReceiver.java         android/app/src/main/java/org/shital/kiosk/KioskBootReceiver.java
          cp android-kiosk-overlay/res/xml/device_admin.xml       android/app/src/main/res/xml/device_admin.xml
          python3 scripts/patch-manifest.py \
            --manifest android/app/src/main/AndroidManifest.xml \
            --snippet  android-kiosk-overlay/AndroidManifest.kiosk-snippet.xml
      - name: Set Gradle permissions
        working-directory: apps/kiosk/android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: apps/kiosk/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-android
          path: apps/kiosk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ─── Quick Donation Android APK (devotee phone — Capacitor wrapper) ─────────
  # Same Capacitor pattern as the Kiosk app, but the SPA is the Quick Donation
  # web app (donate.shital.org.uk). Devotees download this APK from the
  # Software Downloads page and install on their own phones; the app shows
  # the donation form with Google Pay support.
  build-quick-donation-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install pnpm
        run: npm install -g pnpm@9.4.0
      - name: Install dependencies
        working-directory: apps/quick-donation
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build web assets for Capacitor
        working-directory: apps/quick-donation
        env:
          VITE_API_URL: "https://shital.org.uk/api/v1"
          # Live-load the SPA from the production donate URL so the APK
          # stays in sync with web deploys without re-flashing.
          QD_LIVE_URL: "https://donate.shital.org.uk/donate/"
        run: pnpm run build:web
      - name: Add Android platform
        working-directory: apps/quick-donation
        env:
          QD_LIVE_URL: "https://donate.shital.org.uk/donate/"
        run: npx cap add android
      - name: Sync web assets into Android project
        working-directory: apps/quick-donation
        env:
          QD_LIVE_URL: "https://donate.shital.org.uk/donate/"
        run: npx cap sync android --inline
      - name: Set Gradle permissions
        working-directory: apps/quick-donation/android
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: apps/quick-donation/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Quick Donation APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-donation-android
          path: apps/quick-donation/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ─── Publish ALL installers to a stable GitHub Release ─────────────────────
  # Maintains a rolling `kiosk-latest` tag/release with consistent filenames:
  #   shital-kiosk-windows-setup.exe       (Windows x64 NSIS installer)
  #   shital-kiosk-linux-x64.AppImage      (portable Linux x64)
  #   shital-kiosk-linux-x64.deb           (Debian / Ubuntu package)
  #   shital-kiosk-raspberry-pi.deb        (Raspberry Pi 4/5 ARM64)
  #   shital-kiosk-latest.apk              (Android — sideload)
  #
  # Stable download URLs (bookmark these — re-download to update):
  #   https://github.com/kammelaraj-arch/ShitalEco/releases/download/kiosk-latest/<filename>
  #
  # The admin Software Downloads page links directly to these.
  publish-installers:
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-android, build-quick-donation-android]
    if: ${{ always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux-x64.result == 'success' || needs.build-linux-arm64.result == 'success' || needs.build-quick-donation-android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Normalise to stable filenames
        # Each build job uploads with a different file extension. Rename to
        # the stable names listed above so the Downloads page can link to
        # them by predictable URL. If a build job didn't run, its artifact
        # dir is absent and we skip — previous release asset stays.
        run: |
          set -e
          mkdir -p release
          ls -R artifacts/ || true
          if compgen -G "artifacts/kiosk-windows/*.exe" > /dev/null; then
            cp "$(ls artifacts/kiosk-windows/*.exe | head -1)" release/shital-kiosk-windows-setup.exe
            echo "✓ Windows installer"
          fi
          if compgen -G "artifacts/kiosk-linux-x64/*.AppImage" > /dev/null; then
            cp "$(ls artifacts/kiosk-linux-x64/*.AppImage | head -1)" release/shital-kiosk-linux-x64.AppImage
            echo "✓ Linux x64 AppImage"
          fi
          if compgen -G "artifacts/kiosk-linux-x64/*.deb" > /dev/null; then
            cp "$(ls artifacts/kiosk-linux-x64/*.deb | head -1)" release/shital-kiosk-linux-x64.deb
            echo "✓ Linux x64 .deb"
          fi
          if compgen -G "artifacts/kiosk-raspberry-pi/*.deb" > /dev/null; then
            cp "$(ls artifacts/kiosk-raspberry-pi/*.deb | head -1)" release/shital-kiosk-raspberry-pi.deb
            echo "✓ Raspberry Pi .deb"
          fi
          if [ -f artifacts/kiosk-android/app-debug.apk ]; then
            cp artifacts/kiosk-android/app-debug.apk release/shital-kiosk-latest.apk
            cp artifacts/kiosk-android/app-debug.apk "release/shital-kiosk-${GITHUB_SHA::7}.apk"
            echo "✓ Kiosk Android APK"
          fi
          if [ -f artifacts/quick-donation-android/app-debug.apk ]; then
            cp artifacts/quick-donation-android/app-debug.apk release/shital-quick-donation-latest.apk
            cp artifacts/quick-donation-android/app-debug.apk "release/shital-quick-donation-${GITHUB_SHA::7}.apk"
            echo "✓ Quick Donation Android APK"
          fi
          ls -lh release/
      - name: Move kiosk-latest tag and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(ls -A release/ 2>/dev/null)" ]; then
            echo "No installers to publish (all build jobs skipped)"
            exit 0
          fi
          gh release delete kiosk-latest --cleanup-tag --yes || true
          gh release create kiosk-latest \
            --title "Kiosk installers — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')." \
            --target "$GITHUB_SHA" \
            release/*
      - name: Print download URLs
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/kiosk-latest"
          echo ""
          echo "📦  Stable download URLs:"
          for f in release/*; do
            [ -f "$f" ] && echo "    ${BASE}/$(basename "$f")"
          done
