name: Recover dev now (one-shot + log dump)

# Brings the dev stack back up AND dumps backend logs so we can find out
# why it keeps crashing post-deploy. Auto-fires on push to this branch.
#
# Pure recovery: docker compose up -d on dev stack. No rebuild, no migration
# changes. The deploy-dev.yml workflow already succeeded on the latest merge
# (ce22246) but dev backend died shortly after — most likely an OOM or a
# crash on a specific code path that didn't fire during the health gate.
# The log dump tells us which.
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/recover-dev-now.yml

jobs:
  recover-dev:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and diagnose + recover dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set +e
            echo "=========================================="
            echo "=== HOST STATE ==="
            echo "=========================================="
            free -h
            uptime
            echo ""
            echo "=== top 8 RSS consumers ==="
            ps -eo pid,rss,comm --sort=-rss 2>/dev/null | head -9

            echo ""
            echo "=========================================="
            echo "=== DEV CONTAINER STATE (before) ==="
            echo "=========================================="
            docker ps -a --filter 'name=shitaleco-dev-' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "=========================================="
            echo "=== BACKEND-DEV LAST 80 LOG LINES (why did it die?) ==="
            echo "=========================================="
            docker logs --tail 80 shitaleco-dev-backend-dev-1 2>&1 | tail -80 || echo "(backend-dev container not found)"

            echo ""
            echo "=========================================="
            echo "=== BACKEND-DEV CRASH/RESTART HISTORY ==="
            echo "=========================================="
            docker inspect shitaleco-dev-backend-dev-1 --format '{{json .State}}' 2>/dev/null | jq '. | {Status, ExitCode, OOMKilled, StartedAt, FinishedAt, RestartCount, Error}' 2>/dev/null \
              || docker inspect shitaleco-dev-backend-dev-1 --format 'Status={{.State.Status}} Exit={{.State.ExitCode}} OOM={{.State.OOMKilled}} Restarts={{.RestartCount}} Error={{.State.Error}}' 2>/dev/null \
              || echo "(no inspect data)"

            echo ""
            echo "=========================================="
            echo "=== BRING DEV STACK UP — PULL LATEST :dev FIRST, then force-recreate ==="
            echo "=========================================="
            cd /opt/shitaleco-dev
            if [ ! -f docker-compose.dev.yml ]; then
              echo "!!! /opt/shitaleco-dev/docker-compose.dev.yml missing — cannot recover via this path"
              ls -la /opt/shitaleco-dev 2>/dev/null | head -10
              exit 2
            fi
            # GHCR login (GH_PAT comes from .env.dev) so the pull below works
            if [ -f .env.dev ]; then set -a; . .env.dev; set +a; fi
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u kammelaraj-arch --password-stdin 2>/dev/null && echo "  ✓ GHCR login" || echo "  ! GHCR login failed"
            fi
            echo "=== Pulling latest :dev images ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev pull 2>&1 | tail -15
            echo ""
            echo "=== Force-recreating backend-dev so the NEW :dev is used (not the cached one) ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --force-recreate backend-dev 2>&1 | tail -10
            echo "=== Up the rest (nginx, frontends) without force-recreate ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d 2>&1 | tail -10

            echo ""
            echo "=========================================="
            echo "=== WAIT UP TO 3 MIN FOR backend-dev /health = 200 ==="
            echo "=========================================="
            OK=0
            for i in $(seq 1 36); do
              sleep 5
              c=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8001/health 2>/dev/null || echo 000)
              if [ "$c" = "200" ]; then
                echo "OK — backend-dev healthy after $((i*5))s"
                OK=1; break
              fi
              [ $((i % 6)) -eq 0 ] && echo "  attempt $i/36 (${i}*5s) → $c"
            done

            echo ""
            echo "=========================================="
            echo "=== FINAL STATE ==="
            echo "=========================================="
            docker ps --filter 'name=shitaleco-dev-' --format 'table {{.Names}}\t{{.Status}}'
            echo ""
            echo "external dev.shital.org.uk:"
            curl -sk -o /dev/null -w "  /        → %{http_code}\n" -m 8 https://dev.shital.org.uk/
            curl -sk -o /dev/null -w "  /health  → %{http_code}\n" -m 8 https://dev.shital.org.uk/health

            if [ "$OK" != "1" ]; then
              echo ""
              echo "!!! Backend-dev STILL not healthy — dumping new log after the up -d:"
              docker logs --tail 100 shitaleco-dev-backend-dev-1 2>&1 | tail -100 || true
              exit 4
            fi
            echo ""
            echo "=== Recovery complete ==="
