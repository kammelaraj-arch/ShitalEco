name: Install prod durable fix (assertion service)

# ONE durable fix to replace seven scattered recovery workflows:
#   1. Purge any current workspace-* zombie
#   2. Bring shitaleco-backend-1 up
#   3. Install /opt/shitaleco/infra/host/assert-state.sh
#   4. Install + enable shital-assert-state.{service,timer} on the host
#      → runs every 60s, evicts workspace-* zombies, ensures
#        shitaleco-backend-1 is the only port-8000 owner
#
# Idempotent — safe to re-run any time. After this lands, prod should
# self-recover from the workspace-backend-1 zombie pattern without any
# human intervention.
#
# 14:18 — promote-to-prod took prod down (503 upstream connect refused).
# Re-triggering this workflow to recover + apply latest fixes.
# 14:55 — backend down AGAIN (502, even with -p shitaleco fix on disk).
# Recovery + investigation needed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-prod-durable-fix.yml'
      - 'infra/host/assert-state.sh'
      - 'infra/host/shital-assert-state.service'
      - 'infra/host/shital-assert-state.timer'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: scp host scripts + new compose + deploy.sh to prod
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          source: "infra/host/assert-state.sh,infra/host/shital-assert-state.service,infra/host/shital-assert-state.timer,deployer/deploy.sh,docker-compose.prod.yml"
          target: "/opt/shitaleco/"
          overwrite: true

      - name: Teardown workspace project + install systemd unit + bring up shitaleco
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 8m
          script: |
            set +e

            echo "=== ROOT-CAUSE FIX: tear down the 'workspace' compose project ==="
            # The deployer container ran 'docker compose' from /workspace
            # without -p, producing project name 'workspace' and container
            # names workspace-backend-1, etc. — racing shitaleco-backend-1
            # for port 8000. Pinning the project name fixes future deploys;
            # this teardown evicts the existing workspace-* set.
            cd /opt/shitaleco
            docker compose -p workspace -f docker-compose.prod.yml down --remove-orphans --volumes=false 2>&1 | tail -20
            for c in $(docker ps -a --filter 'name=^workspace-' --format '{{.Names}}'); do
              docker rm -f "$c" 2>/dev/null && echo "  removed $c" || true
            done

            echo ""
            echo "=== Verify nothing on port 8000 ==="
            ss -ltnp 2>/dev/null | grep ':8000 ' || echo "  ✓ port 8000 free"

            echo ""
            echo "=== Why didn't the timer save us? ==="
            systemctl is-enabled shital-assert-state.timer 2>&1
            systemctl is-active  shital-assert-state.timer 2>&1
            systemctl list-timers shital-assert-state.timer --no-pager 2>&1
            echo "--- assert-state.log last 30 lines ---"
            tail -30 /var/log/shital-assert-state.log 2>/dev/null || echo "  no log"
            echo "--- recent service runs (journalctl) ---"
            journalctl -u shital-assert-state.service --since '15 min ago' --no-pager 2>&1 | tail -30

            echo ""
            echo "=== Make assert-state.sh executable ==="
            chmod +x /opt/shitaleco/infra/host/assert-state.sh
            ls -la /opt/shitaleco/infra/host/

            echo ""
            echo "=== Install systemd unit + timer ==="
            cp /opt/shitaleco/infra/host/shital-assert-state.service /etc/systemd/system/shital-assert-state.service
            cp /opt/shitaleco/infra/host/shital-assert-state.timer   /etc/systemd/system/shital-assert-state.timer
            systemctl daemon-reload
            systemctl enable --now shital-assert-state.timer
            systemctl status shital-assert-state.timer --no-pager --lines=3

            echo ""
            echo "=== Run assert-state.sh once now to bring prod back ==="
            /opt/shitaleco/infra/host/assert-state.sh
            echo "--- assert-state.log tail ---"
            tail -20 /var/log/shital-assert-state.log 2>/dev/null || echo "(no log yet)"

            echo ""
            echo "=== Bring up ALL prod services (idempotent — nothing happens if already running) ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            timeout 120 docker compose -p shitaleco -f docker-compose.prod.yml up -d 2>&1 | tail -30

            echo ""
            echo "=== Wait /health (3 min) ==="
            for i in $(seq 1 36); do
              sleep 5
              c=$(timeout 5 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "OK after $((i*5))s"; break; }
              [ $((i % 6)) -eq 0 ] && echo "  $((i*5))s — $c"
            done

            echo ""
            echo "=== Final state ==="
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host /health → %{http_code}\n" -m 5 http://localhost:8000/health
            echo ""
            echo "Timer next runs:"
            systemctl list-timers shital-assert-state.timer --no-pager
