name: Check promote state (READ-ONLY)

# Prod returning 503 on ALL routes for ~6 min. Need to know: is a promote
# (deploy.sh) running, is backend mid-recreate, is nginx healthy, did the
# watchdog return? READ-ONLY — no docker mutations.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-promote-state.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 3m
          script: |
            set +e
            echo "=== container roster (all prod) ==="
            docker ps -a --filter 'name=shitaleco-' --format 'table {{.Names}}\t{{.Status}}' | grep -v dev

            echo ""
            echo "=== is deploy.sh / a promote running inside deployer? ==="
            docker exec shitaleco-deployer-1 sh -c 'ps aux 2>/dev/null | grep -E "deploy.sh|docker compose|alembic|promote" | grep -v grep' 2>&1 | head -15 || echo "  (no deployer exec / not running)"

            echo ""
            echo "=== deployer recent logs (promote activity / watchdog) ==="
            docker logs --tail 30 shitaleco-deployer-1 2>&1 | tail -30

            echo ""
            echo "=== backend state + uptime (recreated? cold-starting?) ==="
            docker inspect shitaleco-backend-1 --format 'Status={{.State.Status}}/{{.State.Health.Status}} Started={{.State.StartedAt}} Image={{.Config.Image}}' 2>&1

            echo ""
            echo "=== backend last 25 log lines (cold start progress) ==="
            docker logs --tail 25 shitaleco-backend-1 2>&1 | tail -25

            echo ""
            echo "=== nginx state + is it the one returning 503? ==="
            docker inspect shitaleco-nginx-1 --format 'Status={{.State.Status}} Started={{.State.StartedAt}}' 2>&1
            docker exec shitaleco-nginx-1 sh -c 'curl -s -o /dev/null -w "nginx→backend:8000 = %{http_code}\n" -m 4 http://backend:8000/health' 2>&1 || echo "  nginx exec failed"

            echo ""
            echo "=== deploy-history last 3 entries ==="
            tail -3 /opt/shitaleco/backups/deploy-history.jsonl 2>/dev/null || echo "  none"

            echo ""
            echo "=== is the deployer watchdog OFF? ==="
            docker exec shitaleco-deployer-1 sh -c 'echo DEPLOY_WATCHDOG=$DEPLOY_WATCHDOG' 2>&1 | head -1
            docker logs --tail 50 shitaleco-deployer-1 2>&1 | grep -i watchdog | tail -5 || echo "  (no watchdog log lines — good)"
