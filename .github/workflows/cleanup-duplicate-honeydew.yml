# ONE-OFF — delete duplicate honeydew-everyone-then reader row
# Confirmed by earlier diag: the duplicate (2f298816-…) is unreferenced
# by any kiosk_devices. The live row (b567471e-…) is used by "On Main Hundi".
name: Delete duplicate honeydew row
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/cleanup-duplicate-honeydew.yml

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 60s
          script: |
            set +e
            cd /opt/shitaleco
            set -a; . .env; set +a

            DUP_ID='2f298816-ade7-4d7c-9813-7805df1a30d1'

            echo "=== Pre-check: confirm row is unreferenced ==="
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "
                SELECT COUNT(*) AS kiosks_using_dup
                FROM kiosk_devices
                WHERE card_reader_id = '${DUP_ID}';
              " 2>&1 | head -10

            echo ""
            echo "=== DELETE the duplicate ==="
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "
                DELETE FROM terminal_devices
                WHERE id = '${DUP_ID}'
                  AND label = 'honeydew-everyone-then'
                  AND status = 'offline'
                RETURNING id, label, status;
              " 2>&1 | head -10

            echo ""
            echo "=== Post-check: only one honeydew row left ==="
            docker compose -p shitaleco -f docker-compose.prod.yml exec -T \
              -e PGPASSWORD="${POSTGRES_PASSWORD}" db \
              psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -c "
                SELECT id, label, status, branch_id
                FROM terminal_devices
                WHERE label = 'honeydew-everyone-then';
              " 2>&1 | head -10
