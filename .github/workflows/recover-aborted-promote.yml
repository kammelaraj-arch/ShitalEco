name: Recover aborted promote (start stuck frontends)

# The 18:42 promote aborted mid-run: deploy.sh recreated the deployer
# container (config changed: DEPLOY_WATCHDOG=0) and thereby KILLED ITSELF,
# leaving nginx/service/kiosk/deployer/backup-cron stuck in Created/Exited.
# Backend is healthy. Site is down only because nginx is down.
#
# Fix: remove the auto-renamed zombie containers blocking the real names,
# then `compose up -d` the whole prod stack to start the stuck frontends.
# Backend is already healthy so this is quick and low-risk.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-aborted-promote.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 8m
          script: |
            set +e
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a

            echo "=== before ==="
            docker ps -a --filter 'name=shitaleco-' --format 'table {{.Names}}\t{{.Status}}' | grep -v dev

            echo ""
            echo "=== remove auto-renamed zombie containers (hex_ prefix) blocking real names ==="
            for c in $(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_shitaleco-' ); do
              echo "  rm $c"
              docker rm -f "$c" 2>/dev/null
            done
            # also remove any Exited prod frontend so compose recreates cleanly
            for svc in nginx service kiosk backup-cron certbot; do
              st=$(docker inspect "shitaleco-${svc}-1" --format '{{.State.Status}}' 2>/dev/null || echo absent)
              [ "$svc" = "backup-cron" ] && cname="shitaleco-backup-cron" || cname="shitaleco-${svc}-1"
              st=$(docker inspect "$cname" --format '{{.State.Status}}' 2>/dev/null || echo absent)
              if [ "$st" = "exited" ] || [ "$st" = "created" ]; then
                echo "  rm $cname ($st)"
                docker rm -f "$cname" 2>/dev/null
              fi
            done

            echo ""
            echo "=== compose up -d the full prod stack (backend already healthy, no-op for it) ==="
            docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d 2>&1 | tail -25

            echo ""
            echo "=== verify deployer watchdog is OFF ==="
            sleep 3
            docker exec shitaleco-deployer-1 sh -c 'echo DEPLOY_WATCHDOG=$DEPLOY_WATCHDOG' 2>&1 | head -1

            echo ""
            echo "=== wait for nginx + backend reachable (2 min) ==="
            for i in $(seq 1 24); do
              sleep 5
              h=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              n=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:80/health 2>/dev/null || echo "000")
              echo "  [$((i*5))s] backend:8000=$h  nginx:80=$n"
              [ "$h" = "200" ] && [ "$n" = "200" -o "$n" = "301" ] && { echo "  ✓ both up"; break; }
            done

            echo ""
            echo "=== final roster ==="
            docker ps --filter 'name=shitaleco-' --format 'table {{.Names}}\t{{.Status}}' | grep -v dev
