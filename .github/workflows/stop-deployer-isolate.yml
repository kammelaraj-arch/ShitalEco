name: Stop deployer entirely + isolate the backend deleter

# Backend is being DELETED (docker rm) every ~6 min, compose v5.1.3 = the
# deployer container. Watchdog flag is off but it's STILL happening, so:
# fully STOP the deployer container (it physically can't touch docker.sock
# when stopped), enumerate ALL containers that mount docker.sock, recreate
# the backend, and watch 8 min. If backend survives with deployer stopped,
# the deployer is the deleter. If it STILL dies, the culprit is one of the
# other docker.sock holders (or host-level) — which we'll have listed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-deployer-isolate.yml'

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 13m
          script: |
            set +e

            echo "=== ALL containers mounting /var/run/docker.sock (potential deleters) ==="
            for cid in $(docker ps -q); do
              name=$(docker inspect "$cid" --format '{{.Name}}' 2>/dev/null | sed 's|^/||')
              mounts=$(docker inspect "$cid" --format '{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}' 2>/dev/null | grep -c 'docker.sock')
              [ "$mounts" -gt 0 ] && echo "  $name  (image: $(docker inspect "$cid" --format '{{.Config.Image}}'))"
            done

            echo ""
            echo "=== STOP the deployer container entirely ==="
            docker stop shitaleco-deployer-1 2>&1
            docker ps -a --filter 'name=shitaleco-deployer-1' --format 'table {{.Names}}\t{{.Status}}'

            echo ""
            echo "=== Also confirm NO stale/duplicate deployer is running ==="
            docker ps --filter 'name=deployer' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            echo ""
            echo "=== Recreate backend (deployer is now stopped, can't delete it) ==="
            cd /opt/shitaleco
            set -a; [ -f .env ] && . .env; set +a
            docker rm -f shitaleco-backend-1 2>/dev/null; sleep 2
            docker compose -p shitaleco --env-file .env -f docker-compose.prod.yml up -d --no-deps backend 2>&1 | tail -5
            for i in $(seq 1 48); do
              sleep 5
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              [ "$c" = "200" ] && { echo "  healthy after $((i*5))s"; break; }
            done

            echo ""
            echo "=== Watch 8 min with deployer STOPPED — does backend survive? ==="
            BASE=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null)
            echo "  baseline=$BASE"
            GONE=0
            for i in $(seq 1 16); do
              sleep 30
              now=$(docker inspect shitaleco-backend-1 --format '{{.State.StartedAt}}' 2>/dev/null || echo "ABSENT")
              c=$(timeout 4 curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
              if [ -z "$now" ] || [ "$now" = "ABSENT" ]; then
                echo "  [$((i*30))s] ⚠️⚠️ backend DELETED while deployer stopped — NOT the deployer! :8000=$c"
                echo "    docker events last 60s:"
                docker events --since 60s --until 0s 2>&1 | grep -E 'destroy|kill|die' | grep -i backend | tail -5
                GONE=1
              elif [ "$now" != "$BASE" ]; then
                echo "  [$((i*30))s] recreated ($BASE → $now) :8000=$c"; BASE="$now"
              else
                [ $((i % 4)) -eq 0 ] && echo "  [$((i*30))s] stable :8000=$c"
              fi
            done

            echo ""
            if [ "$GONE" = "0" ]; then
              echo "=== ✅ BACKEND SURVIVED 8 MIN with deployer stopped — THE DEPLOYER WAS THE DELETER ==="
            else
              echo "=== ⚠️ backend deleted even with deployer stopped — culprit is another docker.sock holder above ==="
            fi
            docker ps --filter 'name=shitaleco-backend-1' --format 'table {{.Names}}\t{{.Status}}'
            curl -s -o /dev/null -w "host :8000 → %{http_code}\n" -m 5 http://localhost:8000/health
