# READ-ONLY round 3 — bash reproduction inside deployer container
name: Read pg_dump round 3 (READ-ONLY)
on:
  push:
    branches:
      - claude/recover-prod-now-Q40dj
    paths:
      - .github/workflows/read-pg-dump-errors.yml

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.248.147.205
          username: root
          password: ${{ secrets.VULTR_ROOT_PASSWORD }}
          port: 22
          command_timeout: 120s
          script: |
            set +e
            echo "=== deployer container — bash + git availability ==="
            docker exec shitaleco-deployer-1 sh -c 'which bash; bash --version 2>&1 | head -1; which git; ls -la /workspace/.git 2>&1 | head -3' 2>&1

            echo ""
            echo "=== git rev-parse HEAD inside deployer ==="
            docker exec shitaleco-deployer-1 sh -c 'cd /workspace && git rev-parse HEAD 2>&1' 2>&1

            echo ""
            echo "=== EXACT take_snapshot reproduction via bash -c (PIPESTATUS works) ==="
            docker exec shitaleco-deployer-1 bash -c '
              set +e
              if [ -f /workspace/.env ]; then set -a; . /workspace/.env; set +a; fi
              cd /workspace
              GIT_SHA=$(git rev-parse HEAD 2>&1)
              echo "GIT_SHA=[$GIT_SHA]"
              SNAP_DIR=/workspace/backups
              ts=$(date -u +%Y%m%dT%H%M%SZ)
              out="${SNAP_DIR}/diag3-${ts}-${GIT_SHA:0:7}.sql.gz"
              err="${SNAP_DIR}/diag3-${ts}-pg_dump.log"
              echo "out=$out"
              echo "err=$err"
              docker compose -p shitaleco -f /workspace/docker-compose.prod.yml exec -T \
                   -e PGPASSWORD="${POSTGRES_PASSWORD:-}" db \
                   pg_dump -U "${POSTGRES_USER:-shitaleco_db_user}" \
                           -d "${POSTGRES_DB:-shitaleco_db}" \
                   2>"$err" | gzip > "$out"
              pg_rc=${PIPESTATUS[0]}
              gz_rc=${PIPESTATUS[1]}
              echo "pg_rc=$pg_rc  gz_rc=$gz_rc"
              ls -la "$out" "$err" 2>&1
              echo "--- success-branch test ---"
              if [ "$pg_rc" -eq 0 ] && [ "$gz_rc" -eq 0 ] && [ -s "$out" ]; then
                echo "✓ would take success branch (size: $(du -h "$out" | cut -f1))"
                # clean up diag files so we do not pollute
                rm -f "$out" "$err"
              else
                echo "✗ would take FAIL branch — pg_rc=$pg_rc gz_rc=$gz_rc out_size=$(stat -c%s "$out" 2>/dev/null || echo MISSING)"
                cat "$err" 2>&1
                rm -f "$out" "$err"
              fi
            ' 2>&1 | tail -30

            echo ""
            echo "=== deployer log around tonight\047s promote (snapshot lines) ==="
            docker logs shitaleco-deployer-1 --since 1h 2>&1 | grep -E 'snapshot|pg_dump|DB dump|✓|✗' | tail -25
