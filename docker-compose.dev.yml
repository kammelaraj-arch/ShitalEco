name: shitaleco-dev

# ── Dev stack — same server, isolated from production ─────────────────────────
# Dev nginx: port 8080 (HTTP only — no SSL needed for dev)
# Dev backend: port 8001 exposed for direct debugging
# All data in separate named volumes (pgdata-dev) — never touches prod DB
# Memory limits prevent dev stack from starving the prod stack on a 2GB VPS

services:
  db-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      POSTGRES_DB: shitaleco_dev_db
      POSTGRES_USER: shitaleco_dev_user
      POSTGRES_PASSWORD: ShitalEcoDev2024!
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shitaleco_dev_user -d shitaleco_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-internal

  backend-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-backend:dev
    # on-failure: stop crashing indefinitely rather than consuming CPU in a loop
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://shitaleco_dev_user:ShitalEcoDev2024!@db-dev:5432/shitaleco_dev_db
      APP_ENV: development
      # Required secrets. No silent fallbacks — if any is missing, `docker
      # compose up` fails fast with a clear error naming the variable, instead
      # of the dev stack quietly running with a placeholder that breaks later
      # (e.g. DEPLOY_SECRET mismatch → deployer 403, GITHUB_TOKEN empty →
      #  pull from private GHCR fails). The deploy-dev.yml workflow injects
      # all of these into .env.dev before bringing the stack up.
      JWT_SECRET:             ${JWT_SECRET:?must be set in .env.dev}
      DEPLOY_SECRET:          ${DEPLOY_SECRET:?must be set in .env.dev — same value as the prod deployer}
      GITHUB_TOKEN:           ${GITHUB_TOKEN:?must be set in .env.dev — needed to pull private GHCR images}
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS:           https://dev.shital.org.uk,http://192.248.147.205:8080,http://localhost:8080
      SENDGRID_API_KEY:       ${SENDGRID_API_KEY:-}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      MS_CLIENT_ID:           ${MS_CLIENT_ID:-}
      MS_TENANT_ID:           ${MS_TENANT_ID:-}
      MS_CLIENT_SECRET:       ${MS_CLIENT_SECRET:-}
      # Dev re-uses the same Azure AD app registration as prod — host's
      # .env supplies MS_CLIENT_ID / MS_TENANT_ID, and both
      # https://dev.shital.org.uk/admin/auth-callback/ and the prod URL
      # must both be registered in the Azure portal.
      # Path includes the /admin basePath; trailing slash matches Next.js
      # trailingSlash:true so Azure exact-match accepts it.
      MS_REDIRECT_URI:        ${MS_REDIRECT_URI_DEV:-https://dev.shital.org.uk/admin/auth-callback/}
      DEPLOYER_URL:           ${DEPLOYER_URL:-http://deployer:9000}
      # Mail agent — comma-separated list of mailboxes the poller pulls.
      # MODE "auto" picks rules-based extractor when ANTHROPIC_API_KEY
      # is empty, Claude agentic loop when it isn't.
      MAIL_AGENT_MAILBOXES:   ${MAIL_AGENT_MAILBOXES:-accounts@shirdisai.org.uk,gtrustees@shirdisai.org.uk}
      MAIL_AGENT_MODE:        ${MAIL_AGENT_MODE:-auto}
    volumes:
      - /opt/shitaleco-dev/media:/app/media
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      dev-internal:
        # screen-dev image hard-codes proxy_pass http://backend:8000 (works in
        # the prod stack where the service is literally named "backend"). Alias
        # backend-dev as "backend" on the dev network so screen-dev can resolve it.
        aliases:
          - backend
      # Second NIC on the prod stack's network so we can reach the deployer
      # container at http://deployer:9000 (deployer lives in the prod compose).
      prod-bridge: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  admin-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-admin:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      NODE_ENV: production
    depends_on:
      - backend-dev
    networks:
      - dev-internal
    # Bulletproof self-recovery: without a healthcheck, docker's
    # restart:unless-stopped can't tell when nginx inside the container
    # is wedged (only when the process crashes). The healthcheck makes
    # docker flip the container to (unhealthy) which deploy.sh's audit
    # treats as 'needs heal' and the watchdog rotates it on the next sweep.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/admin/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  quick-donation-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-quick-donation:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 48M
    depends_on:
      - backend-dev
    networks:
      - dev-internal

  kiosk-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-kiosk:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 48M
    depends_on:
      - backend-dev
    networks:
      - dev-internal

  screen-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-screen:dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 48M
    depends_on:
      - backend-dev
    networks:
      - dev-internal

  # Service portal (donation web app) on dev. The image was built with
  # VITE_BASE=/ for prod, so we serve it at the root of its own port (8082)
  # rather than behind the dev nginx /service/ prefix — that would break
  # all asset paths since Vite hard-codes the base into bundle imports.
  # The SPA's API calls go to /api/v1 (relative) → same origin :8082 →
  # the service container's nginx. Add /api proxy in service Dockerfile or
  # rebuild with absolute VITE_API_URL if you need full functionality;
  # for now the card lets you preview the UI.
  service-dev:
    image: ghcr.io/kammelaraj-arch/shitaleco-service:dev
    restart: unless-stopped
    ports:
      - "8082:80"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 48M
    depends_on:
      - backend-dev
    networks:
      - dev-internal

  nginx-dev:
    image: nginx:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf-dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/hub:/usr/share/nginx/hub:ro
    depends_on:
      - backend-dev
      - admin-dev
      - quick-donation-dev
      - kiosk-dev
      - screen-dev
    networks:
      - dev-internal
    # Same rationale as admin-dev — nginx-dev had no healthcheck so docker
    # couldn't tell when the reverse proxy was wedged. wget hits the dev
    # hub static page which nginx serves directly (no upstream needed).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata-dev:

networks:
  dev-internal:
    driver: bridge
  # The deployer service runs in the prod compose stack on its own internal
  # network. Reference it as external so backend-dev can resolve "deployer"
  # and the dev admin Environments card stops showing "Deployer unreachable".
  prod-bridge:
    external: true
    name: shitaleco_internal
