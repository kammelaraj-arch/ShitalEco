# Top-level project name pin — without this, the container names default
# to `<cwd-basename>-<service>-<idx>`. The deployer container's working dir
# is /workspace (bind-mount of /opt/shitaleco), so compose used to create
# `workspace-backend-1` etc., racing with `shitaleco-backend-1` for port
# 8000 and 502'ing prod every time. Pinning the name kills that whole
# class of bug — there is exactly ONE project namespace ever.
name: shitaleco

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shitaleco_db}
      POSTGRES_USER: ${POSTGRES_USER:-shitaleco_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shitaleco_db_user} -d ${POSTGRES_DB:-shitaleco_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    image: ghcr.io/kammelaraj-arch/shitaleco-backend:latest
    restart: unless-stopped
    # mem_limit and cpus at the top level are enforced by `docker compose up`
    # (the non-swarm path). `deploy.resources.limits` BELOW is for swarm/k8s
    # only and is silently IGNORED by `docker compose up`. That was the
    # 12-Jun "backend dies every 3 min" bug: the 1024M was never actually
    # capped, backend grew unbounded, host OOM-killer eventually picked it.
    mem_limit: 1024M
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    # Use alembic upgrade head only — never stamp base (would wipe migration history)
    command: >
      sh -c "alembic upgrade head 2>&1 || echo 'WARNING: alembic failed';
             exec uvicorn shital.main:app --host 0.0.0.0 --port 8000
                  --workers 1 --loop uvloop --http httptools"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shitaleco_db_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shitaleco_db}
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      # /admin basePath required (Next.js basePath:'/admin') + trailing slash
      # to match Azure AD's exact-match redirect URI rule. The same Azure AD
      # app handles dev too, with both URLs registered.
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-https://admin.shital.org.uk/admin/auth-callback/}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-live}
      DEPLOY_SECRET: ${DEPLOY_SECRET:?DEPLOY_SECRET must be set in /opt/shitaleco/.env}
      DEPLOYER_URL: http://deployer:9000
      # Mail-agent inbound-mail poller. MODE "auto" → rules-based extractor
      # when no Anthropic key is configured, Claude agent when one is.
      MAIL_AGENT_MAILBOXES: ${MAIL_AGENT_MAILBOXES:-accounts@shirdisai.org.uk,gtrustees@shirdisai.org.uk}
      MAIL_AGENT_MODE: ${MAIL_AGENT_MODE:-auto}
      # Background recovery loop: sweeps PENDING SumUp donations every 15 min,
      # mails a digest of unresolved system_alerts. Re-enabled now that Neuron
      # is gone (it was Neuron killing backend 4 min in, not the recovery_loop).
      RECOVERY_LOOP_ENABLED: ${RECOVERY_LOOP_ENABLED:-1}
    volumes:
      - /opt/shitaleco/backups:/opt/shitaleco/backups
      - /opt/shitaleco/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Healthcheck re-enabled (12-Jun afternoon): the "external killer" turned
    # out to be the Neuron-platform deployer co-located on the host (now
    # fully purged via .github/workflows/kill-neuron-restart-backend.yml).
    # With Neuron gone, no other process acts on docker unhealthy status,
    # so docker's own healthcheck is safe to use again.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  admin:
    image: ghcr.io/kammelaraj-arch/shitaleco-admin:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  quick-donation:
    image: ghcr.io/kammelaraj-arch/shitaleco-quick-donation:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  kiosk:
    image: ghcr.io/kammelaraj-arch/shitaleco-kiosk:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  screen:
    image: ghcr.io/kammelaraj-arch/shitaleco-screen:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  service:
    image: ghcr.io/kammelaraj-arch/shitaleco-service:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          # 64M was hitting the OOM killer during deploys when nginx workers
          # buffered concurrent connections + Docker's image-pull pressure
          # squeezed the host. 128M gives headroom and is still well below
          # the 2GB VPS budget.
          memory: 128M
    depends_on:
      - backend
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  backup-scheduler:
    build:
      context: ./infra/cron
    container_name: shitaleco-backup-cron
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    environment:
      TZ: Europe/London
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shitaleco_db}
      POSTGRES_USER: ${POSTGRES_USER:-shitaleco_db_user}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount the script so updates take effect without rebuilding the
      # scheduler image (the previous baked-in copy went stale and broke uploads)
      - ./infra/backup.sh:/opt/shitaleco/infra/backup.sh:ro
      - /opt/shitaleco/backups:/opt/shitaleco/backups
      - ./.env:/opt/shitaleco/.env:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  deployer:
    build:
      context: ./deployer
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          # 128M wasn't enough during a full promote: deploy.sh shells out to
          # docker pulls + retags + pg_dump in parallel, each spawning child
          # processes. OOM-killed mid-deploy meant the rest of the deploy
          # silently aborted. 256M is comfortable and the deployer is idle
          # 99% of the time so the extra ceiling rarely materialises in RSS.
          memory: 256M
    environment:
      DEPLOY_SECRET: ${DEPLOY_SECRET:?DEPLOY_SECRET must be set in /opt/shitaleco/.env}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      DOCKER_BUILDKIT: "1"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # ⚠️ DEPLOY_WATCHDOG=0 — the in-deployer 60s watchdog loop was the
      # 12-Jun all-day prod-outage cause. It force-recreated prod backend
      # whenever (a) its slow 3-4 min cold start tripped docker's healthcheck
      # to 'unhealthy', or (b) a `docker inspect` timed out under host load
      # and returned 'absent' for a HEALTHY container. Either way it SIGKILLed
      # a fine backend → fresh cold start → tripped again → infinite
      # crashloop. The host-side systemd shital-assert-state.timer already
      # heals a genuinely-down backend, safely (acts only on state!=running,
      # never on 'unhealthy' or inspect-timeout). So the deployer watchdog
      # is pure downside on prod. Keep it OFF.
      DEPLOY_WATCHDOG: "0"
    volumes:
      - /opt/shitaleco:/workspace
      # Read access to the dev stack files so /ops/run can pull/recreate dev too.
      - /opt/shitaleco-dev:/workspace-dev
      - /var/run/docker.sock:/var/run/docker.sock
      # Audit log for /ops/run
      - /var/log:/var/log
      # Bind-mount BOTH deploy.sh AND server.py so updates to either take
      # effect on next webhook call without rebuilding the deployer image.
      # Lesson learned: anything baked into a container image goes stale.
      - ./deployer/deploy.sh:/app/deploy.sh:ro
      - ./deployer/server.py:/app/server.py:ro
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    # `host.docker.internal:host-gateway` lets the prod nginx reach the host's
    # published ports from inside the container — specifically host:8080,
    # which is the dev nginx (it lives on its own docker network, so it
    # can't be resolved by service name from this container). The
    # dev.shital.org.uk server block in nginx.conf proxies to that.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/hub:/usr/share/nginx/hub:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - admin
      - quick-donation
      - kiosk
      - screen
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
